tasks.register('verifyLargeFiles') {
    group = 'verification'
    description = 'Applies the 500-line Java-file debt ratchet.'
    inputs.files(guardedJavaSources)
    doLast {
        def oversized = guardedJavaSources.files.findAll { source -> source.readLines().size() > 500 }
        if (!oversized.isEmpty()) {
            throw new GradleException("Java files exceed the 500-line guardrail: ${oversized.join(', ')}")
        }
    }
}

tasks.register('guardrails') {
    group = 'verification'
    description = 'Runs fast architecture and LLM-drift guardrails.'
    dependsOn tasks.named('verifyJava21'), tasks.named('verifyArchitecture'),
            tasks.named('verifyWorkspaceHygiene'), tasks.named('verifyLargeFiles'),
            tasks.named('verifySourceIsolation'), tasks.named('verifyJavaStyle'),
            tasks.named('verifyPortableConfiguration'), tasks.named('verifyProjectSkills'),
            tasks.named('testContinuityLedgerValidator'), tasks.named('verifyContinuityLedger'),
            tasks.named('testArchitectureContract'), tasks.named('verifyArchitectureContract'),
            tasks.named('testHarvesterContourOverlay'), tasks.named('testHarvesterAnatomicalModels'),
            tasks.named('testHarvesterVolumeBakeoff'), tasks.named('testHarvesterPrimaryModelOverlay'), tasks.named('testCollectorDirectMeshProtocol'),
            tasks.named('testHarvesterBlindPairwise'), tasks.named('testHunyuan2mvPreparation'), tasks.named('testHunyuan2mvExternalSheetPreparation'), tasks.named('testHistoricalBlenderOperationIsolation'),
            tasks.named('testBlenderWinAppControls'), tasks.named('testAutomodelContracts'),
            tasks.named('testAutomodelMultiviewRing'),
            tasks.named('testAutomodelRingBenchmark'),
            tasks.named('testAutomodelPoseDepthRing'),
            tasks.named('testDa3RingContracts'),
            tasks.named('testVggtReviewedRingContracts'),
            tasks.named('testSv3dOrbitContracts'), tasks.named('testEdit360OrbitContracts'),
            tasks.named('testSv3dMultiviewBenchmark'), tasks.named('testVggtOmegaCollectorPilot')
}

tasks.named('check') {
    dependsOn tasks.named('guardrails')
}

