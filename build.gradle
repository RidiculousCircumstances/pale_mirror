def requiredArchitectureStatements = [
        'Pale Mirror is the only canonical owner of world progression, scenarios, and desired state; Minecraft and adapters are observed/materialized representations.',
        'Production code mutates canonical WorldState only through a DomainCommandExecutor transaction; collection views are immutable, package-private mutation is reserved for the command processor, and persistence hydration is isolated to codecs.',
        'Schema-v40 snapshots are accepted only after canonical aggregate and physical-projection validation; orphan references, duplicate active jobs and mismatched exact parcel bindings fail closed before save or after hydration.',
        'Detailed domain history, terminal journeys and terminal materialization jobs have fixed upper bounds; deterministic summaries and receipts preserve aggregate causality without allowing server-lifetime growth.',
        'Shared facility output is allocated deterministically across active routes by destination demand and explicit route weight; route identity is used only for stable remainder ordering and never as economic priority.',
        'Domain code must not import Minecraft, NeoForge, persistence, adapters, wall-clock, or ambient random APIs.',
        'Materialization is performed only by NeoForge executors with persisted jobs, explicit identity, preconditions, and postconditions.',
        'Observers publish typed facts; reconciliation alone converts them into domain commands and events.',
        'Unknown or player-owned block changes are conflicts and must not be overwritten by default.',
        'Source-specific identity, native mappings and source policy live only in isolated adapters; generic layers use source-neutral contracts.',
        'The native Atlas and optional JourneyMap waypoints consume only a bounded server-authored read-only projection; client UI may submit intent but never owns canonical state, coordinates, scenario authority or map persistence.'
        ,'Fresh-world visual genesis is distinct from reconciliation materialization; one dedicated coordinator uses a bounded configurable worker pool for independent terrain probes and candidate attempts, then deterministically reduces indexed results and compiles immutable manifests into chunk-addressed slices before players are admitted. A registered worldgen Feature may apply only the current slice while that chunk is naturally generating. Loaded-chunk events observe persisted generation stamps and never write static geometry; prospective chunks are never force-loaded and there is no retrofit or pre-v40 compatibility path.'
        ,'Every authored settlement is an immutable terrain-led site plan selected from a bounded archetype catalog. Buildings have stable identity, categories, functions, local foundations, semantic slots, ports and state profiles; each curated NBT module declares its real local threshold and canonical outward facade, and module rotation, door, apron and obstacle-aware circulation derive from that one contract rather than a bounding-box midpoint. Open spaces, circulation, segmented defences, irregular managed-area unions and five parcels plus two annex easements are typed and validated, and no radial wall or global settlement terrace is synthesized as a hidden fallback.'
        ,'The required Pale Mirror Visuals provider receives only immutable server-authored genesis facts and read-only canonical projections; it may own physical structures, resident carriers, animation, sound and particles, but never progression, economy, scenario or threat decisions.'
        ,'Automodel is an offline research boundary: source-pinned references and traces decide likeness, all model output remains provenance-pinned noncanonical evidence under ignored build artifacts, and no Automodel operation may write canonical Blender sources, PMMesh exports, runtime resources, server state or world state.'
]

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks Pale Mirror layer boundaries and required architecture invariants.'
    inputs.file(architectureFile)
        inputs.files(domainJavaSources, apiJavaSources, visualJavaSources)
    doLast {
        if (!architectureFile.exists()) {
            throw new GradleException('architecture.yml is missing')
        }
        String architecture = architectureFile.getText('UTF-8')
        requiredArchitectureStatements.each { statement ->
            if (!architecture.contains(statement)) {
                throw new GradleException("architecture.yml is missing required invariant: ${statement}")
            }
        }

        def forbiddenDomainReferences = [
                'net.minecraft.', 'net.neoforged.', 'io.farfrontier.palemirror.internal.',
                'System.currentTimeMillis', 'Instant.now', 'LocalDateTime.now', 'Math.random', 'new Random('
        ]
        domainJavaSources.files.each { source ->
            String text = source.getText('UTF-8')
            forbiddenDomainReferences.each { reference ->
                if (text.contains(reference)) {
                    throw new GradleException("Domain boundary violation: ${source} references ${reference}")
                }
            }
        }

        apiJavaSources.files.each { source ->
            if (source.getText('UTF-8').contains('io.farfrontier.palemirror.internal.')) {
                throw new GradleException("API boundary violation: ${source} imports internal implementation")
            }
        }

        visualJavaSources.files.each { source ->
            String text = source.getText('UTF-8')
            ['io.farfrontier.palemirror.internal.', 'io.farfrontier.palemirror.domain.'].each { reference ->
                if (text.contains(reference)) {
                    throw new GradleException("Visuals boundary violation: ${source} references ${reference}")
                }
            }
        }

        genericNeoForgeJavaSources.files.each { source ->
            String text = source.getText('UTF-8')
            if (text.contains('WorldStateHydration')
                    && !source.path.endsWith('/internal/world/PaleMirrorSavedData.java')
                    && !source.path.endsWith('/internal/world/RegionalStateCodec.java')
                    && !source.path.endsWith('/internal/world/JourneyStateCodec.java')) {
                throw new GradleException("Hydration boundary violation: ${source} references WorldStateHydration")
            }
            def directMutation = (text =~ /\.worldState\(\)\.(put|set|clear|add)[A-Z]\w*\(/)
            if (directMutation.find()) {
                throw new GradleException("Canonical state mutation bypasses DomainCommandExecutor: ${source}")
            }
        }
    }
}

tasks.register('verifyJavaStyle') {
    group = 'verification'
    description = 'Rejects tabs, trailing whitespace and oversized Java lines without rewriting user files.'
    inputs.files(guardedJavaSources)
    doLast {
        guardedJavaSources.files.each { source ->
            source.readLines().eachWithIndex { line, index ->
                if (line.contains('\t')) throw new GradleException("Java style: tab in ${source}:${index + 1}")
                if (line != line.stripTrailing()) throw new GradleException("Java style: trailing whitespace in ${source}:${index + 1}")
                if (line.length() > 250 && !line.trim().startsWith('//')) {
                    throw new GradleException("Java style: line exceeds 250 columns in ${source}:${index + 1}")
                }
            }
        }
    }
}

tasks.register('verifyPortableConfiguration') {
    group = 'verification'
    description = 'Rejects checked-in machine-specific absolute project paths.'
    inputs.files(fileTree('.') {
        include '**/*.gradle', '**/*.properties', '**/*.sh', '**/*.ps1', '**/*.cmd'
        exclude '**/build/**', '.gradle/**'
    })
    doLast {
        inputs.files.files.each { source ->
            String text = source.getText('UTF-8')
            String forbiddenUnixRoot = '/home/' + 'rd/'
            if (text.contains(forbiddenUnixRoot) || text.contains(':\\Users\\')) {
                throw new GradleException("Machine-specific path in ${source}; use a Gradle property or repository-relative path")
            }
        }
    }
}

tasks.register('verifySourceIsolation') {
    group = 'verification'
    description = 'Rejects source-specific integrations leaking into domain or generic NeoForge layers.'
    inputs.files(domainJavaSources, genericNeoForgeJavaSources)
    doLast {
        // Lower-case biological language belongs to the source-neutral Frontier
        // model; only the proper source-adapter identity itself is forbidden.
        def forbiddenDomainTokens = ['Crimson', 'Spore', 'Millenaire', 'Millénaire', 'crimson', 'millenaire']
        domainJavaSources.files.each { source ->
            String text = source.getText('UTF-8')
            forbiddenDomainTokens.each { token ->
                if (text.contains(token)) {
                    throw new GradleException("Domain source-identity leak: ${source} references ${token}")
                }
            }
        }

        def forbiddenGenericReferences = [
                'internal.integration.crimson.', 'internal.integration.spore.',
                'CrimsonSandboxAdapter', 'SporeSandboxAdapter', 'CreateLogisticsAdapter', 'internal.integration.create.',
                'MillenaireSettlementAdapter', 'internal.integration.millenaire.',
                'CrimsonGate', 'CrimsonSiege', 'SporeSandbox',
                'InfectionSourceId.CRIMSON', 'InfectionSourceId.SPORE',
                'ENSURE_CRIMSON_', 'REMOVE_CRIMSON_', 'ENSURE_SPORE_', 'REMOVE_SPORE_',
                'JourneyMap', 'journeymap.'
        ]
        genericNeoForgeJavaSources.files.each { source ->
            String text = source.getText('UTF-8')
            forbiddenGenericReferences.each { reference ->
                if (text.contains(reference)) {
                    throw new GradleException("Source adapter boundary violation: ${source} references ${reference}")
                }
            }
        }
    }
}

tasks.register('verifyWorkspaceHygiene') {
    group = 'verification'
    description = 'Rejects tracked generated runtime state and real environment files.'
    inputs.property('trackedFiles', trackedFiles)
    doLast {
        def tracked = trackedFiles.get()
        def forbidden = tracked.findAll { path ->
            path == '.env' || path.startsWith('.env.') || path.startsWith('.gradle/') ||
                    path.startsWith('run/') || path.contains('/runs/') || path.startsWith('build/') ||
                    path.contains('/build/') || path.startsWith('.idea/') ||
                    (path.endsWith('.jar') && path != 'gradle/wrapper/gradle-wrapper.jar')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Generated/local workspace state must not be tracked: ${forbidden.join(', ')}")
        }
    }
}

tasks.register('verifyProjectSkills') {
    group = 'verification'
    description = 'Checks mandatory repo-local Pale Mirror skills and their AGENTS routing.'
    inputs.file(agentRulesFile)
    inputs.files(mandatoryProjectSkillFiles.values().collectMany { files -> [files.skill, files.metadata] })
    doLast {
        String agentRules = agentRulesFile.getText('UTF-8')
        mandatoryProjectSkills.each { name ->
            File skill = mandatoryProjectSkillFiles[name].skill
            File metadata = mandatoryProjectSkillFiles[name].metadata
            if (!skill.exists() || !metadata.exists()) {
                throw new GradleException("Mandatory project skill is incomplete: ${name}")
            }
            String skillText = skill.getText('UTF-8')
            String metadataText = metadata.getText('UTF-8')
            if (!skillText.startsWith("---\nname: ${name}\ndescription: ") || skillText.contains('TODO')) {
                throw new GradleException("Mandatory project skill has invalid frontmatter or TODOs: ${name}")
            }
            if (!metadataText.contains('allow_implicit_invocation: true')) {
                throw new GradleException("Mandatory project skill must allow implicit invocation: ${name}")
            }
            String route = ".agents/skills/${name}/SKILL.md"
            if (!agentRules.contains(route)) {
                throw new GradleException("AGENTS.md is missing mandatory skill routing: ${route}")
            }
        }
    }
}

