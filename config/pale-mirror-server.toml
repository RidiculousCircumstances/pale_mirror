[journeys]
	# 0 means materialize the complete canonical travelling population.
	maxMaterializedResidents = 0
	spawnBudgetPerTick = 4

[ambientSpawns]
	# Preserve only 20% of otherwise valid ordinary hostile spawn attempts.
	hostileAttemptChance = 0.2
	# Preserve 55% of ordinary passive, ambient and water spawn attempts.
	peacefulAttemptChance = 0.55
	# Effective loaded caps are multiplied by active non-spectator players per dimension.
	hostileCapPerPlayer = 24
	peacefulCapPerPlayer = 32

[runtime]
	softBudgetMillis = 3.0
	weightBudget = 256

[distantHorizons]
	# DH builds and synchronizes LODs only from chunks already generated by Minecraft.
	cacheOnlyControl = true
	fastTravelEnterBlocksPerSecond = 12.0
	fastTravelExitBlocksPerSecond = 6.0
	fastTravelRecoverySeconds = 10
	normalRuntimeRatio = 0.35
	fastTravelRuntimeRatio = 0.05
