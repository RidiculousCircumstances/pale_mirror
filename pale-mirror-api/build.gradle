plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

/* The experimental SPI is a real compile-time boundary and owns its sources. */

neoForge {
    version = rootProject.providers.gradleProperty('neo_version').get()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
