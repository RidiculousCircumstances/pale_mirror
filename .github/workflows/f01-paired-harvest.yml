name: F0.1 paired-harvest native matrix

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: pale-mirror

jobs:
  matrix:
    runs-on: [self-hosted, pm-native]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - worker: worker-0
            port: 26100
            variants: never_loaded,arrival_checkpoint_one
          - worker: worker-1
            port: 26110
            variants: arrival_checkpoint_two,unload_return
          - worker: worker-2
            port: 26120
            variants: player_intervention,graceful_restart
          - worker: worker-3
            port: 26130
            variants: abrupt_restart,neutral_observer_differential
    env:
      FRONTIER_V3_PILOT_PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run immutable assigned native variants
        run: |
          export FRONTIER_V3_NATIVE_PROCESS_ROOT="$RUNNER_TEMP/f01-${{ github.run_id }}-${{ matrix.worker }}"
          export GRADLE_USER_HOME="$RUNNER_TEMP/f01-${{ github.run_id }}-${{ matrix.worker }}-gradle"
          mkdir -p "$FRONTIER_V3_NATIVE_PROCESS_ROOT"
          mkdir -p "$GRADLE_USER_HOME"
          IFS=, read -r -a variants <<< '${{ matrix.variants }}'
          for variant in "${variants[@]}"; do
            scripts/with-private-xvfb.sh node tools/frontier-v3-test-pilot/src/run-f0v-matrix.mjs \
              tools/frontier-v3-test-pilot/contracts/resource-site-harvest-f0v.json \
              --variant="$variant" --output-root="build/f01-native/${{ matrix.worker }}/$variant"
          done
          node -e 'const fs=require("fs"),path=require("path"); const root="build/f01-native/${{ matrix.worker }}"; const reports=fs.readdirSync(root).map(variant=>JSON.parse(fs.readFileSync(path.join(root,variant,"matrix.json")))); fs.writeFileSync(path.join(root,"matrix.json"),JSON.stringify({build:reports[0].build,variants:reports.flatMap(report=>report.variants)}));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f01-${{ github.run_id }}-${{ matrix.worker }}
          path: pale-mirror/build/f01-native/${{ matrix.worker }}
          if-no-files-found: error
  merge:
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: f01-${{ github.run_id }}-worker-*
          path: pale-mirror/build/f01-evidence
      - name: Merge complete comparable native evidence
        run: >-
          node tools/frontier-v3-test-pilot/src/merge-f01-paired-harvest.mjs
          --input=build/f01-evidence --head=${{ github.sha }} --run=${{ github.run_id }} --output=build/f01-merge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f01-${{ github.run_id }}-merge
          path: pale-mirror/build/f01-merge.json
          if-no-files-found: warn
