name: F0.2B four-worker reference-container semantics

on:
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Immutable F0.2B semantic-matrix identity.
        required: true
        type: string
      task_root:
        description: Dedicated ephemeral /home/rd/proj/pm-f0vc-* prepared-runtime root.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  producer:
    name: F0.2B prepared runtime producer
    runs-on: [self-hosted, pm-native]
    defaults:
      run:
        working-directory: f02b-${{ github.run_id }}-producer-workspace/pale-mirror
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: f02b-${{ github.run_id }}-producer-workspace
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit four isolated native slots before preparation
        run: >-
          node tools/frontier-v3-test-pilot/src/f0vb-capacity-preflight.mjs
          --root="${{ inputs.task_root }}" --workers=4 --memory-per-worker-mib=6144 --output="$PWD/f02b-artifacts/producer/capacity.json"
      - name: Build, package, and stage the one immutable runtime
        env:
          # The prepared runtime fingerprints Java's exact visible launch environment.
          # Consumers execute the same bounded envelope, so preparation must see it too.
          JAVA_TOOL_OPTIONS: -Xmx3G
        run: |
          mkdir -p "$PWD/build/f02b-producer"
          node tools/frontier-v3-test-pilot/src/prepare-native-build.mjs --output=build/f02b-producer/prepared-build.json
          ./gradlew :pale-mirror-neoforge:verifyPackagedJar --offline --no-daemon
          node tools/frontier-v3-test-pilot/src/f0vc-prepared-runtime.mjs --mode=prepare \
            --store="${{ inputs.task_root }}" --prepared=build/f02b-producer/prepared-build.json \
            --output=build/f02b-producer/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02b-${{ github.run_id }}-producer
          path: f02b-${{ github.run_id }}-producer-workspace/pale-mirror/build/f02b-producer
          if-no-files-found: error

  semantic:
    name: F0.2B ${{ matrix.worker }}
    needs: producer
    runs-on: [self-hosted, pm-native]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - worker: worker-0
            lane: depot-never-visited
          - worker: worker-1
            lane: depot-visited-unloaded
          - worker: worker-2
            lane: hive-zero-player
          - worker: worker-3
            lane: conflict-restart
    defaults:
      run:
        working-directory: f02b-${{ github.run_id }}-${{ matrix.worker }}-workspace/pale-mirror
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: f02b-${{ github.run_id }}-${{ matrix.worker }}-workspace
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allocate immutable semantic evidence custody
        run: mkdir -p "$PWD/f02b-artifacts/${{ matrix.worker }}"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: f02b-${{ github.run_id }}-producer
          path: f02b-${{ github.run_id }}-${{ matrix.worker }}-workspace/pale-mirror/build/f02b-producer
      - name: Bind active GitHub job and runner identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/frontier-v3-test-pilot/src/capture-f0vb-job-identity.mjs
          --repository="${{ github.repository }}" --run="${{ github.run_id }}"
          --worker="${{ matrix.worker }}" --job-prefix="F0.2B" --output="$PWD/f02b-artifacts/${{ matrix.worker }}/job.json"
      - name: Declare worker-private Minecraft namespaces
        run: >-
          node tools/frontier-v3-test-pilot/src/prepare-f02b-isolation.mjs
          --workspace="$GITHUB_WORKSPACE" --temp="$RUNNER_TEMP" --run="${{ github.run_id }}" --attempt="${{ github.run_attempt }}"
          --worker="${{ matrix.worker }}" --output="$PWD/f02b-artifacts/${{ matrix.worker }}/namespaces.json"
      - name: Run one actual isolated Minecraft semantic lane
        env:
          JAVA_TOOL_OPTIONS: -Xmx3G
        run: |
          namespaces="$PWD/f02b-artifacts/${{ matrix.worker }}/namespaces.json"
          export FRONTIER_V3_PILOT_PORT="$(node -p "JSON.parse(require('fs').readFileSync('$namespaces')).port")"
          export FRONTIER_V3_NATIVE_PROCESS_ROOT="$(node -p "JSON.parse(require('fs').readFileSync('$namespaces')).process")"
          scripts/with-private-xvfb.sh node tools/frontier-v3-test-pilot/src/run-f02b-native-semantic.mjs \
            --output="$PWD/f02b-artifacts/${{ matrix.worker }}/semantic.json" \
            --log="$PWD/f02b-artifacts/${{ matrix.worker }}/minecraft.log" \
            --runtime="$PWD/build/f02b-producer/runtime.json" \
            --namespaces="$namespaces" --identity="$PWD/f02b-artifacts/${{ matrix.worker }}/job.json" \
            --worker="${{ matrix.worker }}" --lane="${{ matrix.lane }}" \
            --qualification="${{ inputs.qualification_id }}" --repository="${{ github.repository }}" \
            --head="${{ github.sha }}" --workflow-sha="${{ github.workflow_sha }}" --workflow="${{ github.workflow_ref }}" \
            --run="${{ github.run_id }}" --attempt="${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02b-${{ github.run_id }}-${{ matrix.worker }}
          path: f02b-${{ github.run_id }}-${{ matrix.worker }}-workspace/pale-mirror/f02b-artifacts/${{ matrix.worker }}
          if-no-files-found: error
  merge:
    needs: semantic
    if: always()
    runs-on: [self-hosted, pm-native]
    defaults:
      run:
        working-directory: f02b-${{ github.run_id }}-merge-workspace/pale-mirror
    steps:
      - uses: actions/checkout@v4
        with:
          path: f02b-${{ github.run_id }}-merge-workspace
      - run: mkdir -p f02b-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: f02b-${{ github.run_id }}-worker-*
          path: f02b-${{ github.run_id }}-merge-workspace/pale-mirror/f02b-evidence
      - name: Write complete or incomplete fail-closed aggregate
        run: >-
          node tools/frontier-v3-test-pilot/src/merge-f02b-native-semantic.mjs --input=f02b-evidence
          --qualification="${{ inputs.qualification_id }}" --repository="${{ github.repository }}"
          --head="${{ github.sha }}" --workflow-sha="${{ github.workflow_sha }}" --workflow="${{ github.workflow_ref }}"
          --run="${{ github.run_id }}" --attempt="${{ github.run_attempt }}" --output=f02b-merge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02b-${{ github.run_id }}-merge
          path: f02b-${{ github.run_id }}-merge-workspace/pale-mirror/f02b-merge.json
          if-no-files-found: warn
