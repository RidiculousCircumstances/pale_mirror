def downloadVerifiedIntegrationJar = { String taskName, def targetFile, String sourceUrl, String expectedSha512, String label ->
    tasks.register(taskName) {
        group = 'verification'
        description = "Downloads the pinned ${label} runtime JAR and verifies SHA-512; normal builds never invoke it."
        outputs.file(targetFile)
        inputs.property('url', sourceUrl)
        inputs.property('sha512', expectedSha512)
        doLast {
            def target = targetFile.get().asFile
            target.parentFile.mkdirs()
            byte[] bytes = new URL(sourceUrl).bytes
            String actual = java.security.MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex().toString()
            if (!actual.equalsIgnoreCase(expectedSha512)) {
                throw new GradleException("Pinned ${label} SHA-512 mismatch: expected ${expectedSha512}, got ${actual}")
            }
            target.bytes = bytes
        }
    }
}

