                'assets/spore/textures/entity/baio.png',
                'assets/spore/textures/entity/spitter.png',
                'assets/spore/textures/entity/acid_round.png',
                'assets/spore/particles/acid_bullet.json',
                'assets/spore/sounds/slash.ogg',
                'assets/spore/sounds/braiomil_attack.ogg',
                'assets/spore/sounds/spitter_spit1.ogg'
        ]
        def jar = new java.util.jar.JarFile(sporeIntegrationJar.get().asFile)
        try {
            requiredEntries.each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("Pinned Spore visual resource is missing: ${entry}")
            }
        } finally {
            jar.close()
        }
    }
}

