            prepareRailwayClientMods,
            prepareFtbClientMods, prepareMillenaireClientMods
    workingDir rootProject.projectDir
    environment 'PALE_MIRROR_XVFB', System.getenv('PALE_MIRROR_XVFB') ?: ''
    commandLine 'bash', 'scripts/client-smoke-harness.sh', rootProject.projectDir.absolutePath
}

tasks.register('ftbIntegrationHarness', Exec) {
    group = 'verification'
    description = 'Boots the final PM JAR beside the checksum-verified FTB Quests stack twice and verifies journal provisioning.'
    dependsOn tasks.named('jar'), downloadFtbQuestsIntegrationJar, downloadFtbLibraryIntegrationJar,
            downloadFtbTeamsIntegrationJar, downloadArchitecturyIntegrationJar
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    environment 'PALE_MIRROR_JAVA', harnessLauncher.get().executablePath.asFile.absolutePath
    commandLine 'bash', 'scripts/ftb-integration-harness.sh', distributableJar.get().asFile.absolutePath,
            ftbQuestsIntegrationJar.get().asFile.absolutePath, ftbLibraryIntegrationJar.get().asFile.absolutePath,
            ftbTeamsIntegrationJar.get().asFile.absolutePath, architecturyIntegrationJar.get().asFile.absolutePath
}

tasks.register('millenaireIntegrationHarness', Exec) {
