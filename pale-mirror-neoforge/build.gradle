plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

base {
    archivesName = rootProject.providers.gradleProperty('mod_id').get()
}

def crimsonIntegrationJar = layout.buildDirectory.file('integration/crimson_curse-1.4.3.1.jar')
def crimsonIntegrationUrl = rootProject.providers.gradleProperty('crimson_integration_url').get()
def crimsonIntegrationSha512 = rootProject.providers.gradleProperty('crimson_integration_sha512').get()

dependencies {
    implementation project(':pale-mirror-domain')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = rootProject.providers.gradleProperty('neo_version').get()

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.providers.gradleProperty('mod_id').get()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
        }
        crimsonGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/crimson-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
        }
    }

    mods {
        pale_mirror {
            sourceSet sourceSets.main
            sourceSet project(':pale-mirror-domain').sourceSets.main
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
            minecraft_version_range: rootProject.providers.gradleProperty('minecraft_version_range').get(),
            neo_version            : rootProject.providers.gradleProperty('neo_version').get(),
            loader_version_range   : rootProject.providers.gradleProperty('loader_version_range').get(),
            mod_id                 : rootProject.providers.gradleProperty('mod_id').get(),
            mod_name               : rootProject.providers.gradleProperty('mod_name').get(),
            mod_license            : rootProject.providers.gradleProperty('mod_license').get(),
            mod_version            : rootProject.providers.gradleProperty('mod_version').get()
    ]
    inputs.properties(properties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    expand(properties)
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.named('jar', Jar).configure {
    dependsOn project(':pale-mirror-domain').tasks.named('classes')
    from project(':pale-mirror-domain').sourceSets.main.output
}

def distributableJar = tasks.named('jar', Jar).flatMap { it.archiveFile }

tasks.register('verifyPackagedJar') {
    group = 'verification'
    description = 'Fails if the distributable mod jar does not embed the domain module.'
    dependsOn tasks.named('jar')
    inputs.file(distributableJar)
    doLast {
        def jarFile = distributableJar.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            if (jar.getEntry('io/farfrontier/palemirror/domain/WorldState.class') == null) {
                throw new GradleException("${jarFile} does not embed pale-mirror-domain classes")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.register('verifyCrimsonSandboxPackaging') {
    group = 'verification'
    description = 'Fails if the final JAR omits the always-active Crimson sandbox datapack, tier policy, or base actor initializers.'
    dependsOn tasks.named('jar')
    inputs.file(distributableJar)
    doLast {
        def requiredEntries = [
                'crimson_sandbox/pack.mcmeta',
                'crimson_sandbox/data/crimson_curse/function/load.mcfunction',
                'crimson_sandbox/data/crimson_curse/function/tick.mcfunction',
                'data/pale_mirror/pale_mirror/threat_tiers/default.json',
                'data/pale_mirror/function/crimson/v1431/initialize_human.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_villager.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_husk.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_skeleton.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_drowned.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_bogged.mcfunction',
                'data/pale_mirror/function/crimson/v1431/initialize_wither_skeleton.mcfunction'
        ]
        def jar = new java.util.jar.JarFile(distributableJar.get().asFile)
        try {
            requiredEntries.each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("Crimson sandbox entry is missing from final JAR: ${entry}")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.register('dedicatedRestartHarness', Exec) {
    group = 'verification'
    description = 'Boots the final JAR in a clean NeoForge runtime, crashes it, and verifies restart.'
    dependsOn tasks.named('jar')
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    environment 'PALE_MIRROR_JAVA', harnessLauncher.get().executablePath.asFile.absolutePath
    commandLine 'bash', 'scripts/dedicated-restart-harness.sh', distributableJar.get().asFile.absolutePath
}

tasks.register('downloadCrimsonIntegrationJar') {
    group = 'verification'
    description = 'Downloads the pinned Crimson runtime JAR and verifies SHA-512; normal builds never invoke it.'
    outputs.file(crimsonIntegrationJar)
    inputs.property('url', crimsonIntegrationUrl)
    inputs.property('sha512', crimsonIntegrationSha512)
    doLast {
        def target = crimsonIntegrationJar.get().asFile
        target.parentFile.mkdirs()
        byte[] bytes = new URL(crimsonIntegrationUrl).bytes
        String actual = java.security.MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex().toString()
        if (!actual.equalsIgnoreCase(crimsonIntegrationSha512)) {
            throw new GradleException("Pinned Crimson SHA-512 mismatch: expected ${crimsonIntegrationSha512}, got ${actual}")
        }
        target.bytes = bytes
    }
}

def prepareCrimsonGameTestMods = tasks.register('prepareCrimsonGameTestMods', Sync) {
    dependsOn tasks.named('downloadCrimsonIntegrationJar')
    from(crimsonIntegrationJar)
    into(layout.buildDirectory.dir('runs/crimson-game-test/mods'))
}

tasks.named('runCrimsonGameTestServer') {
    dependsOn prepareCrimsonGameTestMods
}

tasks.register('crimsonIntegrationHarness', Exec) {
    group = 'verification'
    description = 'Boots the final PM JAR beside the checksum-verified pinned Crimson JAR in a clean dedicated runtime.'
    dependsOn tasks.named('verifyCrimsonSandboxPackaging'), tasks.named('downloadCrimsonIntegrationJar')
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    environment 'PALE_MIRROR_JAVA', harnessLauncher.get().executablePath.asFile.absolutePath
    commandLine 'bash', 'scripts/crimson-integration-harness.sh', distributableJar.get().asFile.absolutePath,
            crimsonIntegrationJar.get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('verifyJava21'), tasks.named('verifyPackagedJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
