plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

base {
    archivesName = rootProject.providers.gradleProperty('mod_id').get()
}

def crimsonIntegrationJar = layout.buildDirectory.file('integration/crimson_curse-1.4.3.1.jar')
def crimsonIntegrationUrl = rootProject.providers.gradleProperty('crimson_integration_url').get()
def crimsonIntegrationSha512 = rootProject.providers.gradleProperty('crimson_integration_sha512').get()
def sporeIntegrationJar = layout.buildDirectory.file('integration/spore_1.21.1_2.2.0j_neo.jar')
def sporeIntegrationUrl = rootProject.providers.gradleProperty('spore_integration_url').get()
def sporeIntegrationSha512 = rootProject.providers.gradleProperty('spore_integration_sha512').get()
def createIntegrationJar = layout.buildDirectory.file('integration/create-1.21.1-6.0.10.jar')
def createIntegrationUrl = rootProject.providers.gradleProperty('create_integration_url').get()
def createIntegrationSha512 = rootProject.providers.gradleProperty('create_integration_sha512').get()
def railwayUntoldIntegrationJar = file(rootProject.findProperty('railway_untold_integration_jar')
        ?: rootProject.layout.projectDirectory.file('../railways-untold-pm/build/libs/railwaysuntold-neoforge-1.2.1-pm.1.jar').asFile)
def ftbQuestsIntegrationJar = layout.buildDirectory.file('integration/ftb-quests-neoforge-2101.1.30.jar')
def ftbLibraryIntegrationJar = layout.buildDirectory.file('integration/ftb-library-neoforge-2101.1.35.jar')
def ftbTeamsIntegrationJar = layout.buildDirectory.file('integration/ftb-teams-neoforge-2101.1.9.jar')
def architecturyIntegrationJar = layout.buildDirectory.file('integration/architectury-13.0.11-neoforge.jar')
def ftbQuestsIntegrationUrl = rootProject.providers.gradleProperty('ftb_quests_integration_url').get()
def ftbQuestsIntegrationSha512 = rootProject.providers.gradleProperty('ftb_quests_integration_sha512').get()
def ftbLibraryIntegrationUrl = rootProject.providers.gradleProperty('ftb_library_integration_url').get()
def ftbLibraryIntegrationSha512 = rootProject.providers.gradleProperty('ftb_library_integration_sha512').get()
def ftbTeamsIntegrationUrl = rootProject.providers.gradleProperty('ftb_teams_integration_url').get()
def ftbTeamsIntegrationSha512 = rootProject.providers.gradleProperty('ftb_teams_integration_sha512').get()
def architecturyIntegrationUrl = rootProject.providers.gradleProperty('architectury_integration_url').get()
def architecturyIntegrationSha512 = rootProject.providers.gradleProperty('architectury_integration_sha512').get()
def millenaireIntegrationJar = layout.buildDirectory.file('integration/millenaire-9.0.0-beta.2.jar')
def millenaireIntegrationUrl = rootProject.providers.gradleProperty('millenaire_integration_url').get()
def millenaireIntegrationSha512 = rootProject.providers.gradleProperty('millenaire_integration_sha512').get()
def coreGameTestDirectory = layout.buildDirectory.dir('runs/core-game-test').get().asFile
def crimsonGameTestDirectory = layout.buildDirectory.dir('runs/crimson-game-test').get().asFile
def sporeGameTestDirectory = layout.buildDirectory.dir('runs/spore-game-test').get().asFile
def createGameTestDirectory = layout.buildDirectory.dir('runs/create-game-test').get().asFile
def railwayGameTestDirectory = layout.buildDirectory.dir('runs/railway-game-test').get().asFile
def ftbGameTestDirectory = layout.buildDirectory.dir('runs/ftb-game-test').get().asFile
def millenaireGameTestDirectory = layout.buildDirectory.dir('runs/millenaire-game-test').get().asFile
def millenaireGameTestWorldDirectory = new File(millenaireGameTestDirectory, 'world')
def crimsonGameTestWorldDirectory = new File(crimsonGameTestDirectory, 'world')
def sporeGameTestWorldDirectory = new File(sporeGameTestDirectory, 'world')
def createGameTestWorldDirectory = new File(createGameTestDirectory, 'world')
def railwayGameTestWorldDirectory = new File(railwayGameTestDirectory, 'world')
def railwayManagedConfig = layout.buildDirectory.file('runs/railway-game-test/config/railways-untold/config.toml')
def railwayClientManagedConfig = layout.buildDirectory.file('runs/railway-client/config/railways-untold/config.toml')
def frontierV3PilotClientDirectory = layout.buildDirectory.dir('runs/frontier-v3-pilot-client')
def frontierV3PilotPackClientDirectory = layout.buildDirectory.dir('runs/frontier-v3-pilot-pack-client')
def frontierV3PilotServerDirectory = layout.buildDirectory.dir('runs/frontier-v3-pilot-server')
// Resolve isolated-run inputs during Gradle configuration so the RunGame task remains
// configuration-cache safe while it prepares a disposable game directory.
def frontierV3PilotServerRunDirectory = frontierV3PilotServerDirectory.get().asFile
def frontierV3PilotWorldName = providers.gradleProperty('frontierV3PilotWorld').orElse('frontier-v3-pilot-world').get()
def frontierV3PilotSeed = providers.gradleProperty('frontierV3PilotSeed').orElse('41').get()
def frontierV3PilotPort = providers.gradleProperty('frontierV3PilotPort').orElse('25575').get()
def frontierV3PilotOperator = providers.gradleProperty('frontierV3PilotUsername').orElse('PMTestPilot').get()
def frontierV3PilotReset = providers.gradleProperty('frontierV3PilotReset').orElse('false').get()
def frontierV3PilotRunId = providers.gradleProperty('frontierV3PilotRunId').orElse('').get()
def frontierV3PilotProfile = providers.gradleProperty('frontierV3PilotProfile').orElse('world').get()
def frontierV3PilotViewDistance = providers.gradleProperty('frontierV3PilotViewDistance').orElse('10').get()
def frontierV3PilotGrayboxDatapackDirectory = new File(rootProject.projectDir.parentFile, 'datapacks/pale-mirror-graybox')
def ftbGameTestWorldDirectory = new File(ftbGameTestDirectory, 'world')
def ftbGameTestConfigDirectory = layout.buildDirectory.dir('runs/ftb-game-test/config').get().asFile

dependencies {
    implementation project(':pale-mirror-api')
    implementation project(':pale-mirror-domain')
    implementation project(':pale-mirror-frontier')
    // API classes are referenced only by the isolated client plugin. JourneyMap
    // itself stays optional and is never packaged into Pale Mirror.
    compileOnly 'info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1'
    // Exact optional server API. DH itself is supplied by the private pack and is never shaded into PM.
    compileOnly 'maven.modrinth:uCdwusMi:3.2.0-b-1.21.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Minecraft supplies Gson at runtime; unit tests execute outside its launch classpath.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = rootProject.providers.gradleProperty('neo_version').get()

    runs {
        configureEach {
            systemProperty 'pale_mirror.profile', 'core-only'
            systemProperty 'pale_mirror.frontier_v3.enabled', providers.systemProperty('pale_mirror.frontier_v3.enabled').orElse('false').get()
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.providers.gradleProperty('mod_id').get()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = coreGameTestDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
        }
        crimsonGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/crimson-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
        }
        sporeGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/spore-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
        }
        createGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/create-game-test')
            // Create sends client payloads when mock players join. Existing
            // mock-player suites self-skip in this adapter-only profile.
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
            systemProperty 'pale_mirror.create_adapter_only', 'true'
        }
        railwayGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/railway-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
            systemProperty 'pale_mirror.create_adapter_only', 'true'
        }
        ftbGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/ftb-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
            systemProperty 'pale_mirror.ftb_presentation_only', 'true'
        }
        millenaireGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/millenaire-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    rootProject.providers.gradleProperty('mod_id').get() + ',minecraft'
            systemProperty 'pale_mirror.millenaire_adapter_only', 'true'
        }
        coreClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/core-client')
            def auditServer = providers.gradleProperty('coreClientServer')
            if (auditServer.isPresent()) {
                programArgument '--username'
                programArgument providers.gradleProperty('coreClientUsername').orElse('PMAudit').get()
                programArgument '--quickPlayMultiplayer'
                programArgument auditServer.get()
            }
        }
        crimsonClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/crimson-client')
        }
        sporeClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/spore-client')
        }
        createClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/create-client')
        }
        railwayClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/railway-client')
        }
        visualAuditClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/railway-client')
            programArgument '--username'
            programArgument providers.gradleProperty('visualAuditUsername').orElse('PMAudit').get()
            programArgument '--quickPlayMultiplayer'
            programArgument providers.gradleProperty('visualAuditServer').orElse('127.0.0.1:25565').get()
        }
        frontierV3PilotClient {
            client()
            // Deliberately minimal v3 profile: NeoForge plus current source only.
            // It connects only to the matching disposable Frontier v3 server.
            gameDirectory = frontierV3PilotClientDirectory
            // The pilot's acceptance frames are captured from its exact X11
            // window.  On a Wayland desktop GLFW otherwise prefers a native
            // surface which neither names nor exposes a capturable client
            // window to the audit harness.  This isolated development run
            // deliberately uses the existing XWayland bridge; it never
            // changes normal-player client platform selection.
            environment 'XDG_SESSION_TYPE', 'x11'
            environment 'WAYLAND_DISPLAY', '__pale_mirror_pilot_xwayland_only__'
            systemProperty 'pale_mirror.frontier_v3.test_pilot.scenario',
                    providers.gradleProperty('frontierV3PilotScenario').orElse('').get()
            systemProperty 'pale_mirror.frontier_v3.test_pilot.capture_control_directory',
                    providers.gradleProperty('frontierV3PilotCaptureControlDirectory').orElse('').get()
            programArgument '--fullscreen'
            programArgument '--username'
            programArgument providers.gradleProperty('frontierV3PilotUsername').orElse('PMTestPilot').get()
            programArgument '--quickPlayMultiplayer'
            programArgument providers.gradleProperty('frontierV3PilotServer').orElse('127.0.0.1:25575').get()
        }
        frontierV3PilotPackClient {
            client()
            // Full-pack pilot remains available only for final compatibility/visual acceptance.
            gameDirectory = frontierV3PilotPackClientDirectory
            environment 'XDG_SESSION_TYPE', 'x11'
            environment 'WAYLAND_DISPLAY', '__pale_mirror_pilot_xwayland_only__'
            systemProperty 'pale_mirror.frontier_v3.test_pilot.scenario',
                    providers.gradleProperty('frontierV3PilotScenario').orElse('').get()
            systemProperty 'pale_mirror.frontier_v3.test_pilot.capture_control_directory',
                    providers.gradleProperty('frontierV3PilotCaptureControlDirectory').orElse('').get()
            programArgument '--fullscreen'
            programArgument '--username'
            programArgument providers.gradleProperty('frontierV3PilotUsername').orElse('PMTestPilot').get()
            programArgument '--quickPlayMultiplayer'
            programArgument providers.gradleProperty('frontierV3PilotServer').orElse('127.0.0.1:25565').get()
        }
        frontierV3PilotServer {
            server()
            // This server shares neither a pack profile nor a world directory with live work.
            gameDirectory = frontierV3PilotServerDirectory
            programArgument '--nogui'
            systemProperty 'pale_mirror.frontier_v3.enabled', 'true'
            // A disposable runner receives the actual Minecraft JVM identity
            // from its own nonce; Gradle's forked launcher is not that owner.
            systemProperty 'pale_mirror.frontier_v3.pilot.run_id', frontierV3PilotRunId
            // Test-pilot initial-world fixture only; normal V3 starts always use the world profile.
            systemProperty 'pale_mirror.frontier_v3.pilot.profile', frontierV3PilotProfile
        }
        ftbClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/ftb-client')
        }
        millenaireClient {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/millenaire-client')
        }
    }

    mods {
        pale_mirror {
            sourceSet sourceSets.main
            sourceSet project(':pale-mirror-api').sourceSets.main
            sourceSet project(':pale-mirror-domain').sourceSets.main
            sourceSet project(':pale-mirror-frontier').sourceSets.main
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
            minecraft_version_range: rootProject.providers.gradleProperty('minecraft_version_range').get(),
            neo_version            : rootProject.providers.gradleProperty('neo_version').get(),
            loader_version_range   : rootProject.providers.gradleProperty('loader_version_range').get(),
            mod_id                 : rootProject.providers.gradleProperty('mod_id').get(),
            mod_name               : rootProject.providers.gradleProperty('mod_name').get(),
            mod_license            : rootProject.providers.gradleProperty('mod_license').get(),
            mod_version            : rootProject.providers.gradleProperty('mod_version').get()
    ]
    inputs.properties(properties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    expand(properties)
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.named('jar', Jar).configure {
    dependsOn project(':pale-mirror-api').tasks.named('classes')
    dependsOn project(':pale-mirror-domain').tasks.named('classes')
    dependsOn project(':pale-mirror-frontier').tasks.named('classes')
    from project(':pale-mirror-api').sourceSets.main.output
    from project(':pale-mirror-domain').sourceSets.main.output
    from project(':pale-mirror-frontier').sourceSets.main.output
}

def distributableJar = tasks.named('jar', Jar).flatMap { it.archiveFile }

tasks.register('verifyPackagedJar') {
    group = 'verification'
    description = 'Fails if the distributable mod jar omits the domain module or PM effect/combat/source-item safety boundaries.'
    dependsOn tasks.named('jar')
    inputs.file(distributableJar)
    doLast {
        def jarFile = distributableJar.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            [
                    'io/farfrontier/palemirror/api/IntegrationAdapter.class',
                    'io/farfrontier/palemirror/domain/WorldState.class',
                    'io/farfrontier/palemirror/frontier/v3/persistence/FrontierStore.class',
                    'io/farfrontier/palemirror/internal/effect/EffectLeaseLedger.class',
                    'io/farfrontier/palemirror/internal/combat/ThreatCombatLedger.class',
                    'io/farfrontier/palemirror/internal/combat/PmProjectileRuntime.class',
                    'io/farfrontier/palemirror/internal/adapter/SourceItemFirewall.class',
                    'io/farfrontier/palemirror/internal/integration/ftb/FtbQuestsPresentationAdapter.class',
                    'io/farfrontier/palemirror/internal/integration/millenaire/MillenaireSettlementAdapter.class',
                    'io/farfrontier/palemirror/internal/integration/railwaysuntold/RailwaysUntoldManagedAdapter.class',
                    'io/farfrontier/palemirror/internal/world/ManagedRailwayRuntime.class',
                    'io/farfrontier/palemirror/internal/world/CampaignMineSiteTemplate.class',
                    'io/farfrontier/palemirror/internal/presentation/RegionalLedgerItem.class',
                    'io/farfrontier/palemirror/internal/presentation/atlas/RegionalAtlasProjection.class',
                    'io/farfrontier/palemirror/internal/client/PaleMirrorAtlasScreen.class',
                    'io/farfrontier/palemirror/internal/integration/journeymap/PaleMirrorJourneyMapPlugin.class',
                    'assets/pale_mirror/models/item/regional_ledger.json',
                    'ftb_quests_presentation/chapters/pale_mirror_first_living_region.snbt',
                    'pale_mirror.item_firewall.mixins.json',
                    'pale_mirror.frontier_v3.mixins.json'
            ].each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("${jarFile} is missing required PM safety entry ${entry}")
            }
            if (jar.entries().any { entry -> entry.name.startsWith('journeymap/') }) {
                throw new GradleException("${jarFile} must not package JourneyMap API classes")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        coreGameTestDirectory.deleteDir()
    }
}

