def syncFrontierV3PilotPackClient = tasks.register('syncFrontierV3PilotPackClient', Sync) {
    dependsOn tasks.named('classes')
    def installedClient = layout.buildDirectory.dir('runs/railway-client')
    from(installedClient) {
        // NeoForge ModDev contributes the current Pale Mirror source set to the
        // run. Leaving this pack artifact beside it silently wins class lookup.
        exclude 'mods/pale_mirror-hosted.jar'
    }
    into(frontierV3PilotPackClientDirectory)
    doFirst {
        if (!new File(installedClient.get().asFile, 'mods').isDirectory()) {
            throw new GradleException('Frontier v3 pilot requires the installed railway-client pack; run scripts/install-client.sh first')
        }
    }
    doLast {
        if (new File(frontierV3PilotPackClientDirectory.get().asFile, 'mods/pale_mirror-hosted.jar').isFile()) {
            throw new GradleException('Frontier v3 pilot profile must not contain the hosted Pale Mirror jar')
        }
    }
}
tasks.named('prepareFrontierV3PilotPackClientRun') { dependsOn syncFrontierV3PilotPackClient }

// The old pilot profile copied a full modpack into this exact generated directory.
// Always clear it before a lite launch so stale optional jars can never silently
// defeat the profile boundary or pollute its logs.
def resetFrontierV3PilotLiteClient = tasks.register('resetFrontierV3PilotLiteClient', Delete) {
    delete frontierV3PilotClientDirectory
}
tasks.named('prepareFrontierV3PilotClientRun') {
    dependsOn resetFrontierV3PilotLiteClient
    doLast {
        // A brand-new Minecraft game directory normally opens the first-run
        // accessibility screen.  The native test pilot has no business logic
        // until Quick Play connects, so acknowledge that client-local prompt
        // deterministically here rather than relying on a manual X11 click.
        // This is deliberately scoped to the disposable lite profile.
        def options = new File(frontierV3PilotClientDirectory.get().asFile, 'options.txt')
        options.parentFile.mkdirs()
        options.text = 'onboardAccessibility:b:true\n' +
                'narrator:0\n'
    }
}

def resetFrontierV3PilotServerWorld = tasks.register('resetFrontierV3PilotServerWorld') {
    doLast {
        def worldDirectory = new File(frontierV3PilotServerRunDirectory, frontierV3PilotWorldName)
        if (frontierV3PilotReset == 'true' && worldDirectory.exists() && !worldDirectory.deleteDir()) {
            throw new GradleException("Could not reset disposable Frontier v3 pilot world ${worldDirectory}")
        }
    }
}
def installFrontierV3PilotGrayboxDatapack = tasks.register('installFrontierV3PilotGrayboxDatapack', Sync) {
    dependsOn resetFrontierV3PilotServerWorld
    from(frontierV3PilotGrayboxDatapackDirectory)
    into(new File(frontierV3PilotServerRunDirectory, "${frontierV3PilotWorldName}/datapacks/pale-mirror-graybox"))
    doFirst {
        if (!new File(frontierV3PilotGrayboxDatapackDirectory, 'data/pale_mirror/dimension/frontier_graybox.json').isFile()) {
            throw new GradleException("Frontier v3 lite profile requires the canonical workspace datapack at ${frontierV3PilotGrayboxDatapackDirectory}")
        }
    }
}

tasks.named('runFrontierV3PilotServer') {
    dependsOn installFrontierV3PilotGrayboxDatapack
    doFirst {
        def directory = frontierV3PilotServerRunDirectory
        def world = frontierV3PilotWorldName
        def seed = frontierV3PilotSeed
        def port = frontierV3PilotPort
        def username = frontierV3PilotOperator
        if (!(world ==~ /[a-z0-9][a-z0-9_-]{0,63}/) || !(username ==~ /[A-Za-z0-9_]{3,16}/) || !(port ==~ /[0-9]{2,5}/)
                || !(frontierV3PilotViewDistance ==~ /[2-9]|[12][0-9]|3[0-2]/)
                || !(frontierV3PilotProfile in ['world', 'hot-scene-strike', 'hive-growth', 'scene-return'])
                || !(frontierV3PilotRunId ==~ /|[0-9a-f-]{36}/)) {
            throw new GradleException('Frontier v3 pilot world, username, port, view distance, profile or run id is invalid')
        }
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = "level-name=${world}\nlevel-seed=${seed}\nserver-ip=127.0.0.1\nserver-port=${port}\nonline-mode=false\nallow-flight=true\ngamemode=creative\ndifficulty=normal\nspawn-protection=0\nview-distance=${frontierV3PilotViewDistance}\nsimulation-distance=${frontierV3PilotViewDistance}\n"
        def uuid = java.util.UUID.nameUUIDFromBytes(("OfflinePlayer:" + username).getBytes(java.nio.charset.StandardCharsets.UTF_8))
        new File(directory, 'ops.json').text = '[\n  {"uuid":"' + uuid + '","name":"' + username + '","level":4,"bypassesPlayerLimit":false}\n]\n'
    }
}

