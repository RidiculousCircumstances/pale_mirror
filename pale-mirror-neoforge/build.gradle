tasks.register('fullSmoke') {
    group = 'verification'
    description = 'Runs all server, optional-integration, packaged-JAR restart, and graphical client smoke gates.'
    dependsOn tasks.named('runGameTestServer'), tasks.named('runCrimsonGameTestServer'), tasks.named('runSporeGameTestServer'),
            tasks.named('runCreateGameTestServer'), tasks.named('runFtbGameTestServer'),
            tasks.named('runMillenaireGameTestServer'), tasks.named('dedicatedRestartHarness'),
            tasks.named('crimsonIntegrationHarness'), tasks.named('sporeIntegrationHarness'), tasks.named('createIntegrationHarness'),
            tasks.named('managedRailwayIntegrationHarness'),
            tasks.named('ftbIntegrationHarness'), tasks.named('millenaireIntegrationHarness'), tasks.named('clientSmoke')
}

tasks.register('verifySporeSandboxPackaging') {
    group = 'verification'
    description = 'Fails if the final JAR omits the Spore isolation mixins, no-spawn datapack, or PM tier composition.'
    dependsOn tasks.named('jar')
    inputs.file(distributableJar)
    doLast {
        def requiredEntries = [
                'pale_mirror.spore.mixins.json',
                'spore_sandbox/pack.mcmeta',
                'spore_sandbox/data/spore/neoforge/biome_modifier/ground_fungal_foliage_modifier.json',
                'spore_sandbox/data/spore/neoforge/biome_modifier/inf_spawns.json',
                'spore_sandbox/data/spore/neoforge/structure_modifier/spore_structure_spawns.json',
                'data/pale_mirror/pale_mirror/encounters/spore_mine_guard.json',
                'io/farfrontier/palemirror/internal/integration/spore/SporeRuntimeFirewall.class',
                'io/farfrontier/palemirror/internal/integration/spore/SporeMovementRuntime.class',
                'io/farfrontier/palemirror/internal/integration/spore/SporeProjectileRuntime.class',
                'io/farfrontier/palemirror/internal/integration/spore/mixin/SporeProjectileSafetyMixin.class'
        ]
        def jar = new java.util.jar.JarFile(distributableJar.get().asFile)
        try {
            requiredEntries.each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("Spore sandbox entry is missing from final JAR: ${entry}")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.register('verifySporeVisualContract') {
    group = 'verification'
    description = 'Verifies that the pinned Spore client JAR still supplies the resources used by PM-owned actor forms.'
    dependsOn tasks.named('downloadSporeIntegrationJar')
    inputs.file(sporeIntegrationJar)
    doLast {
        def requiredEntries = [
                'assets/spore/textures/entity/infected.png',
                'assets/spore/textures/entity/inf_husk.png',
                'assets/spore/textures/entity/baio.png',
                'assets/spore/textures/entity/spitter.png',
                'assets/spore/textures/entity/acid_round.png',
                'assets/spore/particles/acid_bullet.json',
                'assets/spore/sounds/slash.ogg',
                'assets/spore/sounds/braiomil_attack.ogg',
                'assets/spore/sounds/spitter_spit1.ogg'
        ]
        def jar = new java.util.jar.JarFile(sporeIntegrationJar.get().asFile)
        try {
            requiredEntries.each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("Pinned Spore visual resource is missing: ${entry}")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.register('sporeIntegrationHarness', Exec) {
    group = 'verification'
    description = 'Boots the final PM JAR beside the checksum-verified pinned Spore JAR twice in a clean dedicated runtime.'
    dependsOn tasks.named('verifySporeSandboxPackaging'), tasks.named('verifySporeVisualContract')
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    environment 'PALE_MIRROR_JAVA', harnessLauncher.get().executablePath.asFile.absolutePath
    commandLine 'bash', 'scripts/spore-integration-harness.sh', distributableJar.get().asFile.absolutePath,
            sporeIntegrationJar.get().asFile.absolutePath
}

tasks.register('crimsonIntegrationHarness', Exec) {
    group = 'verification'
    description = 'Boots the final PM JAR beside the checksum-verified pinned Crimson JAR in a clean dedicated runtime.'
    dependsOn tasks.named('verifyCrimsonSandboxPackaging'), tasks.named('verifyCrimsonVisualContract')
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    environment 'PALE_MIRROR_JAVA', harnessLauncher.get().executablePath.asFile.absolutePath
    commandLine 'bash', 'scripts/crimson-integration-harness.sh', distributableJar.get().asFile.absolutePath,
            crimsonIntegrationJar.get().asFile.absolutePath
}

// These process-level gates each install and boot a clean dedicated runtime.
// Serial execution keeps fullSmoke within predictable disk and memory bounds;
// failed harnesses still retain their own isolated runtime for diagnosis.
tasks.named('crimsonIntegrationHarness') { mustRunAfter tasks.named('dedicatedRestartHarness') }
tasks.named('sporeIntegrationHarness') { mustRunAfter tasks.named('crimsonIntegrationHarness') }
tasks.named('createIntegrationHarness') { mustRunAfter tasks.named('sporeIntegrationHarness') }
tasks.named('ftbIntegrationHarness') { mustRunAfter tasks.named('createIntegrationHarness') }
tasks.named('millenaireIntegrationHarness') { mustRunAfter tasks.named('ftbIntegrationHarness') }
tasks.named('clientSmoke') { mustRunAfter tasks.named('millenaireIntegrationHarness') }

tasks.named('check') {
    dependsOn rootProject.tasks.named('verifyJava21'), tasks.named('verifyPackagedJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
