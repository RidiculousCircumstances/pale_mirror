plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Library-selection experiment only: absent from main, test and packaged runtime.
sourceSets {
    reactorExperiment {
        compileClasspath += sourceSets.main.output + sourceSets.testFixtures.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testFixtures.output
    }
    tradeCostDiagnostic {
        compileClasspath += sourceSets.main.output + sourceSets.testFixtures.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testFixtures.output
    }
}
// Offline attribution reuses the accepted-WAL reader, without a Reactor dependency.
tasks.named('compileTradeCostDiagnosticJava', JavaCompile) {
    source('src/reactorExperiment/java/io/farfrontier/palemirror/frontier/v3/process/CommittedTradeCorpus.java')
    source('src/reactorExperiment/java/io/farfrontier/palemirror/internal/frontier/v3/ExperimentSealedWalReader.java')
    source(project(':pale-mirror-neoforge').file('src/main/java/io/farfrontier/palemirror/internal/frontier/v3/FrontierWalSegment.java'))
}
def tradeOverlaySources = layout.buildDirectory.dir('trade-cost-attribution/sources')
def tradeOverlayClasses = layout.buildDirectory.dir('trade-cost-attribution/classes')
tasks.register('prepareTradeCostOverlay', Exec) {
    commandLine 'python3', rootProject.file('tools/performance/trade_cost_overlay.py'),
            file('src/main/java'), tradeOverlaySources.get().asFile
    inputs.dir('src/main/java')
    inputs.file(rootProject.file('tools/performance/trade_cost_overlay.py'))
    outputs.dir(tradeOverlaySources)
}
tasks.register('compileTradeCostOverlay', JavaCompile) {
    dependsOn tasks.named('prepareTradeCostOverlay'), tasks.named('tradeCostDiagnosticClasses')
    source(tradeOverlaySources)
    classpath = sourceSets.tradeCostDiagnostic.runtimeClasspath
    destinationDirectory = tradeOverlayClasses
}
tasks.register('frontierV3TradeCostAttribution', JavaExec) {
    group = 'verification'
    description = 'Offline method/phase CPU and allocation attribution; no live instrumentation.'
    def overlay = providers.gradleProperty('tradeCostOverlay').getOrElse('false').toBoolean()
    if (overlay) dependsOn tasks.named('compileTradeCostOverlay')
    classpath = overlay ? files(tradeOverlayClasses) + sourceSets.tradeCostDiagnostic.runtimeClasspath : sourceSets.tradeCostDiagnostic.runtimeClasspath
    mainClass = 'io.farfrontier.palemirror.frontier.v3.process.TradeCostAttribution'
    maxHeapSize = '4g'
    workingDir = rootProject.layout.projectDirectory.asFile
    systemProperty 'pale_mirror.tradeCost.overlay', overlay
    def corpus = providers.gradleProperty('tradeCostCorpus')
    def output = providers.gradleProperty('tradeCostOutput')
    doFirst { args(corpus.get(), output.get()) }
}
tasks.register('frontierV3OwnerFactsDiagnostic', JavaExec) {
    group = 'verification'
    description = 'Measures actual public valuation reads and exports exact answers on a retained checkpoint.'
    classpath = sourceSets.testFixtures.runtimeClasspath
    mainClass = 'io.farfrontier.palemirror.frontier.v3.model.FrontierV3OwnerFactsDiagnostic'
    maxHeapSize = '4g'
    workingDir = rootProject.layout.projectDirectory.asFile
    def snapshot = providers.gradleProperty('ownerFactsSnapshot')
    def output = providers.gradleProperty('ownerFactsOutput')
    doFirst { args(snapshot.get(), output.get()) }
}
configurations.reactorExperimentImplementation.extendsFrom(configurations.implementation)
dependencies {
    reactorExperimentImplementation 'io.projectreactor:reactor-core:3.8.8'
}
// Compile the exact pure-Java native segment reader into the offline experiment
// only. No duplicate framing implementation or dependency on the NeoForge module.
tasks.named('compileReactorExperimentJava', JavaCompile) {
    source(project(':pale-mirror-neoforge').file('src/main/java/io/farfrontier/palemirror/internal/frontier/v3/FrontierWalSegment.java'))
}
tasks.register('frontierV3ReactorCommittedFlow', JavaExec) {
    group = 'verification'
    description = 'Offline accepted-WAL Java/Reactor comparison; no server writes.'
    classpath = sourceSets.reactorExperiment.runtimeClasspath
    mainClass = 'io.farfrontier.palemirror.frontier.v3.process.CommittedTradeFlowExperiment'
    maxHeapSize = '4g'
    workingDir = rootProject.layout.projectDirectory.asFile
    def corpus = providers.gradleProperty('reactorCorpus')
    def output = providers.gradleProperty('reactorOutput')
    doFirst { args(corpus.get(), output.get()) }
}
tasks.register('frontierV3ReactorExperiment', JavaExec) {
    group = 'verification'
    description = 'Offline A/B/C valuation experiment; never starts or mutates a server.'
    classpath = sourceSets.reactorExperiment.runtimeClasspath
    mainClass = 'io.farfrontier.palemirror.frontier.v3.model.ReactorValuationExperiment'
    maxHeapSize = '4g'
    workingDir = rootProject.layout.projectDirectory.asFile
    systemProperty 'pale_mirror.reactorExperiment.checksOnly', providers.gradleProperty('reactorChecksOnly').getOrElse('false')
    def snapshot = providers.gradleProperty('reactorSnapshot')
    def output = providers.gradleProperty('reactorOutput')
    doFirst { args(snapshot.get(), output.get()) }
}

sourceSets.named('test') {
    compileClasspath += sourceSets.testFixtures.output
    runtimeClasspath += sourceSets.testFixtures.output
}

tasks.withType(Test).configureEach {
    // The full source graph imported by ArchUnit exceeds Gradle's default 512 MiB.
    maxHeapSize = '2g'
    useJUnitPlatform()
    if (name != 'frontierV3AnnualAudit' && name != 'frontierV3ScaleAudit') {
        useJUnitPlatform {
            excludeTags 'annual-audit'
            excludeTags 'scale-audit'
        }
    }
}

tasks.register('frontierV3WalTailDiagnostic', JavaExec) {
    group = 'verification'
    description = 'Prints at most sixteen decoded records from a retained Frontier v3 disposable WAL tail.'
    classpath = sourceSets.testFixtures.runtimeClasspath
    mainClass = 'io.farfrontier.palemirror.frontier.v3.persistence.FrontierV3WalTailDiagnostic'
}

tasks.register('frontierV3AnnualAudit', Test) {
    group = 'verification'
    description = 'Runs the deterministic four-seed Frontier v3 annual COLD-autonomy audit.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'annual-audit' }
    include '**/FrontierV3AnnualAutonomyAuditTest.class'
    ['seed', 'ticks', 'snapshot', 'ruleset'].each { key ->
        def value = providers.systemProperty("pale_mirror.frontier_v3.economy.${key}").orNull
        if (value != null) systemProperty "pale_mirror.frontier_v3.economy.${key}", value
    }
    def selectedSeeds = providers.systemProperty('pale_mirror.frontier_v3.annual_audit.seeds').orNull
    if (selectedSeeds != null && !selectedSeeds.isBlank()) {
        systemProperty 'pale_mirror.frontier_v3.annual_audit.seeds', selectedSeeds
    }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}

tasks.register('frontierV3ScaleAudit', Test) {
    group = 'verification'
    description = 'Runs the same-seed twelve-settlement Frontier v3 pressure, fairness and WAL-replay audit.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'scale-audit' }
    include '**/FrontierV3ScaleAuditTest.class'
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}
