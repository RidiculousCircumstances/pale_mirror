version: 3

components:
  - name: "domain"
    path: "pale-mirror-domain/src/main/java/io/farfrontier/palemirror/domain"
    owns:
      - Canonical world model, deterministic simulation, domain events, Narrator, and scenario state machines
    must_not_depend_on:
      - Minecraft
      - NeoForge
      - persistence
      - adapters
      - wall-clock time
  - name: "frontier_v3"
    lifecycle: "active-development"
    path: "pale-mirror-frontier/src/main/java/io/farfrontier/palemirror/frontier/v3"
    owns:
      - Frontier v3 canonical world, typed commands and events, deterministic schedules, exact actors/resources, autonomous human and hive processes, immutable projections and pure persistence codecs
    may_depend_on:
      - Java standard library
    must_not_depend_on:
      - pale-mirror-domain
      - frontier.reference
      - Minecraft
      - NeoForge
      - persistence implementations
      - adapters
      - wall-clock time
      - ambient random APIs
  - name: "neoforge"
    path: "pale-mirror-neoforge/src/main/java/io/farfrontier/palemirror"
    owns:
      - SavedData persistence, Minecraft observation, materialization execution, scheduling, and commands
      - Reference surface recovery observes the exact owned chest without writing; matching retained replica evidence and the same isolated surface epoch permit a typed lifecycle resume, never a custody grant or stock adoption. Released COLD successors remain owned by the normal fenced projection protocol. Shared container effect fences compose owner-supplied bakery, meal and field-delivery queries before observation or handoff.
      - Read-only current-revision field and reference-container handoff checks gate initial chunk presentation and new scene admission, never existing physical-effect recovery
      - PREPARED ambient admission reprojects a verified retained body to its current placement zone without teleporting an already HOT body or granting semantic completion
    may_depend_on:
      - domain
      - Minecraft
      - NeoForge
  - name: "adapter_api"
    path: "pale-mirror-api (stable package io.farfrontier.palemirror.api)"
    owns:
      - Narrow experimental SPI for optional integrations
    must_not_depend_on:
      - internal implementation types
  - name: "visuals"
    path: "pale-mirror-visuals/src/main/java/io/farfrontier/palemirror/visuals"
    owns:
      - Fresh-world regional genesis manifests, PM-owned settlement structures, stable physical residents, and dynamic visual projection
      - Read-only Foundry plan/materialization audits, bounded asset lint, and disposable diagnostic exports
    may_depend_on:
      - adapter_api
      - Minecraft
      - NeoForge
      - pinned visual and resident-behaviour integrations
    must_not_depend_on:
      - domain implementation
      - core internal implementation
  - name: "automodel_lab"
    path: "tools/automodel"
    owns:
      - Offline provenance-pinned image-to-3D research contracts, local model registry, known-geometry qualification and review-only evidence packages
    must_not_depend_on:
      - Minecraft runtime
      - canonical Blender source mutation
      - PMMesh export
      - server or world state
  - name: "frontier_v3_test_harness"
    lifecycle: "active-development"
    path: "tools/frontier-v3-test-pilot"
    owns:
      - External declarative test scenarios, ordinary NeoForge test-player actions, disposable lite server worlds, bounded evidence manifests, PMV3 JSONL traces and visible-audit orchestration
      - Versioned client/server lifecycle barriers, persistent matrix-client sessions, content-addressed nonfinal evidence, conservative dependency selection, deterministic CI sharding/merge and opaque immutable development-fixture cloning
      - Read-only bounded semantic scene maps, common point/area/path/group presentation targets, legal player-eye camera candidate evaluation and reproducible screenshot/map manifests
    may_depend_on:
      - Node runtime
      - pinned Mineflayer compatibility preflight and a normal NeoForge client pilot
      - read-only NeoForge v3 diagnostic command output
    must_not_depend_on:
      - canonical state mutation APIs
      - direct world-file mutation
      - V2 or Python simulation state
  - name: "repository_context_engine"
    lifecycle: "development-only"
    path: "tools/engineering/context"
    owns:
      - Bounded joining of canonical governance, current implementation identity, structural code graph, path ownership, critical-flow impact and verification-family hints for agents
    may_depend_on:
      - local pinned code-graph executable
      - canonical repository documents and declarative architecture
    must_not_depend_on:
      - Minecraft runtime or world state
      - canonical simulation state
      - remote source upload or model APIs
  - name: "agent_assist_tooling"
    lifecycle: "development-only"
    path: "tools/engineering/agent_assist"
    owns:
      - Bounded read-only indexing of retained runtime evidence, advisory changed-path verification selection, pinned LSP integration metadata, bytecode architecture checks and guarded profiler invocation
    may_depend_on:
      - local SQLite and already-produced build or server evidence
      - pinned Serena, ArchUnit and async-profiler developer dependencies
      - repository context ownership and verification-family hints
    must_not_depend_on:
      - canonical state mutation or Minecraft world mutation
      - automatic test, native-run, profiler or repair execution
      - remote evidence upload, agent memory or acceptance authority

runtime_transitions:
  - id: "frontier-v3-greenfield-cutover"
    current_runtime: "frontier_v2_source_graybox"
    current_status: "frozen-active"
    target_runtime: "frontier_v3"
    target_status: "active-development"
    migration: "fresh-world-only"
    rules:
      - V3 never imports, delegates to, falls back to or shares canonical state with V2 or Python.
      - V2 remains isolated and receives no feature development while V3 is incomplete.
      - V2 runtime removal requires the automated, performance, restart, physical-world and player-product gates in the Frontier v3 implementation plan.

invariants:
  - id: "frontier-v3-single-calendar-authority"
    statement: "Monotonic canonical SimInstant owns deadlines and elapsed time. The pure SimulationCalendar derives day index and phase from that instant and the ruleset day length; settlement schedules consume the same phase and cannot choose another world day length. MinecraftCalendarPresentation is an isolated dimension-scoped read-only adapter: its caller explicitly supplies the world, calendar policy and committed-instant source. It owns no simulation advancement, resident behavior, physical effects, durable second clock or Overworld day-time mutation. Graybox daylight follows actual reached canonical time, including held/partially rejected fast-forward and recovered/quarantined instants. Minecraft gameTime remains native; sleep, vanilla /time and daylight gamerules cannot rewrite the canonical calendar. The adapter preserves unrelated world-data behavior, keeps both Minecraft level-data aliases coherent, scopes client time packets to its bound world and restores original data on detach."
  # Accepted target requirements; ARC-001 verifies adoption after F0.6R3.
  - id: "frontier-explicit-semantic-identity"
    statement: "Every owner, durable semantic type, capability, authority epoch and behavior-dispatch identity that can affect canonical mutation, persistence, recovery, custody or retirement is an explicit typed value supplied by its authoritative producer and, when durable, encoded under its own stable non-reused wire tag. Production code never infers such identity from another enum/kind, an ID or string prefix, coordinates, runtime class, collection membership, neighbouring state or a default/fallback. An authoritative value reaches its first admissible production boundary as one complete nominal declaration: no generic ID, nullable/wildcard type, polymorphic placeholder or partially typed carrier may be completed later. A closed registry validates the exact producer-declared owner + kind + schema tuple; it never scans candidates, selects the only compatible entry or discovers a missing dimension from payload shape or context. An ID namespace or collection membership may validate an already explicit declaration but cannot supply its type, owner or dispatch key. Durable physical-change evidence carries the exact subject and its producer-stamped typed semantic target through observation, snapshot/WAL, deferred aftermath, repair and retirement; an explicit unclassified variant has no authority to be promoted later. Missing, unknown, stale, partial or mismatched identity fails closed before dispatch, replay or mutation. Legacy/recovered data without a complete declaration is rejected at its version boundary rather than repaired heuristically. Decoding an identity from its own wire tag and validating explicitly declared compatibility are permitted; read-only labels and indexes may be derived only when they cannot become authority, and fixture conveniences remain outside production APIs. Mechanical negative coverage removes or forges each declaration dimension independently and rejects ownerless construction, implicit dispatch, candidate scanning, prefix/membership classification and recovery synthesis before behavior selection or mutation across the affected composition."
  - id: "frontier-v3-execution-dimensions"
    lifecycle: "planned-alignment"
    statement: "One autonomous simulation owns semantic state. Presentation demand, natural physical interaction eligibility and exclusive mutation authority are independent per actor, asset or bounded front, not one whole-settlement switch. HOT and COLD use the same process/generation, resources, labor and semantic checkpoint; an unobserved current physical custodian excludes a competing COLD writer. A movement checkpoint retains a typed station/arrival contract, capability, topology edge and cursor rather than a predicted Minecraft micro-path. COLD interval advancement respects causal boundaries and due ordering; HOT local movement remains continuous under ordinary Minecraft cadence inside the retained edge envelope, not one teleport or navigation restart per semantic step. docs/frontier-v3-execution-semantics.md owns the protocol; ARC-001 adopts it without restarting accepted F0 infrastructure."
  - id: "frontier-v3-projection-action-aftermath"
    lifecycle: "planned-alignment"
    statement: "Current-state projection, irreversible physical interaction and deferred causal aftermath have separate responsibilities. Safe supersession applies only to obsolete representation with preserved ownership and preconditions, never to a potentially applied effect. First visibility reconciles current state and actual physical evidence without replaying historical cycles or explosions, erasing player edits or teleporting an observed actor. Domain WAL, Minecraft chunk saves and player saves are not one transaction; confirmation and ambiguity use the actual persistence boundary and isolate only the proven affected scope."
  - id: "frontier-v3-temporal-referential-integrity"
    lifecycle: "planned-alignment"
    statement: "Stable entity identity, process generation, job/action identity and physical authority epoch are distinct. Retirement atomically resolves incoming relationships, resource commitments, engine-owned scheduled continuations and physical intents into retained, transferred, cancelled or bounded terminal/recovery dispositions. Actors outlive their jobs. Expected late inputs consume exact fencing/disposition evidence without replay; unknown live references and corruption never become silent no-ops. Compaction follows resolved obligations and recovery boundaries with count/byte bounds, not TTL alone or permanent per-cycle tombstones. REL-001 remains the relationship foundation, not a second mutable graph."
  - id: "frontier-v3-reference-closure-barrier"
    lifecycle: "active-development"
    statement: "One family-neutral canonical transaction barrier validates the complete closed relationship and obligation inventory before publication. Every new or changed durable reference resolves in the proposed post-state to its exact live typed target or exact generation-bound terminal/recovery disposition; every removed, replaced or terminal subject has its complete actual incoming pre-state set retained, transferred, cancelled or dispositioned by the same transaction. A family cannot introduce an unregistered authoritative ID-bearing field or alternate deletion path. Bounded validation may use a rebuildable revision-bound reverse index but never a second authority. Invalid planned transitions fail atomically at the smallest owner before events, schedules or physical intents publish; only a dangling reference already present in accepted canonical/persisted state is integrity corruption eligible for whole-runtime quarantine. Hydration and WAL recovery run the complete equivalent audit before execution resumes."
  - id: "frontier-v3-typed-reference-transition"
    lifecycle: "active-correction"
    statement: "Every active transition that consumes, replaces, transfers, retires or releases a canonical reference or physical replica boundary is expressed through one closed family-neutral typed transition contract. The authoritative family supplies its complete subject, owner, expected revision/epoch and one exhaustive legal disposition; the common canonical transaction atomically closes the prior binding and establishes exactly one live successor binding, explicit terminal disposition, bounded ambiguity or owner-local block. A process-specific executor may choose domain policy and perform its registered physical effect, but may not independently delete an old reference, synthesize a successor, partially update custody/replica state or implement another lifecycle protocol. The production API makes an omitted successor/disposition or an inapplicable partial result unrepresentable at its first admissible boundary; the reference-closure audit and recovery audit remain defense in depth rather than the normal detector of an incomplete transition. Every currently active producer adopts this contract before further MAT breadth; no untouched-active or legacy compatibility exemption may continue to mutate these facts."
  - id: "frontier-v3-maintainable-bounded-execution"
    lifecycle: "planned-alignment"
    statement: "Existing process archetypes, closed descriptors and typed owners are reused without concrete-family branches in generic execution, persistence or diagnostics. Abstractions have one clear responsibility and remove duplication; no new ORM, database or distributed framework is required. Due work, projection and queries are indexed by affected subjects/chunks and changed sets; unchanged static topology/plans are reused. Fair bounded queues expose backlog, age, simulation lag and admission/backpressure outcomes without dropping critical effects or recovery evidence. Tick and first-visit work cannot grow with accumulated historical cycles. Contract release budgets remain binding; structural alignment is not an unmeasured speed claim."
  # Compatibility wording enforced by the repository architecture gate.
  - statement: "Materialization is performed only by NeoForge executors with persisted jobs, explicit identity, preconditions, and postconditions."
  - id: "frontier-v3-hive-cocoon-custody"
    statement: "Schema-112/envelope-24 physiology owns only an exact BioformLifecycle phase plus optional HiveCocoonSlot; ActorLocation remains the sole body/vitality authority and ambient lease remains the sole HOT-body authority. Every seed nest has three open 3×3 HIBERNACULUM trays; only one Scout and one Defender per nest begin deployed, while every other mature bioform owns one contrasting, player-breakable cocoon and has no Zombie. A settlement-assault mobilisation retains one exact dormant OVERSEER controller as a member, validates its same-nest WATCH profile and fails closed without it; controller identity is never inferred from a nearby body or member ordering. Its non-controller members have a ruleset-defined bounded total command weight derived only from immutable chassis and visible mutations; invalid/overweight admission fails closed. Exact cocoon loss is an ordinary durable physical delta that releases only its same occupant to WAKING on the tray floor; only a naturally demanded successful HOT lease makes it ACTIVE. A current task may select one bounded exact group, but each claimed cocoon stays physically player-breakable until its own durable release receipt. After the final receipt it owns one retained HiveTaskAssembly and the original exact Scout sighting: a named Ganglion semantic departure port, distinct exact staging surfaces and a bounded 3D GROUND_BIOFORM topology/cursor per member. The port orientation is derived once from the retained target and immutable nest survey, then persisted. A COLD clock advances only one retained edge after the complete group has left ambient HOT custody; its event carries the expected cursor, so stale replay fails closed. The registered HOT assembly progression owner advances that same cursor only from observed arrival. It may treat a collision-height overlay of at most one eighth block as the same retained surface, but a missing support, full body-column obstruction, missing/foreign body or unsuccessful exact movement becomes one member-specific durable `ASSEMBLY_PATH_BLOCKED` conflict carrying the actor, expected cursor and retained target; it never chooses an alternate hidden route, teleports, replaces a body, force-loads or COLD-bypasses. Until every retained approach completes no departure or assault is admitted from the assembly. The final retained cursor emits one `hive_mobilization_departed` payload carrying the same-roster, same-Overseer settlement assault; one reducer closes only its assembly leases, changes only those staged bioforms to ACTIVE and starts that assault, so no WAL revision can contain a departed roster without its owner. Stale/missing target facts or invalid exact roster are one durable `DEPARTURE_UNAVAILABLE` conflict, never a nearby-body re-selection. An external cocoon break conflicts that operation rather than forging its receipt, while the exact broken and already confirmed organisms remain real recoverable bodies. Cocoon opening is a registered RELEASE effect, never desired-state projection. COLD patrol, route-engagement and settlement-assault selection must reject cocoon-retained or task-committed IDs. A fixture requiring external mobilisation declares an explicit test-only deployed precondition; it must never move a dormant body directly. Chunk load is never wake authority."
  - id: "frontier-v3-hive-command-authority"
    statement: "Every active route engagement at schema-112/envelope-24 owns exactly one immutable command admission: either a named operational same-nest RELAY plus its named operational GANGLION and a persisted bounded coverage proof for every retained attacker route cell, or an exact mobile OVERSEER plus its ordered weighted roster. The engagement, not a nearby body query, owns that fact. COLD advancement, COLD-combat entry, HOT candidate projection and prepared-to-HOT transition consume the same authority. Loss of a Relay/Ganglion or mobile controller may only change CONNECTED/RECLAIMED to bounded SIGNAL_MEMORY, then INSTINCT; it cannot mutate member IDs, coverage, capacity, body, vitality or leases. Instinct survivors retain their exact local state but cannot create a new coordinated HOT scene or COLD advance. Only an exact live eligible OVERSEER physically present at the retained intercept may reclaim the unchanged roster. All transitions are durable compare-and-set payloads, recover from the persisted phase and never spawn, despawn, teleport or silently replace a controller."
  - statement: "Recognized player/world actions are ordinary typed domain disruptions. Unclassified or ambiguous physical drift is isolated at the smallest owner and must not be overwritten by default; only canonical invariant or persistence corruption quarantines the frontier instance."
  - id: "frontier-v3-fresh-world-only"
    statement: "Frontier v3 accepts only its current snapshot schema, WAL envelope and immutable projection layouts. A format change is an explicit reset boundary for disposable, local and deployed v3 worlds: old bytes fail closed before hydration or replay, no compatibility decoder or semantic migration may be added, and deployment recreates the affected world rather than reusing its canonical history."
  - id: "frontier-v3-greenfield-isolation"
    statement: "Frontier v3 is a fresh-world pure-Java runtime in pale-mirror-frontier and must not import, invoke, fixture-gate or share canonical state with pale-mirror-domain, frontier.reference, SourceGraybox, Python, Minecraft or NeoForge. A launch with pale_mirror.frontier_v3.enabled=true exclusively owns pale_mirror:frontier_graybox: frozen v2 is paused, its graybox commands reject, and a v3 quarantine never falls back to v2; v2 remains independently runnable only in a non-v3 launch."
  - id: "frontier-v3-single-writer"
    statement: "One FrontierEngine mutation lane on the Minecraft server thread owns each v3 world's canonical revision; commands and due actions validate and emit immutable events before an atomic state transition, while workers, adapters, entities, renderers and persistence callbacks never mutate canonical state."
  - id: "frontier-v3-event-time"
    statement: "Frontier v3 time is a monotonic event-driven SimInstant with persisted due actions and deterministic tie breaks; it has no indivisible daily phase, advances while the server runs without players, pauses while the server is stopped, advances skipped sleep only through an explicit command and ignores presentation-only time changes. Bounded differential/recovery verification may request an absolute target SimInstant, but only the server-thread mutation lane admits it against the current checkpoint and advances the ordinary due-action engine exactly to that target; an already-crossed, unbounded or physically unsafe target fails visibly, and client delivery latency never becomes extra requested progress. A known no-op due action durably emits its own cancellation, while an unknown action kind or invalid planner state quarantines rather than disappearing."
  - id: "frontier-v3-hot-cold"
    lifecycle: "active-correction"
    statement: "HOT and COLD are execution locations for the same canonical processes, actors, resources and checkpoints. Player demand may grant only bounded physical authority; it never creates work or changes its economic rules. Scene, ambient, replica and navigation leases use explicit typed causes and monotonic authority epochs to prevent duplicate execution. A current binding may be reclaimed and a safely checkpointed stale projection may be fenced so COLD autonomy never waits indefinitely for a visitor. Exact strategic ports/checkpoints remain canonical while the HOT provider may navigate locally inside their bounded envelope. Cross-chunk operations partition into exact disjoint fronts rather than one unbounded scene. Ambiguous non-replayable effects isolate only their smallest owner pending inspection; history is never replayed for presentation. Shared rules and history do not require identical physical fidelity: docs/frontier-v3-execution-semantics.md owns exact versus calibrated guarantees and mandatory F0 acceptance. Presentation demand and natural physical interaction eligibility are independent inputs; player demand is not the sole reason for physical custody, and only safely released scopes resume COLD. Scenes are bounded executors, not causal barriers."
  - id: "frontier-v3-continuation-binding"
    lifecycle: "active-correction"
    statement: "The process descriptor owns continuation meaning and cadence, while the engine-owned ScheduledAction in the canonical checkpoint is the sole durable due-time and ordering fact. HOT admission, semantic checkpoint and release bind to an exact typed view of that action and atomically validate any schedule effect; model state and leases never copy the queue, a no-work release preserves the action exactly, and no continuation deadline is reconstructed from physical observation or release time."
  - id: "frontier-v3-parallel-native-pipeline"
    lifecycle: "active"
    statement: "Each newly started complete native correctness matrix uses one immutable deterministic assignment across four simultaneously available isolated CI worker slots and the checked-in fail-closed aggregate. Each slot has distinct work/cache/world/port/display/process and evidence custody; same-host slots require a bounded capacity and isolation preflight. This is an acceleration topology, not a new semantic acceptance criterion: a valid sequential matrix already in flight when the rule is adopted retains its declared evidence and is never repeated solely for topology or speed. Queue time, timing samples and numeric speedup floors are advisory and never weaken correctness, identity, coverage or recovery evidence."
  - id: "frontier-v3-prepared-native-pipeline"
    lifecycle: "active"
    statement: "One exact content-addressed producer compiles, transforms, packages and verifies a declared native candidate once; four isolated consumers verify and launch private read-only or copy-on-write views of that same immutable runtime and never compile, transform or package the candidate independently. Content addressing owns an enclosing immutable identity and never changes launcher-significant basenames, extensions, relative-path relations, classpath/module-path order or argument tokens. Every mutable checkout, build, run, world, process and evidence root remains private to one consumer. Process reuse is allowed only for explicitly compatible cases inside one shard and one disposable world after an exact reset acknowledgement; bootstrap, independent shard/world, graceful-restart, abrupt-crash and save-boundary claims retain their required fresh-process boundaries. A deterministic semantic, identity, assignment, namespace, capacity and expected-artifact preflight fails before Minecraft. Success, failure and cancellation preserve attributable per-worker evidence, and the always-running merge rejects missing, duplicate, stale, foreign or incomparable bundles as explicit incomplete evidence. Cache reuse and timing never make a prior success fresh or weaken semantic coverage."
  - id: "frontier-v3-neutral-intent-lifecycle"
    lifecycle: "active-correction"
    statement: "Neutral presentation demand and a traversal-only HOT visit must not change any canonical physical-effect or recovery discriminator. Exact HOT/COLD comparison therefore includes the bound PhysicalIntent kind, lifecycle status and observation binding. PREPARED means an effect is durably requested but not begun; RUNNING means the non-replayable physical effect may have begun and requires postcondition recovery. A duration or traversal scene may not use PREPARED to RUNNING as a readiness or admission flag. Before that effect capability is admitted by its owning F0 slice, scene acquisition, checkpoints and release leave the intent lifecycle unchanged; after admission, only the registered effect owner may enter RUNNING immediately before its durable-before-effect boundary. Disabling that effect capability gates only the effect transition and consequence: it may not disable the registered HOT driver's observed traversal checkpoint over the shared process cursor."
  - id: "frontier-v3-test-pilot-terminal-cleanup"
    lifecycle: "active-correction"
    statement: "A non-restart native lane has an explicit immutable boundary between its terminal semantic evidence and disposable-world cleanup. After the authenticated terminal assertion, the supervisor obtains the exact ordinary client-disconnect acknowledgement and permits the normal bounded demand-loss checkpoint/release/fence before requesting Minecraft shutdown; those later transitions remain attributed cleanup and cannot rewrite or satisfy the recorded terminal projection. A restart or crash lane instead preserves exactly the state named by its recovery contract. Cleanup may not use a sleep, timeout inflation, forced chunk transition, test-only canonical mutation or fabricated save acknowledgement, and success still requires the exact server run's durable-save receipt, JVM exit and closed port within the declared bound."
  - id: "frontier-v3-materialization-completeness"
    statement: "Canonical correctness and an exact physical postcondition are not sufficient evidence for gameplay materialization. Every process is classified under docs/frontier-v3-materialization-completeness.md. A duration-bearing process in naturally loaded space must retain and visibly execute the same exact worker, team, machine, carrier or distributed frontier, semantic stations, progress and interruption path used by COLD execution; generic ambient movement, endpoint block/container state, boards and diagnostics cannot substitute. One-turn execution is restricted to genuinely atomic same-station interactions with every participant/input/target present, baseline projection, or intrinsically instantaneous effects. HOT/COLD/restart and ordinary player intervention use one progress authority, and completion claims report M0 canonical, M1 endpoint, M2 continuous HOT and M3 player-comprehensible evidence without promotion between levels."
  - id: "frontier-v3-materialization-hardening-dependencies"
    lifecycle: "planned-pipeline"
    statement: "Every duration-bearing or irreversible materialization family closes one natural story from autonomous admission through visible HOT progress, terminal result, every declared successor, ordinary leave/COLD/restart/return and one player intervention with the same exact subjects, resources and owner revisions. Evidence ending before the successor is PROVEN_NARROWER. A shared actor-carrier, visible-envelope, confirmation, custody or decision-provenance change requires one bounded impact inventory and explicit ACCEPTED_UNCHANGED, NEEDS_TARGETED_REVALIDATION, PROVEN_NARROWER or REJECTED status for dependent evidence. One closed composition guard covers every implementation, followed only by the smallest representative lifecycle for materially distinct actor/effect shapes; neither blanket inherited acceptance nor a blanket full/native rerun is valid dependency analysis. docs/frontier-v3-materialization-hardening-pipeline.md owns ordering through MAT-010 and release hardening."
  - id: "frontier-v3-typed-scene-positions"
    statement: "Current-schema scenes and operations retain body feet cells and transport support columns as distinct values. Any other snapshot or WAL payload is rejected fail-closed and its world must be recreated; no executor, admission, hand-off, release or restart path may compare a support cell directly to a body position. The loaded-world provider verifies the exact persisted body cell above its own support surface, and a cargo transport anchor may not share a body support column even at a different Y."
  - id: "frontier-v3-hot-duty-cycle-locomotion"
    lifecycle: "active-correction"
    statement: "A canonical process schedule owns semantic due time, effects and checkpoint meaning but never the moment-to-moment HOT movement clock. While an unobstructed TRAVELLING directive remains current, the capability-specific LocalNavigationLease continuously drives the exact physical body at ordinary Minecraft cadence inside its envelope until observed arrival, obstruction, interruption or demand loss; a caller tick interval may not turn consecutive route cells into one-cell bursts separated by unowned idle plateaus. Any intentional stationary interval is an explicit retained WORKING, INTERACTING, WAITING or BLOCKED phase at its exact semantic station and presents a corresponding physical action, facing, pose or world effect rather than pretending to travel. Synthetic oscillation, filler wandering, teleport and premature cursor advance are forbidden. Pedestrian, ground-bioform and other capability providers may differ physically but expose one abstract directive/result contract, and process-specific callers may not bypass it or create another route, cursor, due action or outcome owner."
  - id: "frontier-v3-terrain-aware-traversal"
    lifecycle: "planned-foundation"
    statement: "Real-terrain movement is represented by one bounded immutable three-dimensional traversal topology, never by a constant-Y X/Z line or a runtime heightmap guess. Distinct typed values separate a semantic support surface, body feet position, facility port, interaction/work station and transport node. Every facility port owns orientation, exterior approach, threshold/throat clearance, interior connector, bounded stations and required traversal capabilities; a structure anchor or fixed compass offset is never an entrance. A settlement datum is compiled from the exact surveyed columns of its declared structures and public approaches; each lower column receives plan-owned vertical foundation fill, and its local approach may materialize only over that claimed support. Each settlement also compiles a bounded capacity-derived resident apron: every exact home slot is on its finished datum, its semantic Hall port joins the apron, and one retained grade-checked pedestrian topology reaches only a surveyed natural endpoint. If no such endpoint exists within the declared bound, bootstrap fails closed rather than extending a ramp or inventing another entrance. Any settlement battle compiler and HOT scene admission derive their shared local envelope from that same plan, never from a second radius constant. The fixed route grid likewise consumes its immutable surveyed datum rather than a coded world Y. Each topology edge has stable identity, endpoints, traversal kind, capability requirements, grade/clearance, provenance, revision and OPEN/BLOCKED/DAMAGED/UNKNOWN availability. COLD may advance only the retained route edge/cursor; HOT uses the registered Minecraft movement provider for that same next node and commits progress only from observed physical arrival. A terrain/materialization provider owns a bounded immutable support survey and any required footing/deck cells: it never infers a height map at runtime or asks a player to supply scaffolding. Before a real Minecraft support break, the provider must atomically observe the initiating owned cell together with every bounded, immediately survival-dependent owned cell in its declared palette; the full loss set becomes durable before either claim is revoked or Vanilla mutates the world. Destruction of that owned support is typed evidence against the same retained edge, may block, replan or create engineering work, and never silently restores a cosmetic surface over a missing foundation. Remote route repair is a retained exact cargo-and-team operation: it may not require the source chest and target cell in one loaded turn, use generic structural repair, force-load either location or reopen an edge while another retained owned support loss still affects it. Player changes, explosions, infection, fluids or structural loss update edge/port availability through typed observations without silent repair or hidden alternate geometry. The flat graybox is only one topology/materialization provider and must pass the same non-flat, blocked-entrance and restart contracts. Pedestrian/bioform traversal and rail are distinct capability graphs; future Create trains consume the rail graph and never own a second route or cargo truth."
  - id: "frontier-v3-route-patrol-continuity"
    lifecycle: "active"
    statement: "A route patrol is one exact class-D operation, not generic settlement guard motion. Its sole persisted owner retains the exact unit, individual ingress state, distinct formation body positions, bounded surveyed pedestrian topology, cursor and route-obstruction evidence. Admission fails rather than moving a member to a waypoint. COLD advances only retained OPEN edges and atomically updates that same formation plus ActorLocation; it never teleports a roster, creates a substitute, uses a settlement anchor or changes an occupied formation slot. A naturally demanded ROUTE_PATROL scene is a registered typed cause whose durable lease contains exactly that roster and formation without cargo. HOT commits one retained edge only from observed normal Minecraft arrival; death, changed body, blocked edge/support or player/world obstruction is typed evidence for the same patrol. Foundry observes but never loads, clears, repairs or replans a patrol edge. Restart retains UNKNOWN until exact naturally loaded inspection, never replays movement. Every replacement is a fresh-world format cut: prior patrol snapshot/WAL bytes are rejected rather than decoded or adapted."
  - id: "frontier-v3-hive-expedition-continuity"
    lifecycle: "active"
    statement: "A remote hive expedition is one exact Overseer-owned coordinated operation from mobilisation departure through approach, contact and retreat/return, never ambient bioform motion or disconnected assault endpoints. Its sole canonical owner retains the original task/sighting/target, ordered exact roster, living Overseer and weighted command authority, TacticalPlan, phase, distinct formation, bounded immutable surveyed GROUND_BIOFORM approach/return topologies, cursor and typed loss/obstruction/recovery evidence. Mobilisation and contact hand-offs preserve those facts atomically and never reselect, duplicate or teleport members. COLD advances only one retained OPEN formation edge while coordinated command remains valid; a naturally demanded registered march scene uses the shared movement provider and commits the same edge only from observed exact-roster arrival. Demand loss returns that unchanged checkpoint to COLD. Member/body/edge/player obstruction and controller loss preserve exact survivors and degrade through bounded SIGNAL_MEMORY to INSTINCT, where coordinated movement or new battle admission is forbidden until a valid exact reclaim or owned retreat/failure result. Restart retains UNKNOWN until natural exact-body/postcondition inspection and never replays an edge, casualty, contact or retreat. Foundry observes only already-loaded retained topology and cannot load, clear, repair or replan it. docs/frontier-v3-hive-expedition-contract.md owns the MAT-005 acceptance boundary."
  - id: "frontier-v3-projection-tick-bounds"
    statement: "A NeoForge v3 projection tick may inspect only its declared bounded current work set. Temporary worksite retirement reads its derived durable-claim-family index rather than scanning all structural provenance, and player-board refresh compares only immutable facts that change board slots, text or tone; body motion alone retains the prior board cursor. Derived adapter indexes are rebuilt from their durable source on load, confer no materialization authority and preserve ordinary exact owner/precondition/postcondition checks."
  - id: "frontier-v3-managed-facility-reconciliation"
    lifecycle: "active-correction"
    statement: "Every managed facility reconciles one immutable revisioned plan with stable slot identity, one plan-defined canonical typed progress projection and one exact ownership claim against only already-loaded physical observations through a closed typed result contract. That contract distinguishes an unobserved or unloaded scope, a neutral unclaimed baseline eligible for normal projection admission, an exact owned current partial state, an exact owned state legitimately behind canonical progress, and foreign, damaged, conflicting or otherwise invalid state; missing claims, null values or coincidentally matching block patterns may not implicitly convert one class into another. Only the exact owned-behind result may apply the bounded canonical delta after validating its claim and complete facility envelope. Unknown combinations fail closed as locatable conflict, while an unloaded scope neither loads nor mutates. A numeric prefix such as the current fixed 0..64 single-worker field cursor is a plan-local optimization, not the shared contract: later expansion, multiple workers, partial damage and spatial-frontier progress retain stable slot identities without reindexing old work or assuming every valid state is one contiguous prefix."
  - id: "frontier-v3-process-execution-ownership"
    lifecycle: "active-correction"
    statement: "Every duration-bearing activity is owned by one canonical process aggregate whose exact participants, resources, topology, progress cursor and terminal state exist independently of loaded chunks and player presence. Natural physical availability and presentation demand are separate inputs to atomically granting a physical execution lease over the aggregate's current version; it never creates, starts, restarts or owns the activity. One registered COLD driver and one process-specific HOT driver advance the same semantic steps, with COLD suspended only while that exact HOT lease is authoritative. HOT acquisition, observed checkpoints and release are atomic against the same process identities and return the next unfinished step to COLD without a second cursor, replay or disappearance. The deterministic current-process inventory is complete and fairly bounded: every eligible entry receives its ordinary COLD scheduling opportunity independent of player/chunk demand, while every unprogressed entry retains one typed canonical ineligibility, wait, obstruction or failure reason; a selected demanded or test-favoured process may neither starve nor stand in for the rest of the inventory. A nonterminal process whose exact participants and next step are locally eligible must reach an observed semantic checkpoint or effect within its declared bounded cadence, or its owner must retain and expose a typed wait, obstruction or failure reason. A stationary body and `RUNNING`/`HARVESTING` label alone are not progress and may not hide an indefinitely stalled process. Generic scene infrastructure owns lease lifecycle, exclusivity, persistence and failure policy but no domain progress or outcome. Genuinely atomic local effects use durable PhysicalIntent, distributed environmental work uses a retained spatial frontier, strategic decisions remain canonical, and ambient bodies may use custody leases without being represented as work scenes."
  - id: "frontier-v3-execution-archetypes"
    lifecycle: "active-correction"
    statement: "Every physical-capable owner declares exactly one stable execution archetype: DURATION_WORK and COORDINATED_TRAVERSAL use paired COLD/HOT drivers over one process cursor; COMPOSITE_OPERATION owns phases and disjoint child fronts but never acts as one unbounded scene; ATOMIC_INTENT uses one durable-before-effect postcondition boundary; SPATIAL_FRONTIER retains distributed cells/cursors; AMBIENT_CUSTODY owns presence without work progress. Closed composition rejects an owner registered against the wrong primitive, multiple archetypes, an unknown archetype or an unbounded adapter. No generic SDK layer may coerce one archetype into another."
  - id: "frontier-v3-first-class-ai-authority"
    lifecycle: "planned-f0.4"
    statement: "Each settlement and the one whole Hivemind have exactly one canonical DecisionAuthority scope over perceived knowledge, doctrine, active commitments/objectives, reconsideration epoch, world-bound stable policy ID/version and bounded decision provenance; it references rather than duplicates existing objective, task, roster, resource and custody owners. One closed decision protocol dispatches to distinct registered settlement and hive policies. Every coordinated operation retains one TacticalPlan inside its operation/front ownership for phase, bounded objectives, roles, formation constraints, permitted local behaviours, rendezvous and fallback/retreat conditions without creating a second roster. Closed tactical and individual-behaviour registries derive bounded actor directives through stable descriptors, so generic operation/scene code never branches on a concrete unit, tactic or situation implementation. Every objective/task/order names exactly one authority and epoch, and every actor directive names exactly one tactical plan/front and current lease. Scenes, entity brains and movement providers execute bounded directives and report typed observations but cannot originate or replace strategic purpose, formation, reinforcement, retreat or semantic destination; stale epochs fail closed."
  - id: "frontier-v3-process-scene-sdk"
    lifecycle: "active-correction"
    statement: "The internal Process/Scene SDK registers each adapter under a stable non-reused family ID and descriptor schema that names its archetype, canonical owner, exact command/observation and codec vocabulary, driver/provider bindings, versioned exact/statistical comparator, knowledge validity and unknown-precondition policy, physical-custody and confirmation capabilities, cross-front interaction boundaries, lifecycle transitions and declared maxima for actors/cargo/effects, local chunks or navigation envelope, observations per tick, retained records/bytes, cadence and work weight. Generic lifecycle, contract, scenario and crash-control code contains no concrete-family branches. Unknown, missing or incompatible descriptor/codec versions fail closed before recovery or execution; changing retained meaning follows the fresh-world-only schema/reset boundary with explicit rejection of incompatible old bytes, never a compatibility migration or silent rebinding to the current adapter."
  - id: "frontier-v3-diagnostic-causality"
    lifecycle: "accepted-foundation"
    statement: "Canonical events and owned process state remain the sole authority for world meaning and every reason/disposition that affects continuation or recovery. A separate read-only diagnostic plane derives one bounded versioned causal envelope across command or scheduled action, process selection, COLD/HOT driver, lease, physical intent, Minecraft observation, reconciliation and canonical result. Every terminal conflict, recovery unknown, invariant quarantine and adapter/infrastructure failure has one stable registered reason, exact owner/subject, expected/observed facts and recovery disposition; generic CONFLICT, rotated log text or an independently calculated green summary is insufficient. Derived traces, structured logs, incident bundles, JFR and optional telemetry exporters never load chunks, mutate state or become recovery authority. Missing/truncated/wrong-subject causality is explicit, critical semantic facts are retained under declared bounds, verbose samples may be dropped only with a visible count, and a required red underlying fact mechanically prevents a green aggregate. docs/frontier-v3-diagnostic-plane.md owns the accepted OBS-001 foundation; docs/frontier-v3-runtime-verification.md owns the separate OBS-002 online-verdict and promotion boundary."
  - id: "frontier-v3-domain-relationships"
    lifecycle: "active-development"
    statement: "Every semantically durable cross-owner link is an explicit typed domain relationship retained by exactly one canonical aggregate and governed by docs/frontier-v3-domain-relations.md. Policy may discover a target only at admission; every continuation, terminal transition, cancellation and recovery follows the accepted exact identity and may not reselect by kind, settlement, status, position, ordering or apparent uniqueness. A closed stable-tag contract declares endpoint kinds, owner, cardinality/exclusivity, lifecycle, retention and smallest-owner failure disposition. Reverse navigation and causal-chain inspection use a deterministic bounded read-only view derived for one canonical revision; that view, any cache, adapter, Minecraft object or database is never relationship authority. Missing, duplicate, stale, wrong-type or lifecycle-incompatible endpoints produce one typed local incident joined to the canonical trace. Snapshot/WAL recovery validates the same relationships before scheduled or physical execution resumes."
  - id: "frontier-v3-diagnostic-nonprogress-retention"
    lifecycle: "accepted-foundation"
    statement: "Expected-but-absent process selection, assignment, exact-actor adoption or physical materialization is a typed non-progress result with one owner, reason and disposition even when no exception or state mutation occurs. Diagnostic silence cannot explain a missing worker, facility, organ or downstream task. Active/unresolved causal chains and terminal incident summaries awaiting disposition or acceptance review remain restart-queryable within hard admission bounds; optional tracing degrades visibly at capacity rather than compacting the sole explanation of an unresolved object. Closure returns them to normal bounded summary retention."
  - id: "frontier-v3-shared-coordinator-responsibility"
    lifecycle: "active-correction"
    statement: "Shared coordinators own cross-owner protocol, never participant-specific job stages or safe-stop policy. ActorExecutionCoordinator owns execution admission and atomic authority transfer; activity policy chooses purpose, registered family-supplied ActivityExecutionCapability Strategies prove checkpoints, and process owners retain progress and effect semantics. Closed composition rejects missing/duplicate capabilities and exact assignment/immutable-state evidence rejects foreign or stale responses. Checkpoint readiness does not itself release a physical custodian. Historical handoff coordinates never decide current work eligibility; no duplicate activity queue or independent per-family ownership policy is introduced."
  - id: "frontier-v3-physical-service-fairness"
    lifecycle: "active-correction"
    statement: "A registered family alternates active-scene service and eligible admission attempts, selecting exact declared identities round-robin before one bounded executor attempt. A waiting, unloaded or unknown item retains authority but yields subsequent service to other items. Production transformations use the same attempt-based cursor and never replay UNKNOWN input. Ephemeral cursors are bounded per runtime/family and cleared on shutdown; they never represent canonical progress or define simulated work duration. SA-03 composition, recovery and native evidence remain required."
  - id: "frontier-v3-online-semantic-verification"
    lifecycle: "active-correction"
    statement: "Every eligible duration-bearing process exposes one versioned owner-declared progress obligation over exact subject/generation/participants, baseline revision and SimInstant, permitted semantic checkpoints or terminal/successor facts, simulation-tick cadence and complete typed non-progress dispositions. A separate bounded read-only verifier consumes the accepted diagnostic envelope and returns SATISFIED, VIOLATED, live PENDING or terminal INCONCLUSIVE without mutating, repairing, advancing or reclassifying canonical state. It detects unexplained stalls, false active/pending presentation and canonical/physical divergence at the first observable boundary, freezes one bounded identity-complete incident capsule with linked player-view evidence, and mechanically prevents an incomplete terminal story or evidence gap from becoming a human candidate. Equivalent capsules retain one stable owner-routed defect identity and cumulative lifecycle across builds/worlds; VERIFIED requires rejection of the strongest original contradiction plus a retained regression, and any recurrence reopens the same defect. Wall-clock health is independent of canonical liveness; telemetry/export loss is visible and never changes simulation. docs/frontier-v3-runtime-verification.md owns OBS-002, deterministic replay, first-divergence, defect lifecycle and promotion semantics."
  - id: "frontier-v3-scene-demand-aggregation"
    lifecycle: "active-correction"
    statement: "Natural player presentation demand is aggregated server-side for one process/front with at most one physical lease per owner/version/epoch. Additional observers cannot create bodies, schedules or progress. A remaining observer prevents presentation drain. Zero demand plus bounded hysteresis only permits a release attempt: independent physical activity and outstanding effects must be checkpointed and fenced first. A live container or mechanism may retain its own custody without a viewer. Disjoint fronts may be presented concurrently within budgets and interact through the canonical cross-front protocol."
  - id: "frontier-v3-seamless-foundation"
    lifecycle: "active-correction"
    statement: "docs/frontier-v3-seamless-foundation.md is the mandatory F0 correction contract and supersedes historical implementation details that make materialization permanent authority, player demand an off-screen scheduler, one Vanilla stack a permanent identity, one scene an entire operation, one exact movement edge a complete animation path, restart inspection a permanent liveness prerequisite or generic CONFLICT the response to ordinary gameplay. No new MAT breadth is admitted until its P0 findings and recurrence guards close."
  - id: "frontier-v3-replica-custody"
    lifecycle: "active-correction"
    statement: "Persistent Minecraft replica evidence and current physical execution custody are independent. A replica retains semantic identity, last emitted revision and last observed fingerprint; a bounded lease retains the current authority epoch. Canonical economy and process liveness may depend only on canonical facts and a current lease, never on whether a chest, body or structure was materialized in the past. An unchanged owned replica may safely catch up to canonical state; changed evidence is observed and classified before any write."
  - id: "frontier-v3-unloaded-actor-carrier"
    lifecycle: "active-correction"
    statement: "An exact actor remains one canonical person or organism across HOT, COLD, unload and restart. While its Minecraft body is naturally loaded and interaction-eligible, that body and one current authority epoch are the exclusive physical custodian and COLD cannot advance the same actor concurrently. Safe release atomically checkpoints the actor and owning process, fences the live binding and retains one bounded inactive physical carrier keyed by canonical actor ID, stable Minecraft UUID and carrier revision. The carrier is reconstruction/reconciliation evidence only: it owns no vitality, assignment, route, cursor, schedule, inventory or simulation authority and may not retain a chunk. After fencing, COLD advances the same canonical actor/process. Natural return or restart re-adopts or reconstructs that same actor and UUID at current canonical state under one newer epoch; it never selects a replacement or treats a safely unloaded exact worker as absent. Exactly one live binding or inactive carrier may be current. Missing, duplicate, foreign, stale or revision-mismatched evidence is a typed local ambiguity. Continuity requires the same canonical actor and UUID, not the same in-memory entity object; COLD movement may change the position seen on a later return but no observed body may teleport."
  - id: "frontier-v3-body-admission-placement"
    lifecycle: "active-correction"
    statement: "Fresh ambient PREPARED-to-HOT admission requires an epoch-bound supported-body receipt and atomically records actual canonical placement. A registered policy declares a bounded connected placement zone; the physical provider checks support, collision and foreign bodies without force-loading. Placement is not semantic arrival or resource transfer. Activity-owned capabilities resume their own stages; shared admission never inspects concrete work phases. PREPARED absence cannot retain a phantom service turn ahead of admitted physical occupancy. Current HOT occupancy checkpoints wake the existing access coordinator without a second queue. Idle or denied occupants clear the service boundary through shared goal navigation. Resident depot access is the first alternative-placement provider; unadopted purposes retain explicit exact placement."
  - id: "frontier-v3-deferred-aftermath"
    lifecycle: "active-correction"
    statement: "Natural physical availability gates immediate Minecraft effects, not all canonical progress. A HOT effect uses a durable intent and observed physical result. COLD commits consequences only from valid known facts and declared approximations, with bounded chunk-indexed idempotent aftermath retaining cause, event time, observation time and provenance. Natural loading inspects current evidence before writing current damage/infection/terrain; no replay, force-load, protected zones or blanket destruction of unknown blocks. Unknown shielding cannot justify an exact earlier casualty; unverified constructive capacity cannot feed irreversible dependent work. Contradictions reconcile locally without rewriting confirmed unrelated history."
  - id: "frontier-v3-fungible-resource-custody"
    lifecycle: "active-correction"
    statement: "One Minecraft item remains one exact canonical unit, but an ordinary fungible stack is not a permanent identity. Bounded resource lots, exact claim allocations and custody accounts preserve kind, quantity, economic owner and reservation; transient HOT physical bindings observe Vanilla split, merge, partial transfer, hopper movement, consumption, drop and pickup as exact zero-sum transactions. Stable identity remains on contracts, cargo batches, equipment and reserved allocations."
  - id: "frontier-v3-operation-fronts"
    lifecycle: "active-correction"
    statement: "A strategic operation owns its complete exact roster, purpose, global phase, reservations and result and may create only bounded typed child phases/fronts. Each child owns its local topology, cursor, objective and disjoint allocated actors/cargo/effects plus at most one physical scene lease; it cannot invent or retain resources outside that allocation. Child creation, join, cancellation, partial success, loss, rendezvous, compensation/return and terminal aggregation are deterministic canonical transitions. The parent cannot complete or release shared custody until every child is terminal and every surviving allocation is returned, transferred or explicitly lost. Disjoint fronts are not causal barriers: a bounded canonical interaction coordinator orders cross-front projectile, blast, pursuit and cargo consequences by exact cause ID, source/target owners and expected epochs, with once-only effects across mixed HOT/COLD boundaries. The complete operation is never one unbounded scene transaction, and exact reserves/transit bodies are canonically located actors rather than hidden cohorts."
  - id: "frontier-v3-local-navigation-envelope"
    lifecycle: "active-correction"
    statement: "Canonical movement owns capability, semantic origin/destination, selected facility port, mandatory semantic checkpoints, explicit hard spatial/formation constraints and current goal. A shared HOT navigation owner selects ephemeral local legs from a known-route hint, validates naturally loaded Minecraft candidates against hard scope, permitted medium and finite query bounds, and derives its discardable corridor from the accepted path. A valid detour may leave an advisory route stripe but never hard task restrictions; intermediate leg arrival cannot complete the semantic order. Existing topology/formation envelopes retain their explicit hard meaning. HOT movement owns sub-block pose, facing and velocity and reports only observed semantic arrival or explained persistent obstruction; it cannot select work, another strategic port or skip mandatory semantic checkpoints. Canonical work cadence may not appear as repeated multi-second movement pauses. COLD consumes retained evidence within declared validity without unloaded-world reads; physical detours cannot silently become COLD knowledge, and exclusive body checkpoint/fence owns handoff."
  - id: "frontier-v3-goal-navigation"
    lifecycle: "accepted-target-shared-adoption-open"
    statement: "A canonical task owns its stable actor, typed semantic target/work order, exact completed outcomes and movement goal; it does not own Minecraft's predicted micro-path, local waypoint choice or detour stripe. One provider-neutral navigation result distinguishes in-progress, observed final arrival, explained local blockage and ambiguity. A shared route follower owns physical segmentation and a shared path policy accepts loaded dry Minecraft detours within true hard restrictions, deriving a corridor only after acceptance. Search/path bounds, unloaded nodes, forbidden scope and unsupported medium remain distinguishable; a bounded local miss is not a global impossibility proof. COLD advances the same goal under retained knowledge without requiring first player arrival or reading unloaded chunks. Field CellId work progress is separate from locomotion; foreign crop obstruction affects only its cell and blocked transit receives bounded replan or a local disposition. docs/frontier-v3-goal-navigation.md owns adoption; source integration and focused tests do not establish full HOT/COLD/restart/player acceptance."
  - id: "frontier-v3-known-pedestrian-route-knowledge"
    lifecycle: "active-correction"
    statement: "A task declares the actor, capability, versioned goal, legal stations and exact authored facility/field scope; it never passes an ad-hoc blocked-block set to the pedestrian router. One pure read-only route-knowledge provider derives supported surfaces and structural/changed-cell route knowledge from authoritative plans/state, with typed field overlays and bounded search. Existing hall, depot, workshop and infirmary ports share the traversal plan's facility-port contract; new facility services reuse it without their own obstacle compiler, while new area kinds require an authoritative typed overlay. Moving COLD pedestrians are transient, not hard terrain; HOT native navigation handles their local avoidance. An authored passage cannot erase a subsequent physical change. A changed-cell delta without final block state is an epistemic gap, not proof of a solid obstacle. The separate service-access coordinator serializes only the physical throat, never the whole trip. COLD/HOT retain one semantic movement order and accept only witnessed legal arrival; route knowledge and service admission cannot select work or award an effect. Meal, exit, bakery and farmer known-route callers share the source provider; their movement ownership and HOT/player/product acceptance remain separate open work. docs/frontier-v3-goal-navigation.md owns the target."
  - id: "frontier-v3-physical-body-observation"
    lifecycle: "active-correction"
    statement: "One NeoForge physical observation boundary converts pedestrian pose to canonical BodyPosition. Naturally loaded dry collision support in actual feet contact yields nominal feet above that support, including fractional farmland/slab surfaces. Unsupported poses remain explicitly distinct and cannot establish supported arrival. Actor handoff, release, departure/rejoin, caches and entity-save evidence share that conversion; offline recovery validates a versioned observation bound to the exact serialized pose, without inferring terrain or loading chunks. The boundary owns neither navigation intent nor canonical actor state. Rail/cart coordinates and raw diagnostic pose are separate meanings. docs/work-orders/PM-F06R3-PHYSICAL-BODY-OBSERVATION-01.md owns the current correction; complete farmer/player acceptance remains open."
  - id: "frontier-v3-fenced-recovery"
    lifecycle: "active-correction"
    statement: "Every physical binding carries a durable authority epoch. Recovery reclaims exact current bindings or revokes safely checkpointed leases before COLD resumes; late stale projections cannot duplicate death, items or effects. Prepared intent, observed result, recoverably confirmed consequence and ambiguity are distinct. WAL is not atomic with chunk NBT or player inventory: each family proves its save/acknowledgement and idempotent postcondition protocol. Only explicitly reversible unconfirmed pose/checkpoint state may roll back after a hard crash, never arbitrary external custody. Ambiguity isolates the smallest asset with a bounded recovery/escalation policy, not unrelated world progress."
  - id: "frontier-v3-failure-taxonomy"
    lifecycle: "active-correction"
    statement: "Expected death, theft, obstruction, severance, partial delivery and destruction are normal typed domain disruptions whose smallest owner repairs, replans, replaces, retreats or abandons visibly. Ambiguous physical evidence isolates only its asset/front with bounded retry and retention. Only impossible canonical ownership/conservation or corrupt persistence quarantines the frontier instance. Generic CONFLICT is never a terminal substitute for an owning gameplay response."
  - id: "frontier-v3-actor-first-birth"
    lifecycle: "active-correction"
    statement: "Fresh-instance bootstrap and dynamic birth producers explicitly declare each actor identity and kind. First physical creation requires a retained unused permission, never missing history or an empty chunk. The host persists birth permission before the durable canonical birth transaction becomes visible, then persists PENDING before entity insertion; used history cannot reset to unused on retry. Birth event codecs retain the producer-declared tuple: a resident birth names its admitting job, and hive completion names its newborn independently of the completed job. A failed WAL append may retain an unused permission but cannot create a canonical actor or body. Recovery must retain exact physical history across checkpoint/WAL compaction; reconciliation of interrupted publication and orphan permissions remains required before full adoption."
  - id: "frontier-v3-observer-neutrality"
    lifecycle: "active-correction"
    statement: "Exact identity, accounting, claims, completed stages and hand-off progress never have statistical tolerance. Quiet production retains the same labor norms, inputs and outputs; elapsed differences require declared bounded physical/scheduling causes. Combat shares legal weapons, defense, tactics and known terrain semantics while success/loss/duration distributions meet predeclared versioned calibration criteria, not identical hits. Repeated mode changes preserve partial labor, cooldowns, wounds, commitments and keyed random opportunities without systematic advantage. Actual physical interactions are new inputs, not neutral observation."
  - id: "frontier-v3-retained-custody-death"
    lifecycle: "active-correction"
    statement: "Permission to execute work is not ownership of physical consequences. Every non-closed scene retains responsibility for exact declared member death, including PREPARED, CONFLICT and UNKNOWN_AFTER_RESTART. Accepted death atomically terminates that actor and its exact body recovery authority; PREPARED death also exits preparation without pretending work started. Other actors and unresolved scene causes remain unchanged. Adapter inactive/departure evidence retires only from canonical death with no remaining current body authority, never from absence or work rejection. Foreign owner, asset, epoch and revision cannot be retired by this boundary."
  - id: "frontier-v3-production-labor-clock"
    lifecycle: "active-correction"
    statement: "Production retains one worker, semantic movement goals, input allocation, station custody and labor progression independently of resource representation. Stationary HOT and COLD labor use the same canonical norm and one engine-owned continuation deadline; callbacks cannot manufacture elapsed work and COLD cannot front-load an unpaid batch. Open worker scenes hold that continuation without rescheduling it from a competing COLD writer. OUTPUT_READY ends recipe labor at the facility, not the job: bread remains in the bakery station's exact output custody until a confirmed station-to-worker pickup and worker-to-depot delivery. Completion and market/payment settlement require that delivery receipt, exclusive eligible custody and exact input/output accounting. Final job retirement cancels its retained continuation in the same transaction. Test runtime configurations preserve the same owner hold policy as production."
  - id: "frontier-v3-production-station-custody"
    lifecycle: "active-correction"
    statement: "Every processing recipe has an explicitly typed production station with bounded input/output custody, capability, recipe and retained work state. The job owns policy and the exact actor; neither actor nor station becomes a second economic owner or strategic AI. Source container to actor to station input, station-local input consumption and output creation, then station output to actor to destination are separate conserved, versioned custody transitions. An actor hand, remote depot, decorative block or unretained coordinate may not perform the recipe. The HOT provider must expose real physical input/output holding and visible station work, with durable-before-effect intents, actual postconditions and receipts; a Vanilla block without persistent holding cannot masquerade as that inventory. COLD advances the same station custody and clock only without a current physical writer. Damage, theft, blockage, missing capability and ambiguous restart remain local typed outcomes. Multiple station recipes compose through explicit carrier transfers, never teleport stock between machines. docs/frontier-v3-bakery-item-handling.md owns the first bakery adoption and verification."
  - id: "frontier-v3-projection-write-custody"
    lifecycle: "active-correction"
    statement: "An in-flight physical projection needs explicit epoch-fenced write custody, not a permanent COLD pause inferred from surface history. PREPARING owns only the exact expected write and excludes competing canonical stock mutation; it does not grant operational HOT permission. Matching observed fingerprint, provenance and exact revisions promote that same epoch atomically with the observed replica revision. Unknown or mismatching evidence cannot release or confirm the write. Full adoption requires registered durable commands, resource transfer, adapter write/recovery and a local evidence-preserving conflict disposition; a model primitive alone is not adoption."
  - id: "frontier-v3-scene-behavior-registry"
    statement: "A production scene is emitted only by its owning canonical process from current perceived facts, retained exact actors and current spatial state; it is never a pre-placed encounter or a development-profile fallback. A disposable fixture may construct a deterministic canonical precondition only behind the identified test-pilot nonce and may not be selected by a normal or live world start. One closed NeoForge SceneBehavior registry dispatches every known typed SceneCause through its own candidate, admission, materialize, HOT local-goal/effect, drain, recovery and diagnostic rules, while generic infrastructure owns lifecycle ordering, persisted lease identity, actor exclusivity, WAL and fail-closed policy. A behavior may submit only its own typed domain commands/observations and may not coerce a cause into logistics, invent cargo, substitute actors or bypass naturally loaded admission. New scene kinds add one registered behavior and normal/negative/recovery evidence; type-specific branches outside the registry are limited to sealed-codec compatibility and explicit read-only diagnostics."
  - id: "frontier-v3-extension-registries"
    statement: "Every v3 command payload, scheduled action kind and event payload has exactly one owner and one explicit stable codec in a closed deterministic pure-domain process registry, and every physical executor has exactly one stable ID in a closed staged NeoForge registry with declared phase, dependencies, owned physical kinds and bounded budget. Composition rejects missing or duplicate owners/codecs, undeclared emitted payloads, executor dependency cycles and competing exclusive writers before runtime; unknown input still quarantines. Explicit sealed codec dispatch remains permitted, while composition roots and server lifecycle contain no domain- or scene-specific policy."
  - id: "frontier-v3-owned-state-updates"
    statement: "FrontierWorldState remains immutable, but only its named copy/update boundary, fresh bootstrap assembly and versioned hydration may construct the complete aggregate. A process updates only its owned sub-aggregate or calls a named aggregate transition; positional full-state reconstruction in process/support code is forbidden. Transition validation receives explicit changed-domain ownership and fails closed if an unchanged component is replaced or a changed component is undeclared."
  - id: "frontier-v3-stable-wire-tags"
    statement: "Every enum or variant persisted in a v3 snapshot, WAL, receipt or physical ledger uses an explicit stable non-reused wire tag and a total fail-closed decoder; source declaration order is never a wire format. Adding a value never reuses an existing tag or silently changes its meaning; incompatible format or meaning changes require the fresh-world-only schema/reset boundary, current-format golden recovery and old-format rejection evidence, not a compatibility migration."
  - id: "frontier-v3-versioned-ruleset"
    statement: "Balance and cadence inputs are immutable FrontierRuleset data with a stable ID, schema and content hash retained by the world manifest and recovery image; processes receive that ruleset explicitly. Before any recovery engine pins a bootstrap, it reads only the verified snapshot header and selects that exact installed ruleset, then proves world ID and seed; a pre-ruleset snapshot therefore retains its named legacy anchor rather than being rebound to the current production default. Safety maxima and algorithmic invariants remain code, but intervals, gains, radii, costs and other tunable world rules cannot be silent private process constants. An unavailable or incompatible retained ruleset fails closed rather than adopting the current binary's defaults."
  - id: "frontier-v3-test-fixture-isolation"
    statement: "Disposable v3 fixture builders, profile catalog and selecting bootstrap provider exist only in a dedicated moddev/test classpath and are absent from the production packaged JAR. Production lifecycle always selects the ordinary world configuration regardless of JVM properties; a pilot run ID is correlation evidence, never authorization. One test-only declarative catalog owns profile IDs and validates every runner/parser consumer."
  - id: "frontier-v3-operation-assembly"
    statement: "A logistics operation begins only as a persisted ASSEMBLING record with one bounded exact approach cursor per named participant, distinct compiled public-port slots and one named cargo carrier; creation preserves all actor locations and cannot use a Hall anchor as a teleport. COLD and HOT assembly advance those same cursors only. A naturally loaded physical obstruction becomes one durable member-specific fact containing that member's next cursor plus only its assigned slot or the same compiled Hall throat floor; it visibly freezes the shared assembly until ordinary movement reaches the unchanged cursor after passage is restored, rather than polling COLD through it, choosing an alternate hidden position or clearing it speculatively. COLD actor records are not physical obstacles to pure compilation; only a non-CLOSED HOT ambient lease reserves its floor cell, and loaded-world admission remains authoritative. Only a complete assembly atomically starts its OperationTravel. An arrived OperationTravel atomically advances the strategic segment while retaining formation and cargo positions; no non-atomic route-index update may clear or collapse that movement state. Scene demand, recovery and player-visible projection consume the same current operation checkpoint: its exact participant formation and its distinct exact cargo anchor. A carrier sighting/intercept pins the cargo anchor it actually saw; an engagement HOT lease retains that cargo anchor alongside the participant hand-off position, never substitutes one for the other. ASSEMBLING is not attackable as an en-route caravan."
  - id: "frontier-v3-physical-causality"
    statement: "A persisted v3 physical intent may affect every physically reachable Minecraft block, entity or player-owned structure without a protected-zone filter; actual results are immutable typed evidence, known subjects receive semantic consequences and unknown results enter the bounded physical-delta index instead of being erased by desired-state materialization."
  - id: "frontier-v3-infection-surface"
    statement: "One nonzero v3 4×4 canonical infection cell is alien territorial substrate, not a hidden transport or command network, and projects only as one all-or-conflict sixteen-column loaded surface patch. Each seed nest starts with a canonical 3×3 cell cluster (saturated core, active cardinal cells, infected corners), so the first naturally loaded nest is a real 12×12 infection territory rather than a decorative enlarged marker; later spread still creates exact adjacent cells through the ordinary hive task. Passive extraction consumes finite cell substrate or bounded ecological/carcass input and never creates infinite biomass. Measured columns, stage and `PREPARED`/active/conflict/clear lifecycle are bounded NeoForge provenance rather than canonical terrain state: exact columns are recorded before the first write, recovery activates only a complete matching patch, retries only an entirely absent patch, and turns every mixed/foreign result into a permanent conflict. Growth or retreat changes every exact active column together, while a foreign change never authorizes a repaint or a vertically stacked retry."
  - id: "frontier-v3-physical-world"
    statement: "All Frontier v3 materialization, inspection, restart-safety and player-feedback boundaries execute exclusively in `pale_mirror:frontier_graybox`; events from every other Minecraft dimension are no-ops for v3. That dimension is the V3-owned physical boundary and is never substituted with an overworld fallback or force-loaded."
  - id: "frontier-v3-exact-economy"
    lifecycle: "active-correction"
    statement: "Frontier v3 represents every canonical person and bioform exactly once and accounts for every Minecraft resource unit through declared recipe inputs/outputs and exact custody transitions. Fungible items are owned as bounded resource lots and exact claim allocations, not as an immortal UUID attached to one vanilla ItemStack: ordinary split, merge, hopper transfer and partial delivery may change physical stack layout without changing total quantity, provenance, claim or custody. Containers, actors, production-station inputs/outputs, cargo operations and world carriers expose bounded custody accounts; loaded slot bindings are transient observed projections of those accounts. Fresh genesis issues one finite named treasury reserve per settlement; after bootstrap every monetary mutation is a positive durable zero-sum transfer, never a hidden pool or runtime mint. Financial reservations bind named payer, payee, reason and amount but are not money. Legal institutions own company identity, employment and market orders; an accepted work order binds its producing task and reservation, and confirmed delivered output settles that reservation. COLD production and HOT physical production mutate the same held lots through exact actor transport, station-held recipe conversion and semantic work progression. Physical departure, theft, loss and reconciliation transfer or disrupt exact allocations without refund, recreation or duplicate placement. No cohort multiplier, hidden stock counter, permanent stack identity or duplicate transport economy is permitted."
  - id: "frontier-v3-future-create-provider"
    statement: "Create is an accepted post-graybox NeoForge physical provider, never a pure-domain dependency, planner, inventory owner or second simulation. The accepted transport family is rail only; road freight and aeronautical transport remain excluded until a later explicit provider contract. Current v3 facilities expose provider-neutral semantic input/output, energy and maintenance ports, while rail topology retains stable segments, junctions, stations, bridges, tunnels and loading ports plus one exact train/wagon/cargo/route-cursor lease boundary. The future provider may physically realize factories, farms, weapons, turrets, extraction, energy, metallurgy/materials, warehousing/rail logistics and construction/engineering, but canonical capability or output follows only an exact observed postcondition. HOT native work suspends the same COLD process; missing/changed mechanisms, train obstruction, theft or damage fail visibly without fallback duplication, force-loading or desired-state repair. Actual Create implementation is outside the current graybox cutover gate."
  - id: "frontier-v3-hive-organ-network"
    statement: "The two seed nests are roots of one distributed organism, never a global shared inventory. Hiveroot is one bounded stable-ID physical segment graph with independently degradable vascular and synaptic capacity; infection cells are substrate around it, not implicit edges. An exact hive nutrient may cross different STORE organs only through one bounded named organ-network transfer with a source slot, target slot, cargo identity, deterministic corridor/phase and terminal receipt. Its departure removes the exact source claim before transit; its arrival places that same item identity into the retained target slot. A broken segment/endpoint, exhausted target capacity, player theft or unresolved loaded-world postcondition blocks that same transfer visibly and leaves no permission for cross-nest growth, duplicate stock or a replacement stack. COLD may advance an unmaterialized conduit by its persisted cursor; an active physical endpoint requires an owned durable-before-effect materialization/inspection boundary and never force-loads either nest. Growth, brood, healing and adaptation may consume only a local exact STORE input or the completed receipt of such a transfer."
  - id: "frontier-v3-hive-control-physiology"
    statement: "HIVEMIND names the distributed intelligence, while GANGLION is its local integration organ. The complete organ vocabulary uses explicit non-reused wire tags; the retired HEART byte is unmapped and schema 103/envelope 12 reject earlier worlds before hydration. A seed nest may materialize only currently implemented Ganglion, Brood and Store functions; an accepted vocabulary type may not be fabricated before its owning process exists. Connected stationary RELAY organs coordinate a bounded territorial radius; a coordinated operation beyond that coverage requires one exact OVERSEER with weighted capacity and exact subordinate IDs. Purposeful SENTINEL observations become hive knowledge only after physical sensing and delivery to a valid connected receiver. Schema 104/envelope 13 replaces mixed BioformRole with independently tagged canonical chassis, visible mutation set and current assignment: current bomber means EXPLOSIVE+ASSAULT, and Sentinel Scout means SENTINEL+SCOUT. Vitality/position remain the one ActorLocation authority and HOT custody its persisted ambient lease until a dedicated lifecycle/cocoon process moves them; no parallel health/body ledger is permitted. Controller, wounds, structural/reserve biomass, cocoon lifecycle and last-order memory require that future owning process before they may appear. Mature inactive bodies will occupy exact HIBERNACULUM cocoon slots; only a current canonical task or perceived threat may wake them, never chunk load. Consumption, sacrifice, carcasses, grafting, adaptation and explosive charge must conserve exact biomass and remain visible interruptible physical processes without protected zones or silent desired-state repair."
  - id: "frontier-v3-human-capability-model"
    lifecycle: "active-development"
    statement: "Every human is one exact persistent resident. Profile/condition, bounded trainable skills, profession and employment, exclusive current assignment, exact equipment/custody and work or tactical organization are separate canonical concerns governed by docs/frontier-v3-human-capabilities.md. Current assignment is a pure projection of its owning persisted job, operation, patrol, journey or active assault-owned defender unit until a future unit process requires additional durable state; it is never a duplicate mutable ledger. The first defender unit is an ordered exact member/leader record owned only by its SettlementAssault; admission excludes every current civilian claim, except an exact COLD market-backed production job may be interrupted only by the same active fresh-sighting settlement defence cause. That atomic interruption returns its exact held input, releases its invoice reservation and cancels its work order before defence claims the resident; materialized or physically committed work remains unavailable. A tactical function is derived from those facts and may not be persisted or materialized as a replacement person or permanent species-like class. The provisional ResidentRole is bootstrap affinity only. Mobilization explicitly settles, interrupts or suspends conflicting work and removes that exact labour capacity; one person can never produce civilian output while simultaneously executing a military assignment. HOT/COLD and restart retain the same resident, assignment, unit, equipment, casualties and objective, while leader or equipment loss degrades capability without deleting survivors. Future Create providers consume semantic operator, rail-crew and engineering assignments and may not own a second human registry."
    verification: "critical-code"
  - id: "frontier-v3-exact-human-population"
    statement: "The bounded pure-Java HumanPopulation register is the only owner of each exact resident's household, settlement membership, provisional bootstrap affinity, birth tick, complete bounded skill vector, disease state, settlement quarantine policy, exact resident need state and settlement schedule policy and active Transit journey; ActorCondition is the only owner of that person's physical vitality. Personal hunger is evaluated from retained need level and engine-owned threshold actions; one confirmed exact resident consumption retires one bread unit through the common resource ledger and changes only that resident's need. The depot reserve for exports is derived from current stock, exact needs and active claims, never an independent counter. Food and work status must report stock, claims and wait reason rather than a fulfilled/required settlement ration cycle. Hunger is a retained need and may interrupt work only for an executable allocated meal at a safe checkpoint; without available food a living resident remains eligible for new and retained work while need accrues and self-care retries. An already durable work/effect lifecycle keeps its exact worker until that lifecycle completes or reaches an explicit failure boundary. Health changes only through ordered resident transitions triggered by canonical infection contact with current semantic settlement geometry; quarantine changes only after that exact health state and blocks new logistics/migration without rewriting existing custody or bodies. A migration has one resident ID, immutable bounded adjacent-position corridor, exact cursor and an implicit one-bed destination reservation; COLD advances only a small bounded distance while no HOT/scene executor owns that resident, while a HOT hand-off must continue the same cursor and identity. Quarantine, lost reserved housing or known route loss blocks that same journey visibly, and household/settlement changes only at its arrived cursor. Bootstrap people, births and migrations atomically keep the register and actor index equal, while a confirmed physical death preserves the individual record and changes only ActorCondition to DEAD. Bootstrap residents seed identity only: every post-bootstrap production, route, patrol, combat and validation query must use current canonical human state plus ActorCondition, never the immutable bootstrap list. No actor absence, duplicate body, implicit migration, oversubscribed housing or aggregate cohort may alter population."
  - id: "frontier-v3-recipient-provision-birth"
    lifecycle: "active-development"
    statement: "Exact resident hunger, settlement schedule policy and one current WORK/EAT/IDLE activity supersede settlement-wide provision as nutrition authority. HumanPopulation owns per-resident need and register, ActorCondition owns vitality, and the common resource ledger owns quantity/economic owner/custody/claims. Every work family yields only at its declared safe checkpoint, preserving the exact assignment, job and cargo; only one confirmed HOT or COLD resident consumption retires bread and relieves hunger. One birth retains exact household participants, home and exclusive bed slot, care/food allocations and stages; its transition atomically adds one age-correct resident, need and ActorCondition. HOT uses retained bodies/stations and typed observations, COLD advances the same stages, and demand loss/restart preserve stages and reservations. docs/frontier-v3-resident-life-resource-contract.md governs resident life and stock; docs/frontier-v3-recipient-provision-birth-contract.md governs birth."
  - id: "frontier-v3-work-opportunities"
    lifecycle: "active-development"
    statement: "Accepted target in docs/frontier-v3-work-opportunities.md: work permissions and settlement priorities are distinct from current resident assignment. Family providers offer available exact work; shared activity/selection owns ranking, reservations own target/resource/place admission, and individual family execution owns its worker, labour and custody through the existing shared navigation and resource boundaries. A refused opportunity creates no resident-owned waiting job. Multiple farmers reserve distinct current cell generations without sharing labour or deriving hand quantity from whole-field yield. Multiple permitted bakers can select work from a bakery whose individual station places determine concurrency. Shared selectors and reservation protocols may not inspect concrete family phases or infer dispatch from identifiers. Current adoption is partial: eligible selection, bakery exact-worker admission/employment, persisted DecisionAuthority work permissions and exact two-farmer/two-baker genesis policy are wired under fresh-only schema222. Harvest issuance and confirmed output history belong to the exact job; the common ledger owns hand quantity and actor/container transfer. BakeryWorkState declares its station reservation through confirmed output removal; ProductionFacilityReservations derives occupancy and validates starts/hydration independently of retained cargo or return. Concurrent field executions/current cell generations, generic provider/target claim composition and native multi-worker acceptance remain open. The prior one-worker field path is not evidence of this target's completion."
  - id: "frontier-v3-resident-characteristics"
    lifecycle: "planned-alignment"
    statement: "HumanPopulation owns each exact resident's bounded typed characteristics independently of skills, profession, activity, schedule, need level and ActorCondition vitality. A closed stable-tag definition declares each characteristic's unit, bounds, default, deterministic modifier combination and consumers; only metabolism is populated in the first resident-life cut. World ruleset supplies hashed defaults and limits, while canonical resident base values and source-identified, lifecycle-bounded modifiers supply individual variation. Need integration retains fractional fixed-point progress and the exact last-evaluated instant: a characteristic change first integrates elapsed need under the old effective rate, then applies the new value and atomically replaces that resident's engine-owned threshold action. No generic untyped property bag, inferred profession-as-physiology, per-tick population scan, second due-time queue or retroactive hunger is allowed. Birth initializes, migration retains and death closes the exact resident's characteristic/need schedule relationship. docs/frontier-v3-resident-life-resource-contract.md owns the detailed transition and evidence contract."
  - id: "frontier-v3-service-access"
    lifecycle: "active-development"
    statement: "Every shared service point declares typed geometry, capacity and an explicit physical access boundary. A pure access coordinator arbitrates entry and release among existing exact task owners; their process records and ScheduledAction retries remain durable request/turn evidence, without a second queue, item ledger, route or custody owner. Access ownership ends at the first witnessed body position outside the boundary, independently of later consumption, movement or work. Taking a meal portion and clearing the source allows the next contender to enter while the first eats elsewhere. Consumption alone changes nutrition. Activity selection after eating must not wait for an optional home journey; idle movement is safely interruptible through its owner's capability, while clearing an occupied throat remains a physical safety obligation. HOT local avoidance need not land on a precomputed route cell. Bakery delivery jobs and field work use this same boundary. Station work outside the boundary never retains the point merely because its scene is open. A safely yielded worker may eat using their own turn. A blocked contender waits without teleport, task loss or converting transient contention into a navigation conflict. The accepted 2026-10-01 amendment in docs/frontier-v3-resident-life-resource-contract.md is planned alignment, not evidence that the current runtime implements portion meals or interruptible post-meal movement."
  - id: "frontier-v3-bounded-satiety"
    lifecycle: "planned-alignment"
    statement: "HumanPopulation owns bounded resident satiety and fixed-point elapsed integration; resident characteristics supply typed capacity and metabolism. At zero satiety, starvation affects a separate canonical resident health condition, not a negative food level or debt of missed meals. ActorCondition alone owns physical vitality. Food definitions supply nutrition; the meal owner allocates and consumes exact portions through FungibleResourceLedger without selecting work or requiring a home return. ResidentActivityCoordinator selects the next activity; ActorExecutionCoordinator and registered owner capabilities perform exclusive safe handoffs; navigation owns geometry, travel and recovery; service access owns only point occupancy. Consumed receipts atomically retire quantity and add nutritional value once. HOT/COLD share integration and receipt semantics. Source checkpoints bc96b434 and 91fd059d implement bounded satiety, independent starvation health facts and hashed food definitions with exact stock-limited multi-lot portions and multi-slot HOT fences (production bread only, R10/schema12). State220 adds TAKE -> CLEAR_ACCESS -> CONSUME: the actor retains exact food custody while the common navigator clears the source; ServiceClearanceTargets selects a reachable declared free pocket independently of nutrition and activity policy. Physical boundary exit releases access before consumption. Confirmed eating retires the meal and wakes activity selection without creating mandatory home travel; ResidentActivityProcess, not the food owner, retargets HOT purpose after receipts. Individual capacity characteristics and further owner extraction remain planned. These source checks are not live/native acceptance; detailed ordering and focused closure criteria remain in docs/frontier-v3-resident-life-resource-contract.md."
  - id: "frontier-v3-perceived-knowledge"
    statement: "A settlement strategic decision may consume only its own bounded durable perception register, never a direct query of hidden enemy actors, operations or global infection. The sole local-infection perception bridge compares only infection cells within an operational local infirmary radius, emits an ordered SettlementInfectionObserved fact before a containment decision, and removes that fact only after a later local clear observation. The record validates its settlement owner, cell locality, nonzero intensity and observation instant; snapshots and WAL retain it. The hive's bounded territorial belief map is equally separate from the canonical infection field: on one strategic refresh it accepts at most four current nonzero cells, each sensed only within a living Scout's 48-block radius or an operational Ganglion's 32-block radius, records the exact sensor position and expires from target selection after 2,400 ticks. A living Scout may additionally retain at most 32 named settlement-anchor sightings only after reaching their 64-block local radius; a retained sighting never grants remote structure/actor inspection, and while fresh it can only steer an existing EXPAND infection frontier toward that exact anchor. A same-tick Scout patrol advance may validate that just-recorded predecessor position, but no older or arbitrary remote position is evidence. The durable hive doctrine is a bounded utility result, not a settlement-policy clone: fresh Scout sighting selects `INTERDICT`, exact owned biomass or absent fresh territory selects `CONSOLIDATE`, and only fresh territorial beliefs without either condition select `EXPAND`; it gates operation kinds but cannot discover hidden coordinates. Hive infection expansion derives its frontier only from fresh territorial beliefs, with an owned Ganglion root as the sole no-belief fallback; it never scans global infection. A cargo-load event is not hive perception: an unleased exact Scout advances one bounded deterministic step around its own seed-nest scouting circuit. The actor's canonical position is that patrol's one shared cursor: COLD records its exact predecessor and next step before moving it; HOT leases that same next step, and only a physical arrival with the matching predecessor may atomically advance the cursor and retarget the lease. Legacy predecessor-less WAL may recover only an unleased perimeter position and can never move a HOT body. COLD may persist HiveOperationObserved only for a living unleased Scout inside the bounded local sight radius of the EN_ROUTE caravan's exact canonical cargo anchor; when no travel is active that anchor is the operation position. HOT may persist the distinct HotScoutOperationObserved only when a living Scout has an active SCOUT_PATROL lease and actually observes the exact owned Minecart carrier of a HOT non-engagement scene; the event binds the Scout, scene lease, operation, cargo and cargo anchor before it updates the shared bounded knowledge register. Neither path may obtain an operation coordinate by scanning global canonical operations. A fresh sighting may create one intercept task that durably pins that operation ID and exact seen position; execution approaches that pinned position and may inspect current operation state only for liveness and whether the named carrier physically meets it, never to retarget. An old task without that position blocks rather than acquiring hidden coordinates. Physiology and materialization may inspect their own semantic preconditions, but neither creates a strategic side-channel."
  - id: "frontier-v3-settlement-assault"
    statement: "A hive settlement assault is a bounded first-class canonical operation, never a route engagement with a missing cargo. It may begin only from one fresh retained Scout settlement sighting and a fresh locally sensed territorial/infection fact near that same named settlement; it retains the exact sighting, named attackers, bounded approach cursors, settlement anchor, lifecycle and terminal outcome. COLD advances those exact attackers only while no HOT scene owns them. The pure battlefield compiler assigns each attacker one distinct local perimeter floor through its retained approach cursor; each defender retains its exact current local floor. One ambient-to-scene admission derivation for one immutable canonical state compiles at most one current loss-masked provider view and shares it across every active assault and scanned actor; only a canonical state replacement may create the next derived view. That view resolves only its declared local support/headroom demand through the canonical graybox cell meaning and owner/material precedence: it may not duplicate projection grammar, synchronously traverse unrelated world geometry or claim boundedness from output size while doing unbounded input work. This disposable result is never persisted or physical authority, and the production hand-off policy exposes this bounded composition through a deterministic non-Minecraft execution seam. That policy owns canonical reservation, actor and lease eligibility plus effect selection; a Minecraft effect port may execute the selected body transition and return its resulting state but cannot replace the decision policy. A successful port result must satisfy the selected effect's canonical postcondition, including ordinary DRAINING-to-release closure for an abandoned prepared lease; an unchanged, manually substituted or otherwise contradictory state fails closed. A naturally loaded battle may prepare only a `SettlementAssaultSceneCause` that binds the retained assault and settlement, has no cargo carrier, and includes the exact participating defenders/attackers at those distinct compiled hand-off floors. A missing, non-local, obstructed or changed defender/attacker remains `WAITING_FOR_BATTLE` or becomes visible `CONFLICT`; materialization may never reposition it or choose a substitute floor. Its combat, death, TNT, block loss and infection evidence use the ordinary physical-effect boundaries; leaving demand drains the scene into the same assault state, while restart inspects existing bodies or visibly reaches UNKNOWN/CONFLICT rather than recreating a battle or converting it into logistics. A stale/replaced sighting, unavailable attacker, destroyed target geometry or foreign actor blocks that exact assault rather than retargeting or querying hidden state."
  - id: "frontier-v3-facility-capacity"
    statement: "Settlement facility capability is a pure deterministic projection of the stable semantic structure kind and the one canonical StructureCondition; it is never a second mutable population or building counter. Human births and migrations require a free operational housing place, while physical destruction may leave existing exact people displaced rather than deleting or silently relocating them. Economy, AI and player boards use the same projection."
  - id: "frontier-v3-persistence"
    statement: "Frontier v3 persists versioned checksummed snapshots plus an ordered write-ahead log; player custody, physical leases and non-replayable effects are durable before acknowledgement or invocation, recovery never blindly replays a running effect, and compaction keeps events, schedules, receipts and physical deltas bounded. A fully settled logistics operation is detached only by a durable event after its cargo, active/unknown intent, lease, engagement and exact intercept-task claims have closed; its active operation/contract pair is replaced by one bounded deterministic terminal receipt, never silently deleted. That same owner retires only the confirmed receipt pairs whose exact kind and subjects bind that terminal operation/contract/cargo; a receipt that still needs a live owner cannot outlive that owner, and unrelated effects are never deleted by a broad subject-id sweep."
  - id: "frontier-v3-bounded-runtime"
    statement: "Frontier v3 uses indexed event-driven work, bounded server-tick budgets, a fixed pending-schedule safety capacity, incremental projections and naturally loaded chunks only; bootstrap, recovery and every transaction prove queue capacity before canonical engine installation/WAL/canonical mutation, while deferral preserves one due-action order and simulation lag, conflicts, queue depth, storage growth and per-stage cost remain observable. A physical world-effect executor first checks current naturally loaded non-spectator player demand at its exact origin before it resolves/recompiles semantic geometry; stale chunk residency is never mutation authority or a reason to pay background geometry cost. The projection stage owns one immutable structural snapshot bound to its exact structural input and may expose only bounded read-only point queries to later physical stages. Ambient/scene admission consumes that already-compatible snapshot and applies current loss masking by its requested positions; absence or input mismatch defers admission fail-closed until projection refreshes it, never synchronously compiles geometry, iterates the snapshot or falls back to an independently maintained local grammar. A larger physical scene never creates cohorts or a second canonical actor model: it partitions one exact operation into bounded spatial subscenes with indexed local membership, preserves identity/causality at every boundary, and may raise a materialized-body limit only after a same-seed reproducible JFR route plus a terminal causal scenario prove no lost ownership, degraded recovery or unbounded queue."
  - id: "frontier-v3-readable-projection"
    handoff_contract: "docs/frontier-v3-execution-semantics.md: Current-state COLD/HOT presentation handoff (accepted 2026-10-02). Read-only owner readiness composes current field witnesses and actual reference-container stock/provenance at one canonical revision. WAITING delays chunk transmission and new scene admission; classified CONFLICT remains inspectable but never grants HOT authority. Existing projection/effect/recovery owners retain mutation and budgets. PREPARED retained ambient bodies reproject only under exact current ownership; HOT bodies are never teleported. Initial adoption is field/farmer/reference-container and ambient admission, not all scene families."
    statement: "The pure v3 readability plan derives one bounded player-facing board per functional settlement structure, resource site, hive organ and route network from canonical state; each board has a deterministic semantic scope: landmarks orient an approach, while local facts stay compact, occluded by physical geometry and within local view range rather than becoming a remote HUD. Its NeoForge TextDisplay has deterministic identity and durable provenance, may inspect only loaded chunks, and a moved, replaced or missing claimed board becomes visible conflict evidence rather than recreation authority. A revision refresh preserves the deterministic round-robin position whenever board owner/position slots remain equal, so unrelated continuous simulation events cannot starve a later loaded board. Board text exposes state, risk and action but never opaque canonical IDs. A building/organ board derives contamination only when a live canonical infection cell intersects its current semantic geometry, then exposes the highest exact severity as a warning; it does not invent a separate object infection state. A HOT cargo carrier may have one deterministic, non-owning local TextDisplay passenger with a readable affiliation/load caption; it follows and disappears with that exact cart, never owns operation state or grants replay/recovery authority. Graybox separates alien infection surface, raised hiveroot, vascular/synaptic flow, severance, organ function and cocoon occupancy. Every exact active bioform has a non-dropping marker/geometry that distinguishes chassis, important mutation and current assignment and suppresses only vanilla Zombie daylight ignition, never real physical fire or explosion consequences."
  - id: "player-notice-boundary"
    statement: "Player notice delivery is an ephemeral bounded NeoForge presentation boundary, never canonical state, WAL, a retry queue or a substitute for boards, journal or Atlas. It is a semantic policy, not a stream throttle: background simulation cannot write a HUD surface; it remains legible through physical objects, boards, journal and Atlas. Successful actions never write the HUD: their real inventory/world consequence and owned board are the acknowledgement. A direct player-action rejection receives only one quiet local non-textual cue, deduplicated and globally quiet for three seconds; its explanation remains on the affected object's board or explicit inspection card, so PM never claims the action bar or chat. An explicit inspection may replace the one negotiated contextual object card immediately, while no background event can replace it. The card has one title, at most two detail lines, bounded expiry and a responsive safe-zone width; it is an optional local view of a selected physical object, while its stable state remains on the object board and in the Atlas. A V3 board card is admitted only from the exact current canonical board plan and its matching claimed TextDisplay UUID/position; a lookalike or stale board cannot become presentation authority. A system fault remains visible through its affected object/conflict state and operator diagnostics, never as a gameplay chat stream. Server stop, reconnect or presentation-clock rewind may forget suppression without changing world truth. V3 physical feedback, and any retained Source Graybox aid, must use this boundary rather than directly writing player HUD/chat; operator diagnostics remain opt-in and never emit periodic HUD text."
  - id: "player-presentation-routing"
    statement: "Ordinary gameplay code has no direct Minecraft HUD/chat delivery: PlayerPresentation may emit only a bounded non-textual local rejection cue and an explicit inspection card; RegionalJournal is an explicit player-requested transcript and RuntimeDebugNavigator is an opt-in operator transcript. Successful gameplay changes are acknowledged by their physical result, item lore, owned boards or Atlas, while ordinary gameplay never writes the action bar, toast stream or system chat."
  - id: "frontier-v3-test-harness-boundary"
    statement: "The development test harness proves normal network-player causality without becoming a second simulation: the NeoForge pilot has no canonical or world-file mutation API, v3 diagnostics are bounded immutable server-thread reads that never force-load chunks, and visible audit uses at most one ordinary graphical client on DISPLAY=:0. Default development runs use a NeoForge-plus-current-source lite client and matching disposable seeded server world; the full pack is an explicit final-compatibility profile. Scenario setup is explicitly separate from evidence-bearing player actions: a fixture is only read-only diagnostics, and a visit is ordinary player travel followed by client-observed natural chunk readiness. The ordinary client is an explicit physical scenario input: before each evidence-bearing interval the pilot records its exact body/clearance and proves the observation pose does not overlap any current or declared route, station, interaction or effect envelope; later observer collision, demand or camera discontinuity yields exact HARNESS_INTERFERENCE/INCONCLUSIVE rather than a product verdict or silent retry, and relocation starts a new declared interval. An active pilot keeps only its own client quiet: it retains server-authored diagnostics in bounded local state and PMV3 JSONL while suppressing system-chat/ephemeral tutorial-toast noise for the whole run; it never changes ordinary player chat, canonical state or production HUD policy. The pilot may use normal Minecraft container open and quick-move interaction; one named-container diagnostic exposes only its canonical surface lifecycle and bounded exact occupied-slot projection, so player ingress is proved without an item mutation API. Local semantic checks prove a loaded exact block or named owned board in the current camera cone before a linked frame is captured; they cannot mutate it. Domain waits require terminal business postconditions rather than transient phases. A recovery scenario splits at one declared action boundary, persists the exact disposable world through graceful or exact-process-group abrupt stop, and resumes only after its normal server lifecycle; graceful continuation requires Minecraft's all-dimensions-saved acknowledgement. PMV3 JSONL keeps one bounded run/action correlation stream separate from third-party logs."
  - id: "canonical-state"
    statement: "Pale Mirror is the only canonical owner of world progression, scenarios, and desired state; Minecraft and adapters are observed/materialized representations."
  - id: "canonical-mutation-boundary"
    statement: "Production code mutates canonical WorldState only through a DomainCommandExecutor transaction; collection views are immutable, package-private mutation is reserved for the command processor, and persistence hydration is isolated to codecs."
  - id: "snapshot-integrity"
    statement: "Schema-v40 snapshots are accepted only after canonical aggregate and physical-projection validation; orphan references, duplicate active jobs and mismatched exact parcel bindings fail closed before save or after hydration."
  - id: "bounded-causal-retention"
    statement: "Detailed domain history, terminal journeys and terminal materialization jobs have fixed upper bounds; deterministic summaries and receipts preserve aggregate causality without allowing server-lifetime growth."
  - id: "strategic-schedule-retirement"
    statement: "The registered strategy reducer owner closes exact scheduled continuations when its bounded compaction removes terminal tasks. The kernel records ordinary schedule cancellation events immediately after the owning reduction in the same WAL transaction, then validates the final reference closure before publication. Recovery replays those recorded events rather than recomputing retirement policy. Nonterminal removal, unknown dangling subjects and unrelated schedules are never silently repaired; unchanged owners do not scan the queue."
  - id: "frontier-v3-terminal-process-receipt"
    statement: "When a duration-bearing live process is removed after semantic completion, the same canonical transition replaces it with one compact immutable receipt owned by its durable cause. That receipt retains the exact process and participant identities, terminal semantic outcome, input/output relationship, and the final typed traversal topology identity/revision, cursor and body/station needed to distinguish lawful completion from reset, replacement or replay across snapshot/WAL restart and natural re-entry. It is read-only causal evidence, never authority to resume work or reproduce an effect; its owner validates it atomically against the live process, exposes it through the ordinary relationship/diagnostic view, and retains or compacts it under the owner's existing fixed bound without dropping a receipt still referenced by predecessor/successor or physical-reconciliation state."
  - id: "weighted-route-allocation"
    statement: "Shared facility output is allocated deterministically across active routes by destination demand and explicit route weight; route identity is used only for stable remainder ordering and never as economic priority."
  - id: "domain-purity"
    statement: "Domain code must not import Minecraft, NeoForge, persistence, adapters, wall-clock, or ambient random APIs."
  - id: "materialization-safety"
    statement: "Every long-lived physical transition is compiled from pinned semantic policy into a Core-owned persisted PRESENTATION or CAPABILITY job and executed only through the guarded NeoForge MaterializationGateway with loaded-chunk, exact parcel identity, semantic-slot, precondition and postcondition checks plus rollback on a rejected postcondition. Canonical infection registers immutable semantic ownership without loading its whole MineSite, observes each physical baseline only when that cell's chunk naturally becomes available, and materializes its controller before bounded overlay reconciliation whenever the site is nearby, independently of story acceptance. Applied cells are durable crash-safe progress and do not require their chunks to remain loaded while later slices reconcile; unloaded cells remain pending without force-loading. Combat actors and source-native gate mechanics are incident- and knowledge-gated shared physical help: entering an infected MineSite may materialize them without accepting a private scenario, while strategic commands still require RESPOND."
  - id: "fresh-world-genesis"
    statement: "Fresh-world visual genesis is distinct from reconciliation materialization; one dedicated coordinator uses a bounded configurable worker pool for independent terrain probes and candidate attempts, then deterministically reduces indexed results and compiles immutable manifests into chunk-addressed slices before players are admitted. A registered worldgen Feature may apply only the current slice while that chunk is naturally generating. Loaded-chunk events observe persisted generation stamps and never write static geometry; prospective chunks are never force-loaded and there is no retrofit or pre-v40 compatibility path. When `genesis.authoredEnabled=true`, that coordinator is the admission owner. `genesis.authoredEnabled=false` is an explicit Frontier-graybox-only admission mode: it starts no terrain planner, publishes no authored catalog and cannot silently turn a failed authored campaign into a ready world."
  - id: "terrain-led-settlement-grammar"
    statement: "Every authored settlement is an immutable terrain-led site plan selected from a bounded archetype catalog. Buildings have stable identity, categories, functions, local foundations, semantic slots, ports and state profiles; each curated NBT module declares its real local threshold and canonical outward facade, and module rotation, door, apron and obstacle-aware circulation derive from that one contract rather than a bounding-box midpoint. Open spaces, circulation, segmented defences, irregular managed-area unions and five parcels plus two annex easements are typed and validated, and no radial wall or global settlement terrace is synthesized as a hidden fallback."
  - id: "perimeter-terrain-safety"
    statement: "The low physical enclosure requires a bounded dry stable cross-section on both sides of every sampled wall run, so a narrow ravine missed by the coarse settlement grid rejects the center instead of becoming a hidden retaining terrace."
  - id: "settlement-genesis-vegetation"
    statement: "Before player admission, every fresh-world authored settlement and mine installs an immutable chunk-indexed SiteEnvironmentPlan against the exact Overworld generator. Foreign surface decoration is rejected during configured-feature placement inside the hard site circle; whole tree features also observe a crown apron and thin deterministically through the 128-176 settlement transition band. Foreign surface structures whose complete bounding boxes intersect the settlement hard circle plus sixteen blocks are rejected as units, while snow/freeze, water, caves, ores, geodes and genuinely deep structures remain natural. A C2ME-safe thread-local feature scope and WorldGenRegion write firewall prevent late leaves, hives, plants and surface formations without post-load mutation. PM gardens are authored exemptions, the rail corridor retains only its narrow safety cleanup, and loaded-chunk events are read-only stamp observers."
  - id: "authored-site-surface"
    statement: "Each authored site compiles one exclusive absolute SiteSurfaceColumn owner and first-air datum for every active foundation, road, sidewalk, plaza, open-space, gate, perimeter and fixture column before chunk slicing; a soft future reservation has no physical marker or surface claim until a project starts. Only a curated module's true footprint is hard-graded as foundation, while its catalog apron is a one-column-per-level terrain transition and may never become a generic exposed platform. Terrain, buildings and decoration consume that persisted plan without runtime heightmap queries; semantic priority resolves intersections once, module compilers cannot invent relative surface slots, each same-datum perimeter run installs its own footing, and one structural perimeter stream owns a five-wide freight opening, three real pedestrian gates and a low terrain-following frontier boundary."
  - id: "bounded-batch-genesis-planning"
    statement: "One dedicated genesis coordinator and its bounded 1-16-worker pool consume one immutable RegionPlacementProfile that owns search bands and budgets, settlement terrain and vegetation suitability, typed site requirements, spatial relations and route policy; layout grammars do not hide terrain constants. Expensive candidate attempts run in index-addressed waves, shared terrain caches are concurrent, nested work executes inline, and only the sequential reducer may assign ordinals, accept a region, apply spacing or mutate the manifest list. Coarse-height lookup resolves equal-distance samples by their signed coordinate key, never by map iteration or worker completion order. Region cardinality is a validated minimum/target/maximum range: genesis fails below the minimum, may finish below target, and never exceeds maximum. The output cap and bounded survey-candidate cap are independent; the iron profile may inspect at most 160 ranked centers while materializing no more than six regions. Optional feasibility reserves never trigger the large-world search policy and use only envelope-scale separation; configured region spacing is enforced between accepted manifests, so a discarded survey center cannot exclude nearby geography. Site selection first rejects wet or excessively wooded biome footprints without a height query, then ranks deterministic foothill refinements with a 25-column grid sampled at forty-eight-block spacing. Township planning performs the authoritative 130-column sixteen-block footprint snapshot and rejects total relief over sixteen, local grade over four, second-difference roughness over three, depressions over three or less than eighty-two percent buildable surface before trying at most twenty-four deterministic layouts; all twenty building pads receive exact nine-column water/cut/fill validation and reject more than four blocks of cut or fill. Every MineSite candidate must have a biome-confirmed dry mountain face, nearby mountain-biome evidence, a continuous median OCEAN_FLOOR_WG cross-section rising at least ten blocks over forty-eight blocks and individually verified dry surface-building pads with relief at most eight blocks, cut at most four and fill at most four. Each mine resolution allows at most twenty-four exact candidates and fails closed without flat-land or wet fallback. Primary and alternate mountain masses are constrained to 160-320 and 320-560 blocks from the settlement. A bounded deterministic railway-corridor search strongly prefers dry land, permits only water spans up to twenty-four blocks with explicit bridge clearance and rejects grades steeper than one-in-four. The final rail path is verified column-by-column; only the naturally generating current chunk uses its ready heightmaps and fluid state for local cut, fill and bridge representation."
  - id: "authored-mine-blueprints"
    statement: "Every authored MineSite is a typed immutable blueprint manifest with portal, loading endpoint, controller anchor, bounds, orientation, semantic surface buildings, underground modules, independently surveyed local foundation pads, staged modules and semantic volumes. Mine17 materializes a complete industrial campus while Red Valley remains a compact staged outpost; PM-authored surface landmarks are reproducibly generated and SHA-pinned, while remaining curated private-pack structures are pinned by origin and SHA-256. Imported entity lists are ignored because resident and threat carriers are PM-managed. Curated block entities, finite container contents, local Create machinery and architectural resource cells retain their one-shot NBT; coordinates are rewritten, external links are removed, and creative power, explosives, spawners, structure machinery, unscoped controllers, invalid states and missing dependencies fail closed or use an explicit per-block curator substitution. Static modules materialize exactly once after their full block state pass, are never periodically rebuilt or refilled, guarded staged block entities persist an operation idempotency marker against crash replay, and settlement circulation and decoration may not overwrite their true footprints. The canonical adit portal is the sole public mine entrance: its road owns a continuous five-wide grounded throat at the portal datum, its industrial frame remains outside that clearance and final entrance compilation runs after curated NBT, underground rooms and decoration. The imported hoist building is an offset landmark with its own semantic door and may never occupy or substitute for the adit. Every MineSite surface cell belongs to a curated module, an explicit access/loading route or a supported fixture; loose yard paint, spoil rows and furniture positioned from a borrowed nearest-foundation datum are forbidden. Genesis MineSite interiors are sealed and dry; later flooding requires an explicit canonical visual transition."
  - id: "visual-projection-boundary"
    statement: "The required Pale Mirror Visuals provider receives only immutable server-authored genesis facts and read-only canonical projections; it may own physical structures, resident carriers, animation, sound and particles, but never progression, economy, scenario or threat decisions."
  - id: "frontier-two-way-authority"
    statement: "The pure-domain `ReferenceGrayboxSimulation` is the sole canonical owner of the active Python-source-shaped settlement economy, named residents and their custody, ecology, infection/hive topology, tissue signal, organs, bioforms, territorial control/beliefs, civic doctrine/reserves/ration/quarantine, companies/contracts/credit, site works, field posts/links, operations, campaigns and engagements. Its pure-domain `ReferenceGrayboxActorExecutionState` separately owns the continuous physical hand-off for every exact resident/bioform: fixed-point actual position, source-specific semantic revision, one durable executor lease, monotonic combat action epoch/cooldown and COLD/PREPARING/HOT/DRAINING/RECOVERING/RETIRED lifecycle. `SourceGrayboxSavedData` atomically persists the complete source document, execution ledger, bounded physical-effect ledger, bounded warehouse/field-post container and operation-carrier hand-offs, bounded unmodelled physical-scar and pending external-explosion ledgers, and selected clock profile; Minecraft blocks, entities, labels and the presentation ledger are never a second simulation state. An operation carrier is one deterministic chest-minecart UUID with exact source cargo ID, resource, item count and sixteenth-block position: it exists only in naturally player-HOT loaded chunks, moves by real collision, and is COLD source custody elsewhere. Its loss submits the exact item delta before it remains visibly blocked; a mixed cart is released to the player after PM removes only its own resource. The explicit v23/v24-to-v25 actor-revision migration accepts only the legacy format-3 global-projection envelope and may rebind it to source-specific actor revisions only after exact full actor-ID/kind proof against retained canonical source; it never recreates, drops or substitutes a body. Schema v29 writes the current format-4 execution envelope, explicit clock profile, bounded operation-carrier ledger and bounded pending external-explosion ledger; retained v23-v25 documents become `FAST_GRAYBOX` because that is their historical hard-coded pace, v26 retains its stored profile, v23-v27 begin with no invented carrier, and v28 begins with no invented pending blast. A v26 operation barrel converts only after its exact active, naturally loaded, count-matching custody is released; otherwise the old barrel remains the sole custody point. Missing/current-invalid clock, carrier, pending-explosion or revision/envelope data remains fail-closed. `SourceGrayboxRuntime` alone advances the source clock once activated, so the historical `FrontierWorldState` scaffold has no active tick path. Materialized residents and bioforms carry immutable source ID, a complete-frame snapshot revision for typed death observations, and a separate source-specific semantic revision for exclusive executor adoption. Their physical deaths, declared interactive source slots and exact matching item deltas in snapshot-owned warehouse, field-post barrel or operation carrier become deduplicated, revision-validated `ReferenceGraybox*Observation` events; an external real explosion first persistently captures its exact currently PM-owned target blocks, then after Minecraft's own block resolution emits the same observations as one batch before source-day advancement. A stale, foreign, replayed or player-owned change remains a visible conflict and never becomes permission to mutate canonical state. A source cell's infection value may only appear physically as its bounded provenance-owned tissue clumps; a blocked clump records that PM never installed it and may never erase the foreign obstruction on a later source publication."
  - id: "frontier-actor-execution-recovery"
    statement: "A source-graybox actor may have at most one physical executor. The read-only player HOT zone is the union of non-spectator player chunks plus one chunk, with a one-chunk already-loaded preparation apron; it never tickets or force-loads a chunk. Entering HOT requires a persisted deterministic lease after that preparation; a source-owned deterministic settlement street/cell apron is first choice, and the physical executor may choose only a bounded deterministic collision-free neighbour without clearing a block, then captures that exact sixteenth-block hand-off in the same admission turn. A scene that newly intersects an already HOT body gets the same-tick bounded recovery from its observed body position before entity ticking; no free body cell discards that executor, retains a visible non-owning obstruction and settles the exact hand-off COLD for a later deterministically staggered collision recheck, never a duplicate or a suffocating body. The check is no more frequent than 200 ticks per actor and naturally retries after removal of the real foreign obstacle without polling or ticketing unloaded chunks. DRAINING captures its actual sixteenth-block position before any removal, only after 200-tick demand hysteresis and a 64-block no-player safety check. On restart every unfinished actor becomes RECOVERING and an entity is re-adopted only by the matching pre-restart lease; a missing or stale body settles COLD and is never blindly duplicated. Actor execution runs at a bounded ten-tick cadence, has a 4,096-record bound, keeps a monotonic local lease clock across operator time rewind, and source reconciliation may retire an absent actor only through executor acknowledgement."
  - id: "frontier-actor-admission-migration"
    statement: "Schema v29 may migrate a retained schema-v27 actor execution ledger whose source-visible actor revisions changed only because deterministic physical admission slots moved from geometry to street/perimeter cells; its v28 predecessor additionally initializes only an empty pending external-explosion ledger. The actor migration proves the complete exact actor-ID/kind set, then refreshes source revision and anchor; COLD records take that source anchor, while PREPARING/HOT/DRAINING/RECOVERING records retain their captured actual sixteenth-block hand-off and lease until ordinary recovery inspects it. A missing, retired, foreign-kind or current-v29 revision mismatch remains fail-closed; migration never creates, deletes, substitutes or teleports an executor."
  - id: "frontier-role-brain"
    statement: "A HOT source-graybox body uses a bounded, collision-checked NeoForge role brain rather than uncontrolled vanilla goals. Every ten ticks it refreshes only exact leased bodies from the immutable source snapshot and derives a local human role/deployment or hive phase intent; up to sixty-four bodies receive smooth movement steps each Minecraft tick toward that intent. A separate bounded local combat executor may examine up to sixty-four HOT bodies every five ticks: source combat roles line/scout/assault and resident guards strike nearby managed bioforms, while engineer/medic/logistics bodies remain local support and pursuing bioforms use the real local entity collision set, including players and foreign living bodies. Before any hit, the exact actor lease reserves a monotonic action epoch/cooldown and a durable effect receipt binds the inspected target; its fixed-point pre/post health receipt is terminal, or becomes UNKNOWN_AFTER_RESTART and is never replayed. Neither executor owns strategic target selection, inventory, source health or source mutation; neither can materialize a COLD body or run in an unloaded chunk. Persisted execution position remains the restart hand-off, and a managed physical death still crosses only the typed observation boundary."
  - id: "autonomous-physical-causality"
    statement: "Pale Mirror is an autonomous world, not a protected simulation exhibit. A PM-caused physical event uses its real Minecraft collision and effect geometry over every physically reachable block and entity: an operation identifies an actor's intent but never forms a protection boundary, and no PM-defined safe zone, ownership class or target filter suppresses a legitimate consequence. A running four-block bomber intent materializes exactly one UUID-derived, intent-tagged ordinary PrimedTnt body; its normal fuse, flight, collision and detonation are the effect, while scoped observation adds identity but never substitutes a synthetic blast. Every non-replayable effect has a durable identity and exact post-impact observation (cause, affected entities, changed blocks, terrain/infection residue and structural consequences); reconciliation maps known semantic subjects to their source-state damage and retains an explicit bounded physical-scar or obstruction fact for other affected world space. On restart the persisted exact body or post-impact ledger is inspected only in a naturally loaded chunk; missing or altered evidence becomes visible UNKNOWN and is never replayed. No physical consequence may be silently dropped, repaired from baseline, or replayed after restart."
  - id: "frontier-time-scales"
    statement: "The living-world clock is layered. In the persistent GAMEPLAY profile, one complete source day is 24,000 Minecraft game ticks (twenty real minutes at 20 TPS); the source daily order is never fractionated or accelerated merely for presentation. Loaded physical actors move at Minecraft tick rate, role brains reconsider local goals every ten ticks, bounded local melee considers actions every five ticks, tactical operations reconcile every twenty ticks and bounded local work/infection progression runs every one hundred ticks. Accepted physical observations reconcile immediately and never wait for a source-day boundary. The disposable FAST_GRAYBOX profile retains 1,200 ticks per source day plus explicit complete-day fast-forward for calibration and manual testing. A fresh schema-v29 world persists GAMEPLAY; v23-v25 migration preserves FAST_GRAYBOX because that was the retained runtime pace, while v26 retains its explicit persisted profile. Clock profile and last canonical source-day boundary are durable world state; an operator-only live rate change rebases the boundary at its game tick, and missing or unknown current profiles fail closed instead of silently rescaling a campaign."
  - id: "frontier-graybox-scale"
    statement: "The active source-parity `graybox_1_40` profile owns the active Python reference's 64×44 logical grid, mapped 16 blocks per cell into a centred 1024×704 arena inside a 1024×1024 flat Y=64 world with neutral top/bottom borders, twelve settlements and two infection seeds. It is a discrete scale profile: each canonical resident is exactly one person and one managed Villager when materialized, and each canonical bioform is exactly one managed Zombie; no cohort entity or hidden population multiplier is allowed. Human population, stock, credit and capacity are explicitly rescaled 1:40; territorial ecology and organ biomass retain source spatial scale, while individual-bioform combat effects are calibrated against the smaller human world. Rates, phase ordering and topology remain source-derived. `genesis.authoredEnabled=false` prevents legacy terrain-authored genesis from writing to or gating the graybox; explicit activation makes `SourceGrayboxRuntime` the sole campaign-clock authority. Every materialized object carries identity/revision and each managed Villager/Zombie death or declared interaction-slot break becomes a validated, deduplicated typed perturbation; arbitrary player-owned changes remain visible conflicts. Each nonzero infection cell has at most four independently claimed 3×3 tissue clumps: brown trace/red active/purple dense growth encodes level, and a live pink signal may accent only one existing clump, never repaint the whole cell; growth and retreat remain visible without a per-block unbounded ledger. A conflicted clump is a permanent visible physical scar until its source identity retires. Loaded labels and colour-coded graybox geometry expose canonical processes, while performance limits may defer unloaded presentation but may not aggregate or delete canonical people."
  - id: "automodel-evidence-boundary"
    statement: "Automodel is an offline research boundary: source-pinned references and traces decide likeness, all model output remains provenance-pinned noncanonical evidence under ignored build artifacts, and no Automodel operation may write canonical Blender sources, PMMesh exports, runtime resources, server state or world state. External still staging remains MODEL_DERIVED; only an explicit complete-ring human receipt may promote secondary volume aids, while qualified DA3/VGGT disagreement is inspection-only and never mesh fusion."
  - id: "foundry-diagnostic-boundary"
    statement: "Pale Mirror Foundry is a read-only internal materialization framework over immutable genesis manifests and already-loaded physical chunks. The COMPILED gate runs before catalog publication; runtime MATERIALIZED, SETTLED and RELOADED audits never force-load or repair chunks, never mutate canonical state, and emit only bounded findings, one-shot operator markers, defect camera poses and disposable JSON/HTML/PNG artifacts. Unloaded columns remain explicitly unverified, raw authored NBT is held only in a bounded immutable template cache, and every severe rule requires negative or recovery coverage. For v3 traversal, a loaded expected air cell with no provenance claim is explicit PENDING projection work; CURRENT requires exact unconflicted plan, ledger and block agreement, while an unclaimed matching block, conflict or drift remains ERROR. A facility-scoped SETTLED/RELOADED audit is still read-only and passes only after its naturally loaded declared scope has zero pending and zero unverified cells."
  - id: "managed-resident-identity"
    statement: "Every PM-authored resident has a stable UUID, namespaced role and exact home-building/home-slot plus workplace-or-patrol-building/slot binding; ambient absence never implies death, only a confirmed death of that UUID may reduce PM-owned population, recruitment is denied in the exact-version behaviour bridge, and physical births require an explicit canonical growth permit."
  - id: "observation-boundary"
    statement: "Observers publish typed facts; reconciliation alone converts them into domain commands and events."
  - id: "conflict-safety"
    statement: "Unknown or player-owned block changes conflict at semantic-slot granularity and must not be overwritten by default; a player may explicitly commission a community asset or authorize a previewed reset for one object, module and slot."
  - id: "authored-parcel-ownership"
    statement: "Settlement influence never grants block ownership. Only PublicInfrastructure and CommunityParcel areas are PM-managed; PlayerLeaseParcel remains player-owned, and a soft ReservedPlot occupied before a project is reclassified or blocks development without overwrite."
  - id: "world-journey"
    statement: "Population and actor travel is a persisted canonical WorldJourney over a shared WorldPath. Off-screen movement and risk advance deterministically without force-loading, while nearby stable identities materialize under exclusive leases and return typed progress, casualty and obstruction observations through reconciliation. The physical provider retains the latest bounded projection and continues reconciliation while players or chunks become available; canonical revision suppression may reduce delivery traffic but may not stop staged resident spawning or movement."
  - id: "authored-damage-and-development"
    statement: "Off-screen damage, reconstruction and positive development compile deterministic staged projects against managed semantic slots. Authored damage is a bounded module-specific overlay and pristine reconstruction restores its captured baseline; positive development compiles a real climate-family module onto a verified free reserved plot. Red Valley begins as a working adit with an offline dispatch site; only a server-validated player choice may reserve 12 canonical IRON and start its foundation, shell, isolated Create-machinery and commissioning stages. Overlapping stages retain their original baseline and advance only exact PM-authored postconditions into later slots, so unrelated player edits still fail closed. Capability is granted only after physical postconditions, and its Create route still requires an independent real-train proof; community labour/resources and player receipts fund work without treating ordinary containers as canonical stock."
  - id: "product-profile-preflight"
    statement: "A product-profile server validates Pale Mirror Visuals, Create 6.0.10, pinned resident/render dependencies and the versioned asset catalog before opening a world and fails closed on mismatch. Core-only synthetic representations exist only in an explicitly selected dev/test profile."
  - id: "adapter-fallback"
    statement: "Missing optional integrations degrade to explicit adapter health states and must not block the core slice."
  - id: "source-identity"
    statement: "Each facility has one immutable canonical InfectionSourceId; adapters and physical overlays must match it, and mixed-source composition requires an explicit future policy."
  - id: "source-adapter-isolation"
    statement: "Source-specific identity, native mappings and source policy live only in isolated adapters; generic layers use source-neutral contracts."
  - id: "controlled-effects"
    statement: "Every PM-authorized non-replayable physical effect has a persisted idempotency lease before execution; a RUNNING lease after restart is visible and never replayed implicitly."
  - id: "pm-threat-combat"
    statement: "A registered Crimson or Spore form is a visual carrier only; PM persists its identity, target, health, cooldowns, movement, effects and projectile state, intercepts every incoming vanilla-compatible damage source, and never permits uncontrolled native AI, hurt/death, loot, terrain or infection logic. A PM-authorized physical effect remains allowed only through the durable, observed autonomous-physical-causality path."
  - id: "excluded-source-items"
    statement: "While Crimson and Spore item progression is out of scope, their source stacks cannot craft, pickup, interact, tick, or apply melee behavior; legacy stacks are quarantined without becoming PM state."
  - id: "logistics-observation"
    statement: "A physical logistics route becomes canonical capacity only through typed, bounded adapter observations. The read-only Create bridge samples whichever registered endpoint is naturally loaded, persists the opaque vehicle fact through reconciliation, and certifies capacity only after the same vehicle is observed at the other endpoint inside the proof window; it never drives transport or force-loads route chunks."
  - id: "managed-railway-commissioning"
    statement: "Railway Untold/Create is an explicit later industrial route provider, never an implicit default for a small campaign settlement. Its production materialization is independent and out of order by naturally loaded chunk footprints only; neither PM nor its provider may generate unseen route chunks. A permission-level-4 closed-alpha exercise may explicitly persist AUTONOMOUS_DEV authority for one Red Valley line, letting the provider ticket only its next bounded segment footprint; this record never mutates canonical capacity, which still requires the ordinary read-only Create proof. Initial authored-corridor construction records provenance while accepting provider transforms, later repairs fail closed on unknown changes, player schedule edits suspend canonical service, and PM remains the owner of route capacity and resource flow."
  - id: "vanilla-minecart-baseline"
    statement: "A fresh authored campaign region may use the built-in low-capacity VANILLA_MINECART provider. Its immutable genesis manifest is persistent initial topology evidence, so healthy canonical flow begins at registration and never depends on a player loading every corridor chunk; unlike Create traversal proof, this evidence does not age and is replaced only by explicit loaded-world observations. Its complete path, track, trestles and receiving platform are pinned and written by chunk-local worldgen; runtime only adopts stamped generated segments into exact provenance and never rebuilds missing genesis geometry. Adoption verifies the canonical rail cell, a dry non-falling support and graph continuity rather than replaying decorative live-heightmap writes; a loaded missing genesis rail or invalid support immediately suspends capacity. Block and chunk-load events update bounded local or connected-graph slices, chunk unload preserves the last accepted revision, a disconnected graph suspends canonical capacity, and any connected player reroute may be adopted without matching authored cells. Exact provenance guards later PM writes but never authorizes overwriting an adopted player path. The persisted lease-authorized cart/cargo pair is a singleton non-physical projection: loaded duplicates are reconciled deterministically, collision impulses are discarded, it follows the accepted path only during operational supply, parks at origin otherwise, and never simulates deliveries in unloaded chunks."
  - id: "runtime-work-budget"
    statement: "All non-critical Pale Mirror server-thread reconciliation is admitted through one configurable soft time and weighted-operation budget with staggered cadence, per-work metrics and deterministic deferral. Combat attribution, canonical safety checks and already-started idempotent physical operations remain critical; deferred jobs retain their persisted cursors and are never silently discarded."
  - id: "distant-horizons-budget"
    statement: "Distant Horizons is client-side by default, where ordinary received chunks populate each client's local presentation cache without server work. The exact-version optional server bridge is an explicit benchmark opt-in; when present it disables the background importer, retains PRE_EXISTING_ONLY as a dormant fail-safe and may build/synchronize LODs only from normal chunk events. It never changes canonical state, generates terrain, force-loads PM sites or blocks core runtime when absent or incompatible. Its once-per-second speed observer lowers only the public-API runtime ratio during fast travel and restores it after bounded hysteresis; transition failures remain operator-visible."
  - id: "enderman-grief-protection"
    statement: "Endermen cannot pick up or place blocks in a Pale Mirror runtime. This server-wide physical-safety policy protects route supports and other infrastructure without changing the global mobGriefing rule or the behavior of other mobs."
  - id: "ambient-spawn-budget"
    statement: "Ambient spawn throttling is an ephemeral NeoForge physical policy applied only to natural, chunk-generation and patrol attempts. It reuses Minecraft SpawnState counts instead of scanning loaded entities, and may suppress non-canonical hostile and passive background populations, but never PM materialization, residents, breeding, structures, spawners, events, commands or canonical state."
  - id: "settlement-territory-ecology"
    statement: "Persisted Settlement Influence parcels follow the irregular managed-area union and define horizontal ecology-protection columns without granting block ownership. Tree-like feature growth and natural, chunk-generation or patrol MONSTER spawns are denied inside those columns, while explicit PM encounters, spawners, events and commands remain outside this physical policy."
  - id: "settlement-observation"
    statement: "Vanilla-compatible places are recognized only after a complete 400-tick loaded evidence window. Large and vertical villages resolve a stable loaded bell/home through the Minecraft POI index and require a bounded resident cluster; the player's exact position is never the identity. Reliability, freshness, representative membership and causal losses remain typed and separate, and missing entities never imply death or ruin. Campaign logistics uses a separate ground-projected infrastructure anchor so a tower bell cannot create aerial depots or rails."
  - id: "settlement-actor"
    statement: "A settlement community, its physical place, economy, security and policy are separate canonical records; deterministic settlement policy creates crisis facts and continues acting when Narrator returns NO_SCENARIO."
  - id: "route-contract"
    statement: "Strategic flow uses persisted RouteContract validation; both endpoints must be operational before positive capacity can be accepted or transferred. WorldSites may keep multiple typed affiliations and ambiguous beneficiaries fail closed; Create observations prove capability without delivering stock directly, and capacity ages from CURRENT to STALE to EXPIRED without force-loading chunks."
  - id: "presentation-read-only"
    statement: "FTB Quests and the in-world journal present PM facts but never own, mutate or feed back scenario progression."
  - id: "client-atlas-projection"
    statement: "The native Atlas and optional JourneyMap waypoints consume only a bounded server-authored read-only projection; client UI may submit intent but never owns canonical state, coordinates, scenario authority or map persistence. Every authored manifest pins a horizontal semantic discovery-chunk set covering the irregular managed address, gates, depot and short railway approach without granting block ownership; Mine17 is discovered independently by any chunk intersecting its immutable authored site bounds rather than by distance from one technical anchor. Every non-spectator StoryAudience discovers and persists its own knowledge independently, receives only known region cards, and gets an immediate refreshed snapshot for each newly learned feature; spectator/operator audit never creates knowledge or online-presence facts."
  - id: "transactional-resource-boundary"
    statement: "Physical items cross the settlement economy boundary only through a persisted bounded transfer ledger; ordinary container contents never mirror canonical stock, and reserved stacks fail closed until reconciliation completes."
  - id: "pm-owned-settlement-sites"
    statement: "Pale Mirror materializes settlement infrastructure only inside a persisted deterministic PM-owned footprint with per-cell provenance and postconditions; observed village blocks remain read-only."
  - id: "population-separation"
    statement: "SettlementCommunity owns social identity while PopulationGroup owns cohort counts and disposition; evacuation changes occupancy and location without deleting community identity or inferring deaths from missing entities."
  - id: "settlement-catastrophe-fairness"
    statement: "A known critical settlement receives one persisted global reachability-adjusted grace window before automatic evacuation. Abstract policy continues without Narrator, but irreversible grace advances while any informed non-spectator audience is online and pauses only while all informed audiences are offline; physical consequences touch only PM-owned cells."
  - id: "multi-audience-region-authority"
    statement: "LivingRegion, economy, facilities, routes, population, incident timing and physical outcome are global world facts. Knowledge, access observations, scenario offers, acceptance and decline are private per StoryAudience; scoreboard teams are one audience and unteamed players are personal audiences, and team changes never merge old knowledge. Physical help is open to every audience that knows the settlement, strategic commands require that audience's active RESPOND crisis plus world prerequisites, and the first canonical outcome resolves every linked nonterminal private scenario exactly once."
  - id: "settlement-positive-development"
    statement: "Stable surplus creates a persisted domain DevelopmentIntent with bounded project escrow. Player physical IRON crosses through idempotent receipts, or the settlement reserves the remainder after 24 qualifying steps; only a fully funded, provenance-safe verified PM-owned storehouse may advance capacity, housing, prosperity and growth."
  - id: "living-frontier-instancing"
    statement: "An iron_frontier instance derives all canonical object identities from its deterministic fresh-world authored genesis manifest, pins settlement, mines, sites, residents and route geometry before any physical work, and cannot share a community, route, resident or physical job with another instance; observed villages never bootstrap the default campaign."
  - id: "narrator-candidate-boundary"
    statement: "Narrator candidates are deterministic, transient per-audience interpretations of canonical events/history. The same global event may yield distinct private scenario identities and decisions for every informed audience. Replayed development and return opportunities are eligible only while the causally referenced DevelopmentIntent remains PLANNED, and a recovery investment additionally requires a same-community CRISIS_DETECTED -> STABILIZED history before its development plan. Ordinary fresh-world prosperity remains autonomous; stale offers are command-cancelled without cancelling their valid settlement intent. Acceptance revalidates canonical intent state before entering RESPOND. Candidates may select a scenario or persist NO_SCENARIO, but never create a crisis, change settlement policy, inspect Minecraft/adapters, or become a competing mutable queue."
  - id: "prepared-evacuation"
    statement: "A Refugee Anchor item is only a signed player proposal and a strategic action. Canonical shelter registration and player-started evacuation require that audience's active RESPOND supply-crisis scenario, then validate emergency, dimension, safe PM-owned footprint and capacity before physical camp work. Player-started evacuation names that exact prepared site and its canonical path; it may never fall back to lexicographic selection among reserved candidates. A prepared camp remains operational while its population is resident, departing, in transit or hosted; its durable lifecycle retires the site only after that population has actually departed and returned home. Camp reconciliation may repair a persisted arrived or completed misroute only through a validated domain command and an explicit terminal correction journey. Automatic settlement-policy evacuation remains possible without a player permit."
  - id: "settlement-field-authority"
    statement: "Every campaign settlement pins a source-neutral field authority profile; native-reconciled settlements may contribute population and integrity facts while PM remains unable to move, ruin, grow or construct the native society."
  - id: "operator-debug-safety"
    statement: "Operator debug reads projections or invokes normal validated state transitions; navigation teleports only by explicit command to a persisted physical anchor; maintenance reset is two-phase, bounded to wholly unmaterialized PM state, rechecks every precondition at commit time, and fails closed without touching Minecraft blocks, entities, chunks or foreign state."
  - id: "repository-context-advisory-boundary"
    statement: "Repository context is a development-only advisory projection that joins the canonical governance checkout and one explicit current implementation checkout with a pinned local structural code graph. It reports both identities and visible ready/stale/partial/busy/unavailable states; it never owns product meaning, source, tests, runtime state or acceptance. Graph queries are repository-confined, bounded and read-only, generated state remains private and outside Git, and a missing map entry fails visibly. No tool result may override AGENTS.md, CONTINUITY.md, architecture.yml, the active work order, source or observed player/runtime evidence."
  - id: "agent-assist-advisory-boundary"
    statement: "Agent-assist tooling is a development-only advisory layer. Its runtime index consumes already-produced bounded evidence and reports stale, partial and incomplete coverage explicitly; its changed-path selector emits but never executes the smallest verification plan and leaves native scenario selection explicit; Serena supplies on-demand symbol/reference operations without automatic project memory; ArchUnit enforces only declared stable bytecode boundaries; and async-profiler requires one explicit same-user task-owned JVM, bounded duration and named hypothesis after cheaper JFR evidence is insufficient. None of these tools owns canonical state, OBS-001 facts, test methodology, acceptance or repair."

