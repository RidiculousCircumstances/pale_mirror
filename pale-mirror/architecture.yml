      are not overwritten. Within an execution HOT and COLD advance the same retained farmer and
      layout-bound CellId work pool, with explicit selected/last target identities
      distinct from the completed count and one typed harvest/replant, till/plant
      or skip outcome per cell. A new cycle selects an eligible exact farmer
      independently; predecessor lineage retains historical worker/output custody,
      not staffing policy. Exact observed workstation headroom obstruction
      is independent of crop and soil state; an unavailable target is skipped
      locally without routing the farmer through it or creating yield.
      Only actual ripe harvest contributes yield. Zero or variable positive wheat quantity
      enters the fungible lot/account and physical-stack binding custody model under real
      storage capacity; no fixed 64-stack outcome or hidden stock is authoritative.
      Restart validates pending effects, committed physical prefixes and foreign incidents
      before resuming, without replay or guesswork. Field expansion/reduction retains cell
      identities and explicitly retires removed obligations. docs/frontier-v3-field-cell-lifecycle.md
      owns the detailed cutover and open blockers. The active source has a
      cell-owned physical witness and an admitted fresh revision-1 field of 65
