  - id: "frontier-v3-resource-site-preparation"
    lifecycle: "active-correction"
    path: "versioned field layout -> canonical preparation with exact bounded physical ownership -> one retained site plant clock in GROWING/READY/HARVESTING -> independent per-cell growth of existing planted crops under exact unresolved-effect fences -> mature-cell facility harvest opportunity -> fixed work batch with one exact farmer -> cell harvest and confirmed replant -> immediate participation in the existing plant cadence even while that batch or its depot delivery remains active. ResourceFieldCycle owns plant age and separate accounted/yielded batch flags; renewed maturity never repeats work or adds yield to that batch. Work retirement clears accounting and advances the work epoch without resetting plants or the plant-clock deadline. Bare, unknown and obstructed cells cannot spontaneously grow. COLD changes canonical plants; HOT projects current cell conditions, never completed work animations. Exact persisted sowing/projection receipts acknowledge their actual block postcondition even when the same accepted plant has grown further; growth cannot conceal crop/soil loss, substitute an observation or bypass pending ownership. Resource custody and delivery remain separate. Boards distinguish plant readiness from collected harvest with delivery pending. Physical initialization, player/world perturbations, pending effects and restart recovery retain their exact bounded field/cell witnesses without force-loading, healing foreign writes or replaying effects."
    owner: "pure ResourceFieldGrowthProcess/ResourceFieldCycle for biology and first-maturity work notification, including exact external CROP_GROWN receipts; ResourceSiteHarvestProcess for batch work (growth never clears accounted/yielded); resource custody owners for stock; NeoForge FrontierV3ResourceSiteLedger and cell executors for durable before-write fencing and successful-write observation, physical claim acknowledgement and bounded recovery"
      explicit crop/soil/workstation/irrigation geometry and non-overlap with other owned
      structures and public circulation. The current 8x8 producer is one layout, not the
      field contract. Canonical ResourceSiteState owns the per-cell crop, soil, growth,
      obstruction, work and yield facts independently of chunk demand. A scheduled durable
      preparation and each subsequent physical action cross an exact before/after ownership
