<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Far Frontier · Экономика</title
  ><link rel="stylesheet" href="/style.css" />
  <header>
    <div>
      <small>FAR FRONTIER / OBSERVATORY</small>
      <h1>Экономика поселений</h1>
    </div>
    <span id="health">Подключение…</span>
  </header>
  <form id="filters">
    <label>Мир<select id="world"></select></label
    ><label
      >Поселение<select id="town">
        <option value="">Все поселения</option>
      </select></label
    ><label
      >Ресурс<select id="item">
        <option value="">Все ресурсы</option>
      </select></label
    ><label
      >От тика<input
        id="from"
        type="number"
        min="0"
        placeholder="Последние сутки" /></label
    ><label
      >До тика<input
        id="to"
        type="number"
        min="0"
        placeholder="Сейчас" /></label
    ><span id="trade-filters" hidden>
      <label
        >Продавец<select id="seller">
          <option value="">Все поселения</option>
        </select></label
      >
      <label
        >Покупатель<select id="buyer">
          <option value="">Все поселения</option>
        </select></label
      > </span
    ><button>Обновить</button
    ><label class="check"
      ><input id="auto" type="checkbox" checked />Каждые 5 с</label
    ><button type="button" id="reset-filters">Сбросить фильтры</button>
  </form>
  <p id="coverage"></p>
  <div id="summary" class="cards"></div>
  <nav id="tabs"></nav>
  <main id="content"></main>
  <footer>
    Read-only · День = 24 000 тиков. Деньги показаны в монетах. История
    начинается с подключения наблюдения; пропуски не считаются нулевым оборотом.
  </footer>
  <script src="/map.js"></script>
  <script src="/app.js"></script>
</html>
