# F0.V.1a: all Frontier v3 scene executors consume FrontierV3SceneDemand's
# read-only aggregate.  A local players().stream() recurrence would fork the
# observer radius/spectator policy and can incorrectly turn one shared front
# into independent per-player authorities.
scene_executor_raw_player_scans:
  max_total: 0
  allowed_files: {}

# Every scene family exposes its complete bounded stable candidate inventory.
# The shared adapter selector chooses the first naturally demanded member.
# A family executor may never call nextCandidate before it observes demand:
# that would make an unloaded lexicographically early process suppress an
# observed later process elsewhere in the world.
scene_executor_global_first_candidates:
  max_total: 0
  allowed_files: {}

# All scene-lease command payloads must implement the marker consumed by the
# generic Process/Scene SDK admission guard.  This is a closed zero baseline:
# a future family cannot accidentally bypass composition and budget admission.
