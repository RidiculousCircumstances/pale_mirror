plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = 'com.vibecraft'
version = '0.1.0-pm.1'
base { archivesName = 'vibecraft-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    jarJar('org.java-websocket:Java-WebSocket:1.5.7') {
        version { strictly '[1.5.7,1.6)'; prefer '1.5.7' }
    }
}
neoForge {
    version = '21.1.248'
    runs {
        client {
            client()
            gameDirectory = layout.buildDirectory.dir('runs/client')
        }
    }
    mods {
        vibecraft_client { sourceSet sourceSets.main }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    from('../LICENSE') { rename { 'LICENSE-VibeCraft' } }
}
