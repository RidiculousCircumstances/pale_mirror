def syncFrontierV3PilotPackClient = tasks.register('syncFrontierV3PilotPackClient', Sync) {
    dependsOn tasks.named('classes')
    def installedClient = layout.buildDirectory.dir('runs/railway-client')
    from(installedClient) {
        // NeoForge ModDev contributes the current Pale Mirror source set to the
        // run. Leaving this pack artifact beside it silently wins class lookup.
        exclude 'mods/pale_mirror-hosted.jar'
        // The visible pack-backed pilot must match the live source-graybox
        // server's gameplay exclusions. This shared catalog is the sole owner;
        // do not let an enabled client-side infection/mob mod create a second
        // visual/runtime authority or reject the ordinary server connection.
        frontierV3GrayboxDisabledMods.each { exclude "mods/${it}" }
    }
    into(frontierV3PilotPackClientDirectory)
    doFirst {
        if (!new File(installedClient.get().asFile, 'mods').isDirectory()) {
            throw new GradleException('Frontier v3 pilot requires the installed railway-client pack; run scripts/install-client.sh first')
        }
    }
    doLast {
        if (new File(frontierV3PilotPackClientDirectory.get().asFile, 'mods/pale_mirror-hosted.jar').isFile()) {
            throw new GradleException('Frontier v3 pilot profile must not contain the hosted Pale Mirror jar')
        }
        def leakedDisabledMod = frontierV3GrayboxDisabledMods.find {
            new File(frontierV3PilotPackClientDirectory.get().asFile, "mods/${it}").isFile()
        }
        if (leakedDisabledMod != null) {
            throw new GradleException("Frontier v3 pack-pilot retained graybox-disabled mod ${leakedDisabledMod}")
        }
    }
}
tasks.named('prepareFrontierV3PilotPackClientRun') { dependsOn syncFrontierV3PilotPackClient }

// The old pilot profile copied a full modpack into this exact generated directory.
// Always clear it before a lite launch so stale optional jars can never silently
// defeat the profile boundary or pollute its logs.
def resetFrontierV3PilotLiteClient = tasks.register('resetFrontierV3PilotLiteClient', Delete) {
    delete frontierV3PilotClientDirectory
}
tasks.named('prepareFrontierV3PilotClientRun') {
    dependsOn resetFrontierV3PilotLiteClient
    // `resetFrontierV3PilotLiteClient` deliberately removes this exact disposable
    // directory before every native run.  The generated RunGame preparation task
    // does not declare the two client-local bootstrap files as outputs, so Gradle
    // could otherwise call reset and then skip this doLast as UP-TO-DATE.  Keep the
    // bootstrap attached to the reset transaction: it is tiny, deterministic and
    // must run once for every fresh pilot directory.
    outputs.upToDateWhen { false }
    doLast {
        // A brand-new Minecraft game directory normally opens the first-run
        // accessibility screen.  The native test pilot has no business logic
        // until Quick Play connects, so acknowledge that client-local prompt
        // deterministically here rather than relying on a manual X11 click.
        // This is deliberately scoped to the disposable lite profile.
        def options = new File(frontierV3PilotClientDirectory.get().asFile, 'options.txt')
        options.parentFile.mkdirs()
        options.text = 'onboardAccessibility:b:true\n' +
                // Quick Play is an ordinary client connection, but vanilla puts a newly
                // created profile behind its third-party-multiplayer acknowledgement.
                // The disposable test pilot has no interactive setup phase before it can
                // exercise its declared ordinary player actions, so acknowledge that
                // client-local informational screen alongside accessibility.  This changes
                // neither the server, canonical state, nor any normal-player profile.
                'skipMultiplayerWarning:b:true\n' +
                'narrator:0\n'
        // NeoForge's early loading screen is not game-facing evidence and is
        // known to fail intermittently in the disposable XWayland profile
        // before Minecraft creates its real client window.  Disable only that
        // pre-game screen for the pilot; the actual fullscreen Minecraft
        // window, renderer and ordinary connection remain unchanged.
        def fmlConfig = new File(frontierV3PilotClientDirectory.get().asFile, 'config/fml.toml')
        fmlConfig.parentFile.mkdirs()
        fmlConfig.text = 'earlyWindowControl = false\n' +
                'disableConfigWatcher = false\n' +
                'maxThreads = -1\n' +
                'versionCheck = true\n' +
                'defaultConfigPath = "defaultconfigs"\n' +
                'disableOptimizedDFU = true\n' +
                'earlyWindowProvider = "fmlearlywindow"\n' +
                'earlyWindowWidth = 854\n' +
                'earlyWindowHeight = 480\n' +
                'earlyWindowFBScale = 1\n' +
                'earlyWindowMaximized = false\n' +
                'earlyWindowSkipGLVersions = []\n' +
                'earlyWindowSquir = false\n'
    }
}

def resetFrontierV3PilotServerWorld = tasks.register('resetFrontierV3PilotServerWorld') {
    doLast {
        def worldDirectory = new File(frontierV3PilotServerRunDirectory, frontierV3PilotWorldName)
        if (frontierV3PilotReset == 'true' && worldDirectory.exists() && !worldDirectory.deleteDir()) {
            throw new GradleException("Could not reset disposable Frontier v3 pilot world ${worldDirectory}")
        }
    }
}
// The pilot uses only current source plus NeoForge. A stale full-pack JAR in this generated
// directory would create noisy, misleading diagnostics and invalidate that profile boundary.
// Preserve worlds and evidence; only the disposable runtime's external-mod directory is reset.
def resetFrontierV3PilotLiteServerMods = tasks.register('resetFrontierV3PilotLiteServerMods', Delete) {
    delete new File(frontierV3PilotServerRunDirectory, 'mods')
}
def installFrontierV3PilotGrayboxDatapack = tasks.register('installFrontierV3PilotGrayboxDatapack', Sync) {
    dependsOn resetFrontierV3PilotServerWorld
    from(frontierV3PilotGrayboxDatapackDirectory)
    into(new File(frontierV3PilotServerRunDirectory, "${frontierV3PilotWorldName}/datapacks/pale-mirror-graybox"))
    doFirst {
        if (!new File(frontierV3PilotGrayboxDatapackDirectory, 'data/pale_mirror/dimension/frontier_graybox.json').isFile()) {
            throw new GradleException("Frontier v3 lite profile requires the canonical workspace datapack at ${frontierV3PilotGrayboxDatapackDirectory}")
        }
    }
}

// The native F0.V runner prepares the disposable world first and then starts the exact prepared
// Java launch directly.  Separating world setup from the RunGame task prevents either restart
// segment from recompiling or resolving a different classpath after its identity was hashed.
def prepareFrontierV3PilotServerWorld = tasks.register('prepareFrontierV3PilotServerWorld') {
    dependsOn installFrontierV3PilotGrayboxDatapack, resetFrontierV3PilotLiteServerMods,
            project(':pale-mirror-frontier').tasks.named('jar')
    doLast {
        def directory = frontierV3PilotServerRunDirectory
        def world = frontierV3PilotWorldName
        def seed = frontierV3PilotSeed
        def port = frontierV3PilotPort
        def rconPort = frontierV3PilotRconPort
        def rconPassword = frontierV3PilotRconPassword
        def username = frontierV3PilotOperator
        if (!(world ==~ /[a-z0-9][a-z0-9_-]{0,63}/) || !(username ==~ /[A-Za-z0-9_]{3,16}/) || !(port ==~ /[0-9]{2,5}/)
                || !(rconPort ==~ /[0-9]{2,5}/) || port == rconPort || !(rconPassword ==~ /[0-9a-f-]{36}/)
                || !(frontierV3PilotViewDistance ==~ /[2-9]|[12][0-9]|3[0-2]/)
                || !(frontierV3PilotProfile in frontierV3PilotProfiles)
                || !(frontierV3PilotRunId ==~ /|[0-9a-f-]{36}/)) {
            throw new GradleException('Frontier v3 pilot world, username, port, RCON endpoint, view distance, profile or run id is invalid')
        }
        def crashValues = [frontierV3PilotCrashBoundary, frontierV3PilotCrashOwner, frontierV3PilotCrashRevision, frontierV3PilotCrashPayload]
        if (crashValues.any { !it.isEmpty() }) {
            if (!(frontierV3PilotRunId ==~ /[0-9a-f-]{36}/) || !(frontierV3PilotCrashBoundary in [
                    'lease_recorded_before_physical_materialization',
                    'physical_effect_visible_before_typed_observation',
                    'typed_observation_durable_before_next_process_checkpoint',
                    'hot_checkpoint_durable_before_drain_release',
                    'release_durable_before_cold_resumption'])
                    || !(frontierV3PilotCrashOwner ==~ /[A-Za-z0-9][A-Za-z0-9_.:-]{2,127}/)
                    || !(frontierV3PilotCrashRevision ==~ /(?:[0-9]+|observed_at_boundary)/)
                    || !(frontierV3PilotCrashPayload ==~ /[A-Za-z0-9][A-Za-z0-9_.:-]{2,127}/)) {
                throw new GradleException('Frontier v3 pilot crash rendezvous must name one exact run, boundary, owner, revision and payload')
            }
        }
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = "level-name=${world}\nlevel-seed=${seed}\nserver-ip=127.0.0.1\nserver-port=${port}\nenable-rcon=true\nrcon.port=${rconPort}\nrcon.password=${rconPassword}\nonline-mode=false\nallow-flight=true\ngamemode=creative\ndifficulty=normal\nspawn-protection=0\nview-distance=${frontierV3PilotViewDistance}\nsimulation-distance=${frontierV3PilotViewDistance}\n"
        def uuid = java.util.UUID.nameUUIDFromBytes(("OfflinePlayer:" + username).getBytes(java.nio.charset.StandardCharsets.UTF_8))
        new File(directory, 'ops.json').text = '[\n  {"uuid":"' + uuid + '","name":"' + username + '","level":4,"bypassesPlayerLimit":false}\n]\n'
    }
}

tasks.named('runFrontierV3PilotServer') {
    dependsOn prepareFrontierV3PilotServerWorld
}

/** Exact Java/tooling paths for the one-build direct F0.V native launcher. */
def frontierV3PilotPreparedJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
def frontierV3PilotRootDirectory = rootProject.projectDir
def frontierV3PilotModId = rootProject.providers.gradleProperty('mod_id').get()
def frontierV3PilotModdevDirectory = layout.buildDirectory.dir('moddev').get().asFile
def frontierV3PilotPreparedLaunchFile = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotPreparedLaunch.json')
def frontierV3PilotServerVmArgs = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotServerRunVmArgs.txt')
def frontierV3PilotServerProgramArgs = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotServerRunProgramArgs.txt')
def frontierV3PilotServerClasspath = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotServerLegacyClasspath.txt')
def frontierV3PilotClientVmArgs = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotClientRunVmArgs.txt')
def frontierV3PilotClientProgramArgs = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotClientRunProgramArgs.txt')
// The normal Gradle run type carries the pilot username/endpoint from Gradle properties.  A
// prepared F0.V client must retain the same launch target but receive those two ordinary client
// arguments exactly once at runtime, so its immutable argument file deliberately omits them.
// This is an invocation template, not a second launcher or a mutable classpath.
def frontierV3PilotPreparedClientProgramArgs = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotPreparedClientRunProgramArgs.txt')
def frontierV3PilotClientClasspath = new File(frontierV3PilotModdevDirectory, 'frontierV3PilotClientLegacyClasspath.txt')
def frontierV3PilotSourceFolders = [sourceSets.main.output.classesDirs.singleFile, sourceSets.main.output.resourcesDir,
        project(':pale-mirror-api').sourceSets.main.output.classesDirs.singleFile, project(':pale-mirror-api').sourceSets.main.output.resourcesDir,
        project(':pale-mirror-domain').sourceSets.main.output.classesDirs.singleFile, project(':pale-mirror-domain').sourceSets.main.output.resourcesDir,
        project(':pale-mirror-frontier').sourceSets.main.output.classesDirs.singleFile, project(':pale-mirror-frontier').sourceSets.main.output.resourcesDir,
        sourceSets.pilot.output.classesDirs.singleFile, sourceSets.pilot.output.resourcesDir]
def frontierV3PilotNeoForgeVersion = rootProject.providers.gradleProperty('neo_version').get()
def frontierV3PilotNeoForgeArtifact = new File(frontierV3PilotModdevDirectory, "artifacts/neoforge-${frontierV3PilotNeoForgeVersion}.jar")
def frontierV3PilotLauncher = configurations.frontierV3PilotLauncher
def frontierV3PilotModuleJars = [
        new File(project(':pale-mirror-api').buildDir, "libs/pale-mirror-api-${project(':pale-mirror-api').version}.jar"),
        new File(project(':pale-mirror-domain').buildDir, "libs/pale-mirror-domain-${project(':pale-mirror-domain').version}.jar"),
        new File(project(':pale-mirror-frontier').buildDir, "libs/pale-mirror-frontier-${project(':pale-mirror-frontier').version}.jar")]
def writeFrontierV3PilotPreparedLaunchManifest = tasks.register('writeFrontierV3PilotPreparedLaunchManifest') {
    dependsOn tasks.named('classes'), tasks.named('pilotClasses'),
            project(':pale-mirror-api').tasks.named('jar'), project(':pale-mirror-domain').tasks.named('jar'),
            project(':pale-mirror-frontier').tasks.named('jar'),
            tasks.named('writeFrontierV3PilotServerLegacyClasspath'), tasks.named('writeFrontierV3PilotClientLegacyClasspath'),
            tasks.named('prepareFrontierV3PilotClientRun'), tasks.named('prepareFrontierV3PilotServerRun')
    doLast {
        def launcher = frontierV3PilotPreparedJava.get().executablePath.asFile.absolutePath
        def relative = { file -> frontierV3PilotRootDirectory.toPath().relativize(file.toPath()).toString() }
        if (frontierV3PilotSourceFolders.any { it == null }) throw new GradleException('F0.V prepared launch has an unresolved pilot source folder')
        // A Java-only module legitimately has no resources output directory.  Omit only those
        // absent empty directories; every existing compiled/main and pilot output remains part
        // of the exact launch identity and is fingerprinted by the runner.
        def materializedSourceFolders = frontierV3PilotSourceFolders.findAll { it.exists() }
        if (materializedSourceFolders.size() < 7) throw new GradleException('F0.V prepared launch requires compiled main and pilot source folders')
        def modFolders = materializedSourceFolders.collect { "${frontierV3PilotModId}%%${it.absolutePath}" }.join(File.pathSeparator)
        def devLaunches = frontierV3PilotLauncher.files.findAll { it.name == 'DevLaunch-1.0.2.jar' }
        def requiredLaunchFiles = materializedSourceFolders + [frontierV3PilotNeoForgeArtifact] + frontierV3PilotModuleJars + devLaunches
        if (devLaunches.size() != 1 || requiredLaunchFiles.any { !it.exists() }) {
            throw new GradleException('F0.V prepared direct launch is missing one exact launcher artifact')
        }
        def launchClasspath = { legacy, role ->
            def entries = (requiredLaunchFiles.collect { it.absolutePath } + legacy.readLines().collect { it.trim() }.findAll { !it.isEmpty() }).unique()
            if (entries.isEmpty()) throw new GradleException("F0.V prepared ${role} launch classpath is empty")
            entries
        }
        if (!frontierV3PilotClientProgramArgs.exists()) {
            throw new GradleException('F0.V prepared direct launch is missing client program arguments')
        }
        def clientArguments = frontierV3PilotClientProgramArgs.readLines()
        def preparedClientArguments = []
        for (int index = 0; index < clientArguments.size(); index++) {
            def argument = clientArguments[index].trim()
            if (argument in ['--username', '--quickPlayMultiplayer']) {
                if (index + 1 >= clientArguments.size() || clientArguments[index + 1].trim().startsWith('--')) {
                    throw new GradleException("F0.V prepared client argument ${argument} is missing its exact value")
                }
                index++
                continue
            }
            preparedClientArguments.add(clientArguments[index])
        }
        if (clientArguments.count { it.trim() == '--username' } != 1
                || clientArguments.count { it.trim() == '--quickPlayMultiplayer' } != 1
                || preparedClientArguments.any { it.trim() in ['--username', '--quickPlayMultiplayer'] }) {
            throw new GradleException('F0.V prepared client launch requires exactly one removable username and endpoint pair')
        }
        frontierV3PilotPreparedClientProgramArgs.text = preparedClientArguments.join(System.lineSeparator()) + System.lineSeparator()
        def value = [schema: 1, java: launcher, modFolders: modFolders,
                server: [vmArgs: relative(frontierV3PilotServerVmArgs),
                         programArgs: relative(frontierV3PilotServerProgramArgs),
                         classpath: relative(frontierV3PilotServerClasspath),
                         launchClasspath: launchClasspath(frontierV3PilotServerClasspath, 'server'),
                         gameDirectory: relative(frontierV3PilotServerRunDirectory)],
                client: [vmArgs: relative(frontierV3PilotClientVmArgs),
                         programArgs: relative(frontierV3PilotPreparedClientProgramArgs),
                         classpath: relative(frontierV3PilotClientClasspath),
                         launchClasspath: launchClasspath(frontierV3PilotClientClasspath, 'client'),
                         gameDirectory: relative(frontierV3PilotClientDirectory.get().asFile)]]
        frontierV3PilotPreparedLaunchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + '\n'
    }
}

// F0.VA fingerprints launch inputs only after the disposable client directory has reached its
// deterministic baseline. Running the reset after fingerprinting would make a correct
// hash-drift guard reject its own runner setup.
tasks.register('prepareFrontierV3PilotNativeEnvironment') {
    group = 'verification'
    description = 'Prepares the disposable pilot server and client before writing their one-build native launch identity.'
    dependsOn tasks.named('prepareFrontierV3PilotClientRun'), tasks.named('prepareFrontierV3PilotServerRun'),
            writeFrontierV3PilotPreparedLaunchManifest, tasks.named('jar')
}

