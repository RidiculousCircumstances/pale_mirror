plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

base {
    archivesName = 'pale_mirror_visuals'
}

def runtimeModDirectory = file(System.getenv('PALE_MIRROR_RUNTIME_MOD_DIR')
        ?: new File(System.getProperty('user.home'), 'far-frontier-server/mods'))

def visualCompileArtifactSpecs = [
        [property: 'geckolib_integration_jar', filename: 'geckolib-neoforge-1.21.1-4.9.2.jar',
         url: rootProject.providers.gradleProperty('geckolib_integration_url').get(),
         sha512: rootProject.providers.gradleProperty('geckolib_integration_sha512').get(), label: 'GeckoLib'],
        [property: 'villager_overhaul_integration_jar', filename: 'villageroverhaul-neoforge-1.21.1-3.10.17.16.jar',
         url: rootProject.providers.gradleProperty('villager_overhaul_integration_url').get(),
         sha512: rootProject.providers.gradleProperty('villager_overhaul_integration_sha512').get(), label: 'Villager Overhaul'],
        [property: 'create_integration_jar', filename: 'create-1.21.1-6.0.10.jar',
         url: rootProject.providers.gradleProperty('create_integration_url').get(),
         sha512: rootProject.providers.gradleProperty('create_integration_sha512').get(), label: 'Create']
]
def visualCompileArtifacts = visualCompileArtifactSpecs.collect { spec ->
    String override = rootProject.findProperty(spec.property)?.toString()
    File cached = layout.buildDirectory.file("integration/${spec.filename}").get().asFile
    [
            property: spec.property,
            url: spec.url,
            sha512: spec.sha512,
            label: spec.label,
            override: override ?: '',
            cached: cached,
            candidate: override == null ? cached : file(override)
    ]
}
def visualCompileArtifactsByProperty = visualCompileArtifacts.collectEntries { artifact -> [(artifact.property): artifact] }
def resolveVisualCompileDependencies = tasks.register('resolveVisualCompileDependencies') {
    group = 'verification'
    description = 'Resolves and verifies the three exact Visuals compile-only integration JARs.'
    inputs.properties(visualCompileArtifacts.collectEntries { artifact -> [
            ("${artifact.property}.url".toString()): artifact.url,
            ("${artifact.property}.sha512".toString()): artifact.sha512,
            ("${artifact.property}.override".toString()): artifact.override
    ] })
    outputs.files(visualCompileArtifacts.collect { artifact -> artifact.cached })
    // An explicit override can retain its path while its bytes change between
    // invocations. Verify the candidate every time rather than trusting
    // output-only up-to-date state as integrity evidence.
    outputs.upToDateWhen { false }
    doLast {
        visualCompileArtifacts.each { artifact ->
            File candidate = artifact.candidate
            if (!candidate.exists() && artifact.override.isEmpty()) {
                candidate.parentFile.mkdirs()
                byte[] bytes = new URL(artifact.url).bytes
                String actual = java.security.MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex().toString()
                if (!actual.equalsIgnoreCase(artifact.sha512)) {
                    throw new GradleException("Pinned ${artifact.label} SHA-512 mismatch: expected ${artifact.sha512}, got ${actual}")
                }
                candidate.bytes = bytes
            }
            if (!candidate.isFile()) throw new GradleException("Pinned ${artifact.label} JAR is missing: ${candidate}")
            String actual = java.security.MessageDigest.getInstance('SHA-512').digest(candidate.bytes).encodeHex().toString()
            if (!actual.equalsIgnoreCase(artifact.sha512)) {
                throw new GradleException("Pinned ${artifact.label} SHA-512 mismatch: expected ${artifact.sha512}, got ${actual}")
            }
        }
    }
}

dependencies {
    implementation project(':pale-mirror-api')
    compileOnly files(visualCompileArtifacts.collect { artifact -> artifact.candidate })
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') { dependsOn resolveVisualCompileDependencies }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = rootProject.providers.gradleProperty('neo_version').get()
    runs {
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/visuals-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pale_mirror_visuals'
        }
    }
    mods {
        pale_mirror_visuals {
            sourceSet sourceSets.main
        }
        pale_mirror {
            sourceSet project(':pale-mirror-api').sourceSets.main
            sourceSet project(':pale-mirror-neoforge').sourceSets.main
            sourceSet project(':pale-mirror-domain').sourceSets.main
            sourceSet project(':pale-mirror-frontier').sourceSets.main
        }
    }
}

def visualsRuntimeJars = [
        visualCompileArtifactsByProperty.geckolib_integration_jar.candidate,
        visualCompileArtifactsByProperty.villager_overhaul_integration_jar.candidate,
        file(rootProject.findProperty('supplementaries_integration_jar')
                ?: new File(runtimeModDirectory, 'supplementaries-1.21.1-3.8.8-neoforge.jar')),
        file(rootProject.findProperty('moonlight_integration_jar')
                ?: new File(runtimeModDirectory, 'moonlight-1.21.1-3.3.2-neoforge.jar')),
        visualCompileArtifactsByProperty.create_integration_jar.candidate,
        file(rootProject.findProperty('farmers_delight_integration_jar')
                ?: new File(runtimeModDirectory, 'FarmersDelight-1.21.1-1.3.2.jar')),
        file(rootProject.findProperty('zeta_integration_jar')
                ?: new File(runtimeModDirectory, 'Zeta-1.1-40.jar')),
        file(rootProject.findProperty('quark_integration_jar')
                ?: new File(runtimeModDirectory, 'Quark-4.1-482.jar'))
]

def prepareVisualsGameTestMods = tasks.register('prepareVisualsGameTestMods', Sync) {
    dependsOn resolveVisualCompileDependencies
    from visualsRuntimeJars
    into layout.buildDirectory.dir('runs/visuals-game-test/mods')
    doFirst {
        def missing = visualsRuntimeJars.findAll { !it.exists() }
        if (!missing.isEmpty()) throw new GradleException("Pinned visual runtime JARs are missing: ${missing}")
    }
}

def visualsGameTestWorld = layout.buildDirectory.dir('runs/visuals-game-test/world').get().asFile
tasks.named('runGameTestServer') {
    dependsOn prepareVisualsGameTestMods
    doFirst { visualsGameTestWorld.deleteDir() }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
            minecraft_version_range: rootProject.providers.gradleProperty('minecraft_version_range').get(),
            neo_version            : rootProject.providers.gradleProperty('neo_version').get(),
            loader_version_range   : rootProject.providers.gradleProperty('loader_version_range').get(),
            mod_version            : rootProject.providers.gradleProperty('mod_version').get()
    ]
    inputs.properties(properties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    expand(properties)
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.register('verifyVisualsJar') {
    group = 'verification'
    dependsOn tasks.named('jar')
    def archive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archive)
    doLast {
        def jar = new java.util.jar.JarFile(archive.get().asFile)
        try {
            [
                    'io/farfrontier/palemirror/visuals/PaleMirrorVisualsMod.class',
                    'io/farfrontier/palemirror/visuals/genesis/FrontierRegionPlanner.class',
                    'META-INF/neoforge.mods.toml',
                    'pale_mirror_visuals.mixins.json',
                    'pale_mirror_visuals.worldgen.mixins.json',
                    'assets/pale_mirror_visuals/textures/entity/threat_heart.png',
                    'assets/pale_mirror_visuals/geo/threat_heart.geo.json',
                    'assets/pale_mirror_visuals/geo/harvester/biomass_collector.geo.json',
                    'assets/pale_mirror_visuals/geo/harvester/crusher_stalker.geo.json',
                    'assets/pale_mirror_visuals/geo/harvester/scythe_stalker.geo.json',
                    'assets/pale_mirror_visuals/animations/harvester/biomass_collector.animation.json',
                    'assets/pale_mirror_visuals/animations/harvester/crusher_stalker.animation.json',
                    'assets/pale_mirror_visuals/animations/harvester/scythe_stalker.animation.json',
                    'assets/pale_mirror_visuals/textures/entity/harvester/biomass_collector.png',
                    'assets/pale_mirror_visuals/textures/entity/harvester/crusher_stalker.png',
                    'assets/pale_mirror_visuals/textures/entity/harvester/scythe_stalker.png',
                    'data/pale_mirror_visuals/settlement_archetype/iron_frontier.json',
                    'data/pale_mirror_visuals/structure/temperate/residence_1.nbt',
                    'data/pale_mirror_visuals/structure/temperate/mine/portal_hoist.nbt',
                    'data/pale_mirror_visuals/structure/temperate/mine/dispatch_commissioning.nbt',
                    'data/pale_mirror_visuals/structure/cold_taiga/mine/portal_hoist.nbt',
                    'data/pale_mirror_visuals/structure/cold_taiga/mine/dispatch_commissioning.nbt',
                    'data/pale_mirror_visuals/structure/dry_arid/civic_hall.nbt',
                    'data/pale_mirror_visuals/structure/dry_arid/mine/portal_hoist.nbt',
                    'data/pale_mirror_visuals/structure/dry_arid/mine/dispatch_commissioning.nbt'
            ].each { entry ->
                if (jar.getEntry(entry) == null) throw new GradleException("Visuals JAR is missing ${entry}")
            }
        } finally {
            jar.close()
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyVisualsJar') }

tasks.register('visualsIntegrationHarness', Exec) {
    group = 'verification'
    description = 'Boots final Core and Visuals JARs with pinned dependencies in a clean server twice.'
    dependsOn tasks.named('jar'), project(':pale-mirror-neoforge').tasks.named('jar')
    workingDir rootProject.projectDir
    def harnessLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def privateRuntimeJava = file(System.getenv('PALE_MIRROR_RUNTIME_JAVA')
            ?: new File(System.getProperty('user.home'),
                    '.local/share/far-frontier/java/temurin-22.0.2+9/bin/java'))
    environment 'PALE_MIRROR_JAVA', privateRuntimeJava.exists()
            ? privateRuntimeJava.absolutePath
            : harnessLauncher.get().executablePath.asFile.absolutePath
    def coreJar = project(':pale-mirror-neoforge').tasks.named('jar', Jar).flatMap { it.archiveFile }
    commandLine 'bash', 'scripts/visuals-integration-harness.sh', coreJar.get().asFile.absolutePath,
            tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath,
            runtimeModDirectory.absolutePath
}
