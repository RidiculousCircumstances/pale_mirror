version: 1

components:
  - name: domain
    path: pale-mirror-domain/src/main/java/io/farfrontier/palemirror/domain
    owns:
      - Canonical world model, deterministic simulation, domain events, Narrator, and scenario state machines
    must_not_depend_on:
      - Minecraft
      - NeoForge
      - persistence
      - adapters
      - wall-clock time
  - name: neoforge
    path: pale-mirror-neoforge/src/main/java/io/farfrontier/palemirror
    owns:
      - SavedData persistence, Minecraft observation, materialization execution, scheduling, and commands
    may_depend_on:
      - domain
      - Minecraft
      - NeoForge
  - name: adapter_api
    path: pale-mirror-neoforge/src/main/java/io/farfrontier/palemirror/api
    owns:
      - Narrow experimental SPI for optional integrations
    must_not_depend_on:
      - internal implementation types

invariants:
  - id: canonical-state
    statement: Pale Mirror is the only canonical owner of world progression, scenarios, and desired state; Minecraft and adapters are observed/materialized representations.
  - id: domain-purity
    statement: Domain code must not import Minecraft, NeoForge, persistence, adapters, wall-clock, or ambient random APIs.
  - id: materialization-safety
    statement: Materialization is performed only by NeoForge executors with persisted jobs, explicit identity, preconditions, and postconditions.
  - id: observation-boundary
    statement: Observers publish typed facts; reconciliation alone converts them into domain commands and events.
  - id: conflict-safety
    statement: Unknown or player-owned block changes are conflicts and must not be overwritten by default.
  - id: adapter-fallback
    statement: Missing optional integrations degrade to explicit adapter health states and must not block the core slice.
  - id: source-identity
    statement: Each facility has one immutable canonical InfectionSourceId; adapters and physical overlays must match it, and mixed-source composition requires an explicit future policy.
  - id: source-adapter-isolation
    statement: Source-specific identity, native mappings and source policy live only in isolated adapters; generic layers use source-neutral contracts.
  - id: controlled-effects
    statement: Every PM-authorized non-replayable physical effect has a persisted idempotency lease before execution; a RUNNING lease after restart is visible and never replayed implicitly.
  - id: pm-threat-combat
    statement: A registered Crimson or Spore form is a visual carrier only; PM persists its identity, target, health, cooldowns, movement, effects and projectile state, intercepts every incoming vanilla-compatible damage source, and never permits native AI, hurt/death, loot, terrain or infection logic.
  - id: excluded-source-items
    statement: While Crimson and Spore item progression is out of scope, their source stacks cannot craft, pickup, interact, tick, or apply melee behavior; legacy stacks are quarantined without becoming PM state.
  - id: logistics-observation
    statement: A player-built logistics route becomes canonical capacity only through a typed, bounded adapter observation; the read-only Create bridge never drives transport or force-loads route chunks.
  - id: managed-railway-commissioning
    statement: Railway Untold/Create is an explicit later industrial route provider, never an implicit default for a small campaign settlement. Its production materialization is independent and out of order by naturally loaded chunk footprints only; neither PM nor its provider may generate unseen route chunks. Initial authored-corridor construction records provenance while accepting provider transforms, later repairs fail closed on unknown changes, player schedule edits suspend canonical service, and PM remains the owner of route capacity and resource flow.
  - id: vanilla-minecart-baseline
    statement: A fresh campaign region may use the built-in low-capacity VANILLA_MINECART provider. Its complete cardinal corridor is persisted before work, each loaded segment captures baseline then checks preconditions and postconditions, and only PM-owned track, trestles and a receiving platform are written. It never loads chunks, never materializes stock, blocks on block entities or unknown later changes, and validates only an abstract RouteContract; a lease-authorized cart is representational only.
  - id: settlement-observation
    statement: Vanilla-compatible places are recognized only after a complete 400-tick loaded evidence window. Large and vertical villages resolve a stable loaded bell/home through the Minecraft POI index and require a bounded resident cluster; the player's exact position is never the identity. Reliability, freshness, representative membership and causal losses remain typed and separate, and missing entities never imply death or ruin. Campaign logistics uses a separate ground-projected infrastructure anchor so a tower bell cannot create aerial depots or rails.
  - id: settlement-actor
    statement: A settlement community, its physical place, economy, security and policy are separate canonical records; deterministic settlement policy creates crisis facts and continues acting when Narrator returns NO_SCENARIO.
  - id: route-contract
    statement: Strategic flow uses persisted RouteContract validation; WorldSites may keep multiple typed affiliations and ambiguous beneficiaries fail closed; Create observations prove capability without delivering stock directly, and capacity ages from CURRENT to STALE to EXPIRED without force-loading chunks.
  - id: presentation-read-only
    statement: FTB Quests and the in-world journal present PM facts but never own, mutate or feed back scenario progression.
  - id: transactional-resource-boundary
    statement: Physical items cross the settlement economy boundary only through a persisted bounded transfer ledger; ordinary container contents never mirror canonical stock, and reserved stacks fail closed until reconciliation completes.
  - id: pm-owned-settlement-sites
    statement: Pale Mirror materializes settlement infrastructure only inside a persisted deterministic PM-owned footprint with per-cell provenance and postconditions; observed village blocks remain read-only.
  - id: population-separation
    statement: SettlementCommunity owns social identity while PopulationGroup owns cohort counts and disposition; evacuation changes occupancy and location without deleting community identity or inferring deaths from missing entities.
  - id: settlement-catastrophe-fairness
    statement: A known critical settlement receives a persisted grace window before automatic evacuation; the objective policy continues without Narrator, and irreversible physical consequences touch only PM-owned cells.
  - id: settlement-positive-development
    statement: Stable surplus creates a persisted domain DevelopmentIntent and reserves canonical resources; capacity, housing, prosperity and growth advance only after provenance-safe PM-owned physical work is verified.
  - id: settlement-field-authority
    statement: Every campaign settlement pins a source-neutral field authority profile; native-reconciled settlements may contribute population and integrity facts while PM remains unable to move, ruin, grow or construct the native society.
  - id: operator-debug-safety
    statement: Operator debug reads projections or invokes normal validated state transitions; navigation teleports only by explicit command to a persisted physical anchor; maintenance reset is two-phase, bounded to wholly unmaterialized PM state, rechecks every precondition at commit time, and fails closed without touching Minecraft blocks, entities, chunks or foreign state.

critical_flows:
  - id: core-recovery
    path: simulation -> MineInfected -> Narrator -> scenario -> materialization job -> observation -> reconciliation -> recovery
    owner: domain plus neoforge bridge
    verification: critical-code
  - id: restart-recovery
    path: persisted job -> restart -> postcondition check -> idempotent completion
    owner: neoforge
    verification: critical-code
  - id: native-settlement-reconciliation
    path: pinned read-only adapter -> stable typed evidence -> field-authority check -> command -> canonical population reconciliation
    owner: isolated optional adapter plus generic observation bridge and domain authority profile
    verification: critical-code
  - id: optional-encounter-degradation
    path: PM anchor -> optional encounter operation -> explicit degradation -> PM recovery
    owner: neoforge adapter and materialization bridge
    verification: critical-code
  - id: crimson-sandbox
    path: PM encounter intent -> isolated Crimson actor protocol -> typed observation -> PM reconciliation
    owner: neoforge CrimsonSandboxAdapter and top-priority built-in datapack
    verification: critical-code
  - id: pm-threat-tiers
    path: deterministic simulation -> PM threat tier -> desired revision -> bounded encounter roster -> local actor runtime
    owner: domain tiers plus neoforge CrimsonSandboxAdapter
    verification: critical-code
  - id: pm-staged-infection-biome
    path: PM threat tier -> persisted tier-pinned overlay job -> registered test-mine cells -> provenance pre/postconditions -> baseline cleanup
    owner: neoforge test-mine template, materialization executor and SavedData schema persistence
    verification: critical-code
  - id: pm-source-gate
    path: APEX -> source-adapter gate plan -> PM-persisted gate parts -> adapter presentation -> unsealed PM anchor -> recovery
    owner: domain source-neutral gate state plus neoforge materialization and source adapter
    verification: critical-code
  - id: pm-crimson-visual-contract
    path: PM actor lifecycle/combat -> bounded CrimsonPresentationRuntime -> exact model frames, sounds and particles -> pinned Crimson client resources -> client rendering
    owner: neoforge CrimsonSandboxAdapter, CrimsonPresentationRuntime and pinned Crimson client pack
    verification: critical-code
  - id: pm-source-aware-site
    path: canonical InfectionSourceId -> source-neutral encounter operation -> isolated source adapter -> typed source-checked observation
    owner: domain FacilityState plus neoforge materialization and reconciliation bridge
    verification: critical-code
  - id: pm-spore-controlled-combat
    path: PM tier/composition -> persisted encounter intent -> constrained native form -> PM-owned combat HP/cooldown/movement -> typed defeat observation -> PM anchor clearance -> discard cleanup
    owner: neoforge SporeSandboxAdapter, SporeCombatRuntime, SporeMovementRuntime and PM materialization bridge
    verification: critical-code
  - id: pm-spore-global-isolation
    path: exact Spore pin -> top built-in no-spawn datapack plus isolated global-handler mixins -> entity-join provenance firewall -> PM-local actor materialization only
    owner: neoforge SporeRuntimeFirewall and the spore_sandbox built-in pack
    verification: critical-code
  - id: pm-controlled-effect-lease
    path: PM actor action -> persisted effect lease -> physical bounded effect -> terminal receipt -> restart deduplication/compaction
    owner: neoforge ControlledEffectExecutor and EffectLeaseLedger
    verification: critical-code
  - id: pm-targeted-projectile
    path: PM action -> persisted projectile target/provenance -> source visual carrier -> PM impact lease -> target-only PM damage or discard -> restart-safe expiry
    owner: neoforge ThreatCombatLedger, PmProjectileRuntime and source-isolated projectile runtimes
    verification: critical-code
  - id: pm-excluded-source-item-firewall
    path: source item stack -> interaction/craft/pickup/inventory/melee boundary -> denied action -> quarantine diagnostic
    owner: neoforge ExcludedSourceItemFirewall, ItemStack mixin and event observers
    verification: critical-code
  - id: living-region-supply
    path: typed place evidence -> Community/Place binding -> Mine -> RouteContract -> ResourceAccount -> SettlementPolicy -> objective crisis -> combat/logistics outcome
    owner: domain settlement actor model plus NeoForge evidence, presentation and logistics bridges
    verification: critical-code
  - id: create-same-vehicle-proof
    path: named loaded station -> opaque native vehicle observation -> second endpoint observation -> bounded same-vehicle proof -> canonical route capacity
    owner: NeoForge Create adapter and regional logistics reconciliation
    verification: critical-code
  - id: managed-regional-railway
    path: explicit industrial RouteProvider selection -> persisted regional plan -> guarded MineSite commissioning -> schema-v26 loaded-chunks-only railway plan -> independently loaded segment footprint -> persisted RUNNING/track/support postconditions -> complete Create graph -> independently loaded endpoint stations -> origin-loaded train assembly -> baseline arrival -> strict post-baseline provenance -> canonical RouteContract validation
    owner: NeoForge ManagedRailwayRuntime plus generic adapter boundary and isolated Railway Untold provider; domain owns route and flow
    verification: critical-code
  - id: vanilla-regional-freight
    path: fresh eligible place -> persisted vanilla RouteProvider contract -> guarded MineSite commissioning -> persisted cardinal vanilla route job -> naturally loaded segment -> capture -> precondition -> PM-owned rail/trestle/platform postcondition -> provenance verification -> RouteContract validation -> lease-authorized representative cart
    owner: NeoForge VanillaMinecartRouteRuntime and isolated VanillaMinecartRailAdapter; domain owns route and flow
    verification: critical-code
  - id: settlement-resource-transfer
    path: depot interaction -> persisted PREPARED receipt -> reserved physical stack or canonical debit -> domain command/event -> physical completion -> bounded compaction
    owner: domain economy plus NeoForge resource transfer ledger and depot executor
    verification: critical-code
  - id: settlement-displacement
    path: objective critical state -> persisted grace window -> manual or automatic evacuation -> PopulationGroup disposition -> empty place -> PM-owned ruin/camp representation
    owner: domain emergency policy plus NeoForge provenance-safe settlement presentation
    verification: critical-code
  - id: settlement-development
    path: stable surplus -> development pressure -> reserved IRON -> persisted intent -> PM-owned storehouse postcondition -> capacity/prosperity/housing -> bounded population growth
    owner: domain development policy plus NeoForge storehouse executor
    verification: critical-code
  - id: operator-runtime-debug
    path: typed projections -> operator diagnostics/particle markers/location links -> explicit navigation or canonical command or two-phase safe maintenance
    owner: NeoForge runtime debug service/controller/navigator; domain and physical adapters remain authoritative for changes
    verification: critical-code
